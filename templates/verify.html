<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>وثاق - التوثيق الآمن</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { background: #0a0a2a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #fff; color: #333; padding: 20px; border-radius: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; border-radius: 25px; border: none; background: #2c7da0; color: #fff; cursor: pointer; margin-top: 10px; }
        video { width: 100%; border-radius: 15px; transform: scaleX(-1); background: #000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 وثاق | التوثيق</h1>

    <div id="step1" class="card">
        <h3>🆔 1. رفع الهوية</h3>
        <input type="file" id="idCardInput">
        <button onclick="processIdentity()">تحقق من الهوية</button>
    </div>

    <div id="step2" class="card hidden">
        <h3>🧠 2. اختبار الحيوية (يسار ثم يمين)</h3>
        <video id="camera" autoplay muted playsinline></video>
        <button onclick="startLivenessTest()">بدء الاختبار</button>
    </div>
</div>

<script>
    let idFile = null;
    let idDescriptor = null;
    let faceDescriptor = null;
    let headMovements = { left: false, right: false };

    // استقبال ملف الهوية
    document.getElementById('idCardInput').addEventListener('change', (e) => idFile = e.target.files[0]);

    async function processIdentity() {
        if (!idFile) return alert("يرجى رفع صورة الهوية");
        // هنا يتم استدعاء face-api لاستخراج بصمة الهوية
        // بعد الاستخراج الناجح، ننتقل للخطوة الثانية
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        startCamera();
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('camera').srcObject = stream;
    }

    async function submitFinalVerification() {
        // الربط بالـ API باستخدام FormData (كما اتفقنا في app.py)
        const formData = new FormData();
        formData.append('id_card', idFile);
        formData.append('face_descriptor', JSON.stringify(faceDescriptor));
        formData.append('doc_descriptor', JSON.stringify(idDescriptor));
        formData.append('liveness_data', JSON.stringify({ head_movements: headMovements }));

        const response = await fetch('/verify-identity', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        if (result.success) {
            alert("✅ تم التوثيق بنجاح!");
        } else {
            alert("❌ " + result.error);
        }
    }
</script>
</body>
</html>
