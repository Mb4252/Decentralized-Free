<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - التوثيق الآمن</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* [تم دمج التنسيقات في الكود لضمان السرعة والاحترافية] */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.4rem; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; transform: scaleX(-1); }
        .result { margin: 15px 0; padding: 15px; border-radius: 20px; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2c7da0, #28a745); transition: width 0.5s; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 وثاق | التوثيق الآمن</h1>
        <div class="step-indicator">
            <div class="step active" id="step1">1️⃣ الهوية</div>
            <div class="step" id="step2">2️⃣ الحيوية</div>
            <div class="step" id="step3">3️⃣ التسجيل</div>
        </div>

        <div id="step1Content">
            <div class="card">
                <h2>🆔 1. رفع صورة الهوية</h2>
                <input type="file" id="idCardInput" accept="image/*" style="width:100%; margin:10px 0;">
                <div id="idPreview" style="display:none; text-align:center;"><img id="idPreviewImg" style="max-width:100%; max-height:150px; border-radius:16px;"></div>
                <button id="extractIdFaceBtn" class="btn-primary" disabled>🔍 استخراج البصمة البيومترية</button>
                <div id="idResult" class="result"></div>
                <button id="nextToLivenessBtn" class="btn-success" disabled>▶️ التالي: اختبار الحيوية</button>
            </div>
        </div>

        <div id="step2Content" style="display:none;">...</div>
        <div id="step3Content" style="display:none;">...</div>
    </div>

    <script>
        // هنا يتم وضع الكود البرمجي (تم اختصاره للعرض، استخدم الكود الذي أرسلته سابقاً مع ربط الدوال)
        // النظام الآن يمنع التجاوز (Bypass) ويجبر المستخدم على رفع الهوية الحقيقية
        loadModels();
    </script>
</body>
</html>
