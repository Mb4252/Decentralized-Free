<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - التوثيق الآمن</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.4rem; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .result { margin: 15px 0; padding: 15px; border-radius: 20px; text-align: center; font-size: 0.9rem; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2c7da0, #28a745); transition: width 0.5s; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .camera-preview { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; }
        .guidance-text { font-size: 0.9rem; text-align: center; margin: 10px 0; padding: 8px; border-radius: 40px; }
        .guidance-good { background: #d4edda; color: #155724; }
        .guidance-warning { background: #fff3cd; color: #856404; }
        .guidance-bad { background: #f8d7da; color: #721c24; }
        .hidden { display: none; }
        .flex-buttons { display: flex; gap: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🔐 وثاق | التوثيق الآمن</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ الدعوة</div>
        <div class="step" id="step2">2️⃣ الهوية</div>
        <div class="step" id="step3">3️⃣ الوجه</div>
        <div class="step" id="step4">4️⃣ التسجيل</div>
    </div>

    <!-- الخطوة 1: رمز الدعوة -->
    <div id="step1Content">
        <div class="card">
            <h2>🎫 1. رمز الدعوة</h2>
            <p id="inviteMessage" style="font-size:0.85rem; color:#666;">أدخل رمز الدعوة (أو اتركه فارغاً للمستخدمين الأوائل)</p>
            <input type="text" id="inviteCode" placeholder="XXXX-XXXX-XXXX" style="width:100%; padding:12px; border-radius:40px; border:1px solid #ddd; margin:10px 0; text-align:center;">
            <button id="verifyInviteBtn" class="btn-primary">🔍 التحقق</button>
            <div id="inviteResult" class="result"></div>
            <button id="nextToIdentityBtn" class="btn-success" disabled>▶️ التالي</button>
        </div>
    </div>

    <!-- الخطوة 2: تصوير الهوية (Auto-Capture) -->
    <div id="step2Content" style="display:none;">
        <div class="card">
            <h2>🆔 2. تصوير الهوية</h2>
            <p style="font-size:0.85rem; color:#666; text-align:center;">ضع المستند أمام الكاميرا - سيتم الالتقاط تلقائياً</p>
            
            <video id="docCamera" autoplay muted playsinline class="camera-preview"></video>
            
            <div id="docGuidance" class="guidance-text guidance-info"></div>
            <div id="docProgress" class="progress-bar hidden"><div class="progress-fill" id="docProgressFill"></div></div>
            
            <canvas id="docCanvas" style="display:none;"></canvas>
            <img id="capturedImage" style="display:none;">
            
            <div id="docResult" class="result hidden"></div>
            <button id="nextToFaceBtn" class="btn-success" style="display:none;">▶️ التالي: تصوير الوجه</button>
            <button id="retryDocBtn" class="btn-warning" style="display:none;">🔄 إعادة التصوير</button>
        </div>
    </div>

    <!-- الخطوة 3: تصوير الوجه (Auto-Capture) -->
    <div id="step3Content" style="display:none;">
        <div class="card">
            <h2>👤 3. تصوير الوجه</h2>
            <p style="font-size:0.85rem; color:#666; text-align:center;">وجه الكاميرا نحو وجهك - سيتم الالتقاط تلقائياً</p>
            
            <video id="faceCamera" autoplay muted playsinline class="camera-preview"></video>
            
            <div id="faceGuidance" class="guidance-text guidance-info"></div>
            <div id="faceProgress" class="progress-bar hidden"><div class="progress-fill" id="faceProgressFill"></div></div>
            
            <canvas id="faceCanvas" style="display:none;"></canvas>
            
            <div id="faceResult" class="result hidden"></div>
            <button id="nextToRegisterBtn" class="btn-success" style="display:none;">▶️ التالي: التسجيل</button>
            <button id="retryFaceBtn" class="btn-warning" style="display:none;">🔄 إعادة التصوير</button>
        </div>
    </div>

    <!-- الخطوة 4: التسجيل -->
    <div id="step4Content" style="display:none;">
        <div class="card">
            <h2>✅ 4. تسجيل الهوية</h2>
            <div id="registerResult" class="result"></div>
            <button id="goToProfileBtn" class="btn-success" style="display:none;">📁 الملف الشخصي</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // نظام التوثيق الآمن - Zero-Persistence
    // جميع الصور تُعالج في الذاكرة فقط
    // ============================================================
    
    let modelsLoaded = false;
    let step = 1;
    let sessionToken = null;
    let inviteCode = null;
    let documentVerified = false;
    let faceEmbedding = null;
    let documentHash = null;
    let capturedDocImage = null;
    
    // كاميرات
    let docStream = null;
    let faceStream = null;
    let docCameraActive = false;
    let faceCameraActive = false;
    
    // إعدادات Auto-Capture
    let autoCaptureInterval = null;
    let qualityCheckInterval = null;
    let lastQualityScore = 0;
    
    // عناصر DOM
    const inviteCodeInput = document.getElementById('inviteCode');
    const verifyInviteBtn = document.getElementById('verifyInviteBtn');
    const inviteResult = document.getElementById('inviteResult');
    const nextToIdentityBtn = document.getElementById('nextToIdentityBtn');
    const nextToFaceBtn = document.getElementById('nextToFaceBtn');
    const nextToRegisterBtn = document.getElementById('nextToRegisterBtn');
    const goToProfileBtn = document.getElementById('goToProfileBtn');
    const retryDocBtn = document.getElementById('retryDocBtn');
    const retryFaceBtn = document.getElementById('retryFaceBtn');
    
    const docCamera = document.getElementById('docCamera');
    const faceCamera = document.getElementById('faceCamera');
    const docCanvas = document.getElementById('docCanvas');
    const faceCanvas = document.getElementById('faceCanvas');
    const docGuidance = document.getElementById('docGuidance');
    const faceGuidance = document.getElementById('faceGuidance');
    const docProgress = document.getElementById('docProgress');
    const faceProgress = document.getElementById('faceProgress');
    const docProgressFill = document.getElementById('docProgressFill');
    const faceProgressFill = document.getElementById('faceProgressFill');
    const docResult = document.getElementById('docResult');
    const faceResult = document.getElementById('faceResult');
    const registerResult = document.getElementById('registerResult');
    
    // ------------------- تحميل النماذج وبدء الجلسة -------------------
    async function initSession() {
        try {
            const response = await fetch('/init-session', { method: 'POST' });
            const data = await response.json();
            sessionToken = data.session_token;
            console.log("✅ جلسة جديدة:", sessionToken);
        } catch(e) {
            console.error("فشل بدء الجلسة", e);
        }
    }
    
    async function loadModels() {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
        } catch(err) {
            console.error(err);
        }
    }
    
    // ------------------- التحقق من جودة الصورة (للـ Auto-Capture) -------------------
    async function checkImageQuality(videoElement, type = 'document') {
        const detection = await faceapi.detectSingleFace(videoElement).withFaceLandmarks();
        
        if (!detection) {
            if (type === 'document') updateGuidance('doc', '⚠️ لم يتم اكتشاف وجه', 'bad');
            else updateGuidance('face', '⚠️ لم يتم اكتشاف وجه', 'bad');
            return { quality: 0, isPerfect: false };
        }
        
        const box = detection.detection.box;
        const videoWidth = videoElement.videoWidth;
        const videoHeight = videoElement.videoHeight;
        
        // حساب تمركز الوجه
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;
        const isCentered = Math.abs(centerX - videoWidth / 2) < videoWidth * 0.15 &&
                          Math.abs(centerY - videoHeight / 2) < videoHeight * 0.15;
        
        // حساب حجم الوجه
        const faceSize = (box.width * box.height) / (videoWidth * videoHeight);
        const isGoodSize = (type === 'document') ? 
            (faceSize > 0.03 && faceSize < 0.2) : 
            (faceSize > 0.1 && faceSize < 0.4);
        
        // تحليل الإضاءة
        const canvas = document.createElement('canvas');
        canvas.width = box.width;
        canvas.height = box.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
        const imageData = ctx.getImageData(0, 0, box.width, box.height);
        const pixels = imageData.data;
        let brightness = 0;
        for (let i = 0; i < pixels.length; i += 4) {
            brightness += (pixels[i] + pixels[i+1] + pixels[i+2]) / 3;
        }
        brightness /= (pixels.length / 4);
        const isGoodLighting = brightness > 80 && brightness < 220;
        
        // إرشادات
        if (!isCentered) {
            if (centerX < videoWidth / 2 - videoWidth * 0.1) updateGuidance(type, '👉 اتجه قليلاً لليمين', 'warning');
            else if (centerX > videoWidth / 2 + videoWidth * 0.1) updateGuidance(type, '👈 اتجه قليلاً لليسار', 'warning');
            else if (centerY < videoHeight / 2 - videoHeight * 0.1) updateGuidance(type, '👇 اخفض وجهك قليلاً', 'warning');
            else if (centerY > videoHeight / 2 + videoHeight * 0.1) updateGuidance(type, '👆 ارفع وجهك قليلاً', 'warning');
        } else if (!isGoodSize) {
            if (faceSize < (type === 'document' ? 0.03 : 0.1)) updateGuidance(type, '🔍 اقترب من الكاميرا', 'warning');
            else updateGuidance(type, '🔍 ابتعد قليلاً عن الكاميرا', 'warning');
        } else if (!isGoodLighting) {
            updateGuidance(type, '💡 اضبط الإضاءة', 'warning');
        } else {
            updateGuidance(type, '✅ وضع ممتاز! جاري الالتقاط...', 'good');
        }
        
        const qualityScore = (isCentered ? 40 : 0) + (isGoodSize ? 30 : 0) + (isGoodLighting ? 30 : 0);
        const isPerfect = isCentered && isGoodSize && isGoodLighting;
        
        return { quality: qualityScore, isPerfect, detection };
    }
    
    function updateGuidance(type, message, level) {
        const element = type === 'doc' ? docGuidance : faceGuidance;
        element.innerHTML = message;
        element.className = `guidance-text guidance-${level}`;
    }
    
    // ------------------- Auto-Capture للهوية -------------------
    async function startDocAutoCapture() {
        if (autoCaptureInterval) clearInterval(autoCaptureInterval);
        if (qualityCheckInterval) clearInterval(qualityCheckInterval);
        
        let perfectFrames = 0;
        const requiredPerfectFrames = 5;
        
        qualityCheckInterval = setInterval(async () => {
            const { quality, isPerfect } = await checkImageQuality(docCamera, 'document');
            docProgressFill.style.width = `${quality}%`;
            
            if (isPerfect) {
                perfectFrames++;
                if (perfectFrames >= requiredPerfectFrames) {
                    clearInterval(qualityCheckInterval);
                    captureDocumentImage();
                }
            } else {
                perfectFrames = 0;
            }
        }, 200);
    }
    
    async function captureDocumentImage() {
        docProgress.classList.add('hidden');
        docGuidance.innerHTML = '📸 جاري الالتقاط والمعالجة...';
        
        const canvas = docCanvas;
        canvas.width = docCamera.videoWidth;
        canvas.height = docCamera.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(docCamera, 0, 0);
        
        // تحويل إلى Blob (في الذاكرة فقط)
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
        
        // إرسال للخادم للتحقق
        const formData = new FormData();
        formData.append('document_image', blob, 'document.jpg');
        
        docResult.classList.remove('hidden');
        docResult.innerHTML = '<span class="info">🔍 جاري التحقق من المستند...</span>';
        
        try {
            const response = await fetch('/verify-document', {
                method: 'POST',
                headers: { 'X-Session-Token': sessionToken },
                body: formData
            });
            const result = await response.json();
            
            if (result.is_authentic) {
                documentVerified = true;
                documentHash = result.document_hash || CryptoJS.SHA256(Math.random().toString()).toString();
                docResult.innerHTML = `<span class="success">✅ المستند أصلي! (نسبة الثقة: ${result.total_score}%)</span>`;
                nextToFaceBtn.style.display = 'block';
                retryDocBtn.style.display = 'block';
            } else {
                docResult.innerHTML = `<span class="error">❌ المستند غير أصلي! (نسبة الثقة: ${result.total_score}%)</span>`;
                retryDocBtn.style.display = 'block';
            }
        } catch(err) {
            docResult.innerHTML = `<span class="error">❌ خطأ: ${err.message}</span>`;
            retryDocBtn.style.display = 'block';
        }
        
        // مسح الـ blob من الذاكرة
        URL.revokeObjectURL(URL.createObjectURL(blob));
    }
    
    // ------------------- Auto-Capture للوجه -------------------
    async function startFaceAutoCapture() {
        if (autoCaptureInterval) clearInterval(autoCaptureInterval);
        if (qualityCheckInterval) clearInterval(qualityCheckInterval);
        
        let perfectFrames = 0;
        const requiredPerfectFrames = 5;
        
        qualityCheckInterval = setInterval(async () => {
            const { quality, isPerfect, detection } = await checkImageQuality(faceCamera, 'face');
            faceProgressFill.style.width = `${quality}%`;
            
            if (isPerfect) {
                perfectFrames++;
                if (perfectFrames >= requiredPerfectFrames) {
                    clearInterval(qualityCheckInterval);
                    captureFaceImage(detection);
                }
            } else {
                perfectFrames = 0;
            }
        }, 200);
    }
    
    async function captureFaceImage(detection) {
        faceProgress.classList.add('hidden');
        faceGuidance.innerHTML = '📸 جاري الالتقاط واستخراج البصمة...';
        
        const canvas = faceCanvas;
        canvas.width = faceCamera.videoWidth;
        canvas.height = faceCamera.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(faceCamera, 0, 0);
        
        // استخراج بصمة الوجه من الصورة
        const img = new Image();
        img.src = canvas.toDataURL();
        await new Promise(r => { img.onload = r; });
        
        const faceDetection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        
        if (faceDetection) {
            faceEmbedding = Array.from(faceDetection.descriptor);
        }
        
        faceResult.classList.remove('hidden');
        
        if (faceEmbedding) {
            faceResult.innerHTML = '<span class="success">✅ تم استخراج بصمة الوجه بنجاح!</span>';
            nextToRegisterBtn.style.display = 'block';
            retryFaceBtn.style.display = 'block';
        } else {
            faceResult.innerHTML = '<span class="error">❌ فشل استخراج بصمة الوجه</span>';
            retryFaceBtn.style.display = 'block';
        }
    }
    
    // ------------------- إعادة المحاولة -------------------
    retryDocBtn.onclick = () => {
        docResult.classList.add('hidden');
        docResult.innerHTML = '';
        retryDocBtn.style.display = 'none';
        nextToFaceBtn.style.display = 'none';
        startDocAutoCapture();
    };
    
    retryFaceBtn.onclick = () => {
        faceResult.classList.add('hidden');
        faceResult.innerHTML = '';
        retryFaceBtn.style.display = 'none';
        nextToRegisterBtn.style.display = 'none';
        startFaceAutoCapture();
    };
    
    // ------------------- التنقل بين الخطوات -------------------
    verifyInviteBtn.onclick = async () => {
        const code = inviteCodeInput.value.trim().toUpperCase();
        const statusRes = await fetch('/system-status');
        const status = await statusRes.json();
        
        if (!status.invite_only_mode) {
            inviteCode = null;
            inviteResult.innerHTML = '<span class="success">✅ مرحباً بك!</span>';
            nextToIdentityBtn.disabled = false;
            return;
        }
        
        if (!code) {
            inviteResult.innerHTML = '<span class="error">❌ الرجاء إدخال رمز الدعوة</span>';
            return;
        }
        
        inviteCode = code;
        inviteResult.innerHTML = '<span class="success">✅ رمز صالح!</span>';
        nextToIdentityBtn.disabled = false;
    };
    
    nextToIdentityBtn.onclick = async () => {
        step = 2;
        updateSteps();
        document.getElementById('step1Content').style.display = 'none';
        document.getElementById('step2Content').style.display = 'block';
        
        if (docStream) docStream.getTracks().forEach(t => t.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        docStream = stream;
        docCamera.srcObject = stream;
        await docCamera.play();
        
        docProgress.classList.remove('hidden');
        startDocAutoCapture();
    };
    
    nextToFaceBtn.onclick = async () => {
        step = 3;
        updateSteps();
        document.getElementById('step2Content').style.display = 'none';
        document.getElementById('step3Content').style.display = 'block';
        
        if (docStream) docStream.getTracks().forEach(t => t.stop());
        if (faceStream) faceStream.getTracks().forEach(t => t.stop());
        
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        faceStream = stream;
        faceCamera.srcObject = stream;
        await faceCamera.play();
        
        faceProgress.classList.remove('hidden');
        startFaceAutoCapture();
    };
    
    nextToRegisterBtn.onclick = async () => {
        if (!faceEmbedding) {
            faceResult.innerHTML = '<span class="error">❌ يرجى تصوير الوجه أولاً</span>';
            return;
        }
        
        nextToRegisterBtn.disabled = true;
        nextToRegisterBtn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        const payload = {
            name: "مستخدم موثق",
            face_embedding: faceEmbedding,
            document_hash: documentHash,
            document_type: "secure_identity",
            invite_code: inviteCode,
            session_data: { document_verified: documentVerified }
        };
        
        try {
            const response = await fetch('/verify-identity', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Session-Token': sessionToken
                },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            step = 4;
            updateSteps();
            document.getElementById('step3Content').style.display = 'none';
            document.getElementById('step4Content').style.display = 'block';
            
            if (response.ok) {
                registerResult.innerHTML = `<div class="success">✅ ${result.message}<br>رقم الكتلة: ${result.block_index}</div>`;
                goToProfileBtn.style.display = 'block';
            } else {
                registerResult.innerHTML = `<div class="error">❌ ${result.error}</div>`;
                nextToRegisterBtn.disabled = false;
                nextToRegisterBtn.innerHTML = "▶️ إعادة المحاولة";
            }
        } catch(err) {
            registerResult.innerHTML = `<div class="error">❌ خطأ: ${err.message}</div>`;
            nextToRegisterBtn.disabled = false;
            nextToRegisterBtn.innerHTML = "▶️ إعادة المحاولة";
        }
    };
    
    goToProfileBtn.onclick = () => {
        window.location.href = '/profile';
    };
    
    function updateSteps() {
        for(let i=1; i<=4; i++) {
            const el = document.getElementById(`step${i}`);
            if(i < step) { el.classList.add('completed'); el.classList.remove('active'); }
            else if(i === step) { el.classList.add('active'); el.classList.remove('completed'); }
            else { el.classList.remove('active', 'completed'); }
        }
    }
    
    // ------------------- بدء التشغيل -------------------
    initSession();
    loadModels();
    updateSteps();
</script>
</body>
</html>
