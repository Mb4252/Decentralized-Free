<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - التوثيق الآمن</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.4rem; margin: 0 0 10px 0; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:disabled { background: #b0d9bd; cursor: not-allowed; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; transform: scaleX(-1); }
        .result { margin: 15px 0; padding: 15px; border-radius: 20px; text-align: center; font-size: 0.9rem; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2c7da0, #28a745); transition: width 0.5s; }
        .direction-badge { display: inline-block; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; margin: 5px; }
        .direction-completed { background: #28a745; color: white; }
        .direction-pending { background: #6c757d; color: white; }
        .stability-timer { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 10px 0; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .step.locked { background: #6c757d; color: white; }
        .preview-img { max-width: 100%; max-height: 180px; border-radius: 16px; margin-top: 10px; border: 2px solid #28a745; }
        .required-badge { background: #dc3545; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-right: 8px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .file-input { width: 100%; padding: 12px; border-radius: 40px; border: 1px solid #ddd; margin: 10px 0; background: white; cursor: pointer; }
        .image-container { text-align: center; margin: 15px 0; padding: 10px; background: #f0f8ff; border-radius: 16px; display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🔐 وثاق | التوثيق الآمن</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ الهوية <span class="required-badge">إجباري</span></div>
        <div class="step locked" id="step2">2️⃣ الحيوية 🔒</div>
        <div class="step locked" id="step3">3️⃣ التسجيل 🔒</div>
    </div>

    <!-- الخطوة 1: رفع الهوية -->
    <div id="step1Content">
        <div class="card">
            <h2>🆔 1. رفع صورة الهوية</h2>
            <p style="font-size:0.85rem; color:#dc3545;">⚠️ هذه الخطوة إجبارية - لا يمكن التقدم بدونها</p>
            
            <input type="file" id="idCardInput" accept="image/jpeg,image/png,image/jpg" class="file-input">
            
            <div id="imageContainer" class="image-container">
                <img id="previewImage" class="preview-img">
                <p style="color:#28a745; margin-top:5px;">✅ تم رفع الصورة بنجاح</p>
            </div>
            
            <button id="extractBtn" class="btn-primary" disabled>🔍 استخراج بصمة الوجه من الهوية</button>
            <div id="resultMsg" class="result"></div>
            <div class="progress-bar" id="progressBar" style="display:none;"><div class="progress-fill" id="progressFill"></div></div>
            
            <button id="nextBtn" class="btn-success" disabled>🔒 تأكد من الهوية أولاً</button>
        </div>
    </div>

    <!-- الخطوة 2: اختبار الحيوية -->
    <div id="step2Content" style="display:none;">
        <div class="card">
            <h2>🧠 2. اختبار الحيوية</h2>
            
            <div id="stabilityPhase">
                <p style="text-align:center;">📷 يرجى تثبيت وجهك أمام الكاميرا</p>
                <div class="stability-timer" id="stabilityTimer">3</div>
                <div class="progress-bar"><div class="progress-fill" id="stabilityProgress" style="width:0%"></div></div>
            </div>
            
            <div id="headTrackingPhase" style="display:none;">
                <p style="text-align:center;">🔄 حرك رأسك في الاتجاهات المطلوبة</p>
                <video id="camera" autoplay muted playsinline></video>
                <div style="text-align:center; margin: 15px 0;">
                    <span id="leftIndicator" class="direction-badge direction-pending">⬅️ يسار</span>
                    <span id="rightIndicator" class="direction-badge direction-pending">➡️ يمين</span>
                </div>
                <div id="livenessStatus" class="info"></div>
            </div>
            
            <button id="startLivenessBtn" class="btn-primary" style="display:none;">🎯 بدء اختبار الحيوية</button>
            <div id="livenessResult" class="result"></div>
            <button id="nextToVerifyBtn" class="btn-success" style="display:none;">✅ المتابعة للتسجيل</button>
        </div>
    </div>

    <!-- الخطوة 3: التسجيل -->
    <div id="step3Content" style="display:none;">
        <div class="card">
            <h2>✅ 3. تسجيل الهوية</h2>
            <div id="verificationResult" class="result"></div>
            <button id="registerFinalBtn" class="btn-success" disabled>📝 تسجيل الهوية</button>
            <div id="registerStatus" class="result"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // نظام التوثيق الآمن - نسخة بسيطة ومضمونة
    // ============================================================
    
    let modelsLoaded = false;
    let cameraStream = null;
    let step = 1;
    let idDescriptor = null;
    let faceDescriptor = null;
    let headMovements = { left: false, right: false };
    let identityVerified = false;
    
    // عناصر DOM
    const fileInput = document.getElementById('idCardInput');
    const imageContainer = document.getElementById('imageContainer');
    const previewImage = document.getElementById('previewImage');
    const extractBtn = document.getElementById('extractBtn');
    const resultMsg = document.getElementById('resultMsg');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const nextBtn = document.getElementById('nextBtn');
    const startLivenessBtn = document.getElementById('startLivenessBtn');
    const livenessResult = document.getElementById('livenessResult');
    const nextToVerifyBtn = document.getElementById('nextToVerifyBtn');
    const registerFinalBtn = document.getElementById('registerFinalBtn');
    const camera = document.getElementById('camera');
    
    // ------------------- تحميل النماذج -------------------
    async function loadModels() {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        resultMsg.innerHTML = '<span class="info">⏳ جاري تحميل النماذج...</span>';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        modelsLoaded = true;
        resultMsg.innerHTML = '<span class="success">✅ النماذج جاهزة</span>';
        setTimeout(() => resultMsg.innerHTML = '', 2000);
    }
    
    // ------------------- رفع الصورة وعرضها (حل بسيط ومضمون) -------------------
    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        
        if (!file) {
            console.log("❌ لم يتم اختيار ملف");
            return;
        }
        
        console.log("✅ تم اختيار الملف:", file.name, file.type);
        
        if (!file.type.startsWith('image/')) {
            resultMsg.innerHTML = '<span class="error">❌ يرجى اختيار ملف صورة (jpg, png)</span>';
            return;
        }
        
        const reader = new FileReader();
        
        reader.onload = function(e) {
            console.log("✅ تم قراءة الملف، عرض الصورة الآن");
            previewImage.src = e.target.result;
            imageContainer.style.display = 'block';
            extractBtn.disabled = false;
            resultMsg.innerHTML = '<span class="success">✅ تم رفع الصورة! اضغط "استخراج بصمة الوجه"</span>';
        };
        
        reader.onerror = function(e) {
            console.error("❌ خطأ في قراءة الملف:", e);
            resultMsg.innerHTML = '<span class="error">❌ حدث خطأ في قراءة الملف</span>';
        };
        
        reader.readAsDataURL(file);
    });
    
    // ------------------- استخراج بصمة الوجه -------------------
    extractBtn.onclick = async () => {
        if (!previewImage.src) {
            resultMsg.innerHTML = '<span class="error">❌ يرجى رفع صورة الهوية أولاً</span>';
            return;
        }
        
        extractBtn.disabled = true;
        extractBtn.innerHTML = '<span class="spinner"></span> جاري الاستخراج...';
        resultMsg.innerHTML = '<span class="info">🔍 جاري استخراج بصمة الوجه...</span>';
        progressBar.style.display = 'block';
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += 20;
            progressFill.style.width = progress + '%';
            if (progress >= 100) clearInterval(interval);
        }, 200);
        
        await new Promise(r => setTimeout(r, 1000));
        
        const img = new Image();
        img.src = previewImage.src;
        await new Promise(r => { img.onload = r; });
        
        const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        
        if (!detection) {
            resultMsg.innerHTML = '<span class="warning">⚠️ لم يتم العثور على وجه. حاول بصورة أوضح.</span>';
            extractBtn.disabled = false;
            extractBtn.innerHTML = "🔍 إعادة المحاولة";
            progressBar.style.display = 'none';
            identityVerified = false;
            return;
        }
        
        idDescriptor = Array.from(detection.descriptor);
        const idHash = CryptoJS.SHA256(JSON.stringify(idDescriptor)).toString().substring(0, 16);
        identityVerified = true;
        
        resultMsg.innerHTML = `<span class="success">✅ تم استخراج بصمة الهوية! (${idHash})</span>`;
        progressBar.style.display = 'none';
        
        nextBtn.disabled = false;
        nextBtn.style.background = "#28a745";
        nextBtn.innerHTML = "▶️ التالي: اختبار الحيوية";
        
        extractBtn.disabled = false;
        extractBtn.innerHTML = "🔍 إعادة الاستخراج";
        
        document.getElementById('step2').classList.remove('locked');
        document.getElementById('step2').classList.add('active');
        document.getElementById('step2').innerHTML = "2️⃣ الحيوية";
    };
    
    // ------------------- الانتقال للخطوة 2 -------------------
    nextBtn.onclick = async () => {
        if (!identityVerified || !idDescriptor) {
            resultMsg.innerHTML = '<span class="error">❌ يجب استخراج بصمة الهوية أولاً!</span>';
            return;
        }
        
        step = 2;
        updateSteps();
        document.getElementById('step1Content').style.display = 'none';
        document.getElementById('step2Content').style.display = 'block';
        
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        cameraStream = stream;
        camera.srcObject = stream;
        await camera.play();
        
        startLivenessBtn.style.display = 'block';
    };
    
    // ------------------- بقية دوال الحيوية والتسجيل (بنفس النسخة السابقة) -------------------
    async function runStabilityPhase() {
        const stabilityPhase = document.getElementById('stabilityPhase');
        const headTrackingPhase = document.getElementById('headTrackingPhase');
        
        stabilityPhase.style.display = 'block';
        headTrackingPhase.style.display = 'none';
        
        for (let i = 3; i > 0; i--) {
            document.getElementById('stabilityTimer').innerHTML = i;
            document.getElementById('stabilityProgress').style.width = ((3 - i) / 3) * 100 + '%';
            await new Promise(r => setTimeout(r, 1000));
        }
        
        document.getElementById('stabilityTimer').innerHTML = '✅ ثابت';
        document.getElementById('stabilityProgress').style.width = '100%';
        await new Promise(r => setTimeout(r, 500));
        
        stabilityPhase.style.display = 'none';
        headTrackingPhase.style.display = 'block';
        startHeadTracking();
    }
    
    let headTrackingInterval = null;
    
    async function startHeadTracking() {
        headMovements = { left: false, right: false };
        const leftIndicator = document.getElementById('leftIndicator');
        const rightIndicator = document.getElementById('rightIndicator');
        leftIndicator.className = 'direction-badge direction-pending';
        rightIndicator.className = 'direction-badge direction-pending';
        document.getElementById('livenessStatus').innerHTML = '🔄 حرك رأسك لليسار أولاً';
        
        if (headTrackingInterval) clearInterval(headTrackingInterval);
        
        headTrackingInterval = setInterval(async () => {
            const detection = await faceapi.detectSingleFace(camera).withFaceLandmarks();
            if (!detection) return;
            
            const nose = detection.landmarks.getNose();
            const jaw = detection.landmarks.getJawOutline();
            if (!nose || nose.length < 3 || !jaw) return;
            
            const noseTip = nose[2];
            const faceCenterX = (jaw[0].x + jaw[jaw.length-1].x) / 2;
            const offset = (noseTip.x - faceCenterX) / detection.detection.box.width;
            
            if (offset < -0.08 && !headMovements.left) {
                headMovements.left = true;
                leftIndicator.className = 'direction-badge direction-completed';
                document.getElementById('livenessStatus').innerHTML = '✅ تم كشف اليسار! حرك رأسك لليمين';
            } else if (offset > 0.08 && headMovements.left && !headMovements.right) {
                headMovements.right = true;
                rightIndicator.className = 'direction-badge direction-completed';
                document.getElementById('livenessStatus').innerHTML = '✅ تم كشف اليمين!';
            }
            
            if (headMovements.left && headMovements.right) {
                clearInterval(headTrackingInterval);
                livenessResult.innerHTML = '<span class="success">✅ اختبار الحيوية ناجح!</span>';
                const faceDetection = await faceapi.detectSingleFace(camera).withFaceLandmarks().withFaceDescriptor();
                if (faceDetection) faceDescriptor = Array.from(faceDetection.descriptor);
                nextToVerifyBtn.style.display = 'block';
                startLivenessBtn.style.display = 'none';
            }
        }, 100);
        
        setTimeout(() => {
            if (!headMovements.left || !headMovements.right) {
                clearInterval(headTrackingInterval);
                livenessResult.innerHTML = '<span class="error">❌ فشل اختبار الحيوية</span>';
                startLivenessBtn.style.display = 'block';
                nextToVerifyBtn.style.display = 'none';
            }
        }, 15000);
    }
    
    startLivenessBtn.onclick = async () => {
        startLivenessBtn.disabled = true;
        startLivenessBtn.innerHTML = '<span class="spinner"></span> جاري التشغيل...';
        await runStabilityPhase();
        startLivenessBtn.disabled = false;
        startLivenessBtn.style.display = 'none';
    };
    
    nextToVerifyBtn.onclick = async () => {
        if (!idDescriptor || !faceDescriptor) return;
        const distance = faceapi.euclideanDistance(faceDescriptor, idDescriptor);
        const similarity = Math.round((1 - Math.min(distance, 1)) * 100);
        
        if (similarity < 85) {
            livenessResult.innerHTML = `<div class="error">❌ فشل التحقق: التطابق ${similarity}% (مطلوب 85%)</div>`;
            nextToVerifyBtn.style.display = 'none';
            startLivenessBtn.style.display = 'block';
            return;
        }
        
        step = 3;
        updateSteps();
        document.getElementById('step2Content').style.display = 'none';
        document.getElementById('step3Content').style.display = 'block';
        document.getElementById('verificationResult').innerHTML = `<div class="success">✅ تم التحقق! التطابق: ${similarity}%</div>`;
        registerFinalBtn.disabled = false;
    };
    
    registerFinalBtn.onclick = async () => {
        registerFinalBtn.disabled = true;
        registerFinalBtn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        let previousHash = "0";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if (data.chain.length) previousHash = data.chain[data.chain.length-1].hash;
        } catch(e) {}
        
        const payload = {
            name: "مستخدم موثق",
            face_hash: CryptoJS.SHA256(JSON.stringify(faceDescriptor)).toString(),
            document_hash: CryptoJS.SHA256(JSON.stringify(idDescriptor)).toString(),
            document_type: "secure_identity",
            biometric_verified: true,
            previous_hash: previousHash
        };
        
        try {
            const response = await fetch('/add_block', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            if (response.ok) {
                document.getElementById('registerStatus').innerHTML = `<div class="success">🎉 تم التسجيل! رقم الكتلة: ${result.block_index}</div>`;
            } else {
                document.getElementById('registerStatus').innerHTML = `<div class="error">❌ فشل: ${result.error}</div>`;
                registerFinalBtn.disabled = false;
                registerFinalBtn.innerHTML = "📝 إعادة المحاولة";
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<div class="error">❌ خطأ: ${err.message}</div>`;
            registerFinalBtn.disabled = false;
            registerFinalBtn.innerHTML = "📝 إعادة المحاولة";
        }
    };
    
    function updateSteps() {
        for(let i=1; i<=3; i++) {
            const el = document.getElementById(`step${i}`);
            if(i < step) { el.classList.add('completed'); el.classList.remove('active', 'locked'); }
            else if(i === step) { el.classList.add('active'); el.classList.remove('completed', 'locked'); }
            else { el.classList.add('locked'); el.classList.remove('active', 'completed'); }
        }
    }
    
    loadModels();
    updateSteps();
</script>
</body>
</html>
