<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - التوثيق الآمن</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.4rem; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; transform: scaleX(-1); }
        .result { margin: 15px 0; padding: 15px; border-radius: 20px; text-align: center; font-size: 0.9rem; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .progress-bar { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2c7da0, #28a745); transition: width 0.5s; }
        .direction-badge { display: inline-block; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; margin: 5px; }
        .direction-completed { background: #28a745; color: white; }
        .direction-pending { background: #6c757d; color: white; }
        .stability-timer { font-size: 1.2rem; font-weight: bold; text-align: center; margin: 10px 0; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .step.failed { background: #dc3545; color: white; }
        .flex-buttons { display: flex; gap: 10px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🔐 وثاق | التوثيق الآمن</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ الهوية</div>
        <div class="step" id="step2">2️⃣ الحيوية</div>
        <div class="step" id="step3">3️⃣ التسجيل</div>
    </div>

    <!-- الخطوة 1: رفع الهوية (إجباري) -->
    <div id="step1Content">
        <div class="card">
            <h2>🆔 1. رفع صورة الهوية</h2>
            <p style="font-size:0.85rem; color:#666;">يجب رفع صورة واضحة لبطاقة الهوية أو جواز السفر</p>
            <input type="file" id="idCardInput" accept="image/jpeg,image/png,image/jpg,application/pdf" style="width:100%; padding:12px; border-radius:40px; border:1px solid #ddd; margin:10px 0;">
            <div id="idPreview" style="text-align:center; display:none;">
                <img id="idPreviewImg" style="max-width:100%; max-height:150px; border-radius:16px;">
            </div>
            <button id="extractIdFaceBtn" class="btn-primary" disabled>🔍 استخراج بصمة الوجه من الهوية</button>
            <div id="idResult" class="result"></div>
            <div class="progress-bar" id="idProgress" style="display:none;"><div class="progress-fill" id="idProgressFill"></div></div>
            <button id="nextToLivenessBtn" class="btn-success" disabled>▶️ التالي: اختبار الحيوية</button>
        </div>
    </div>

    <!-- الخطوة 2: اختبار الحيوية (تتبع حركة الرأس + وضع الاستقرار) -->
    <div id="step2Content" style="display:none;">
        <div class="card">
            <h2>🧠 2. اختبار الحيوية</h2>
            
            <!-- وضع الاستقرار -->
            <div id="stabilityPhase">
                <p style="text-align:center;">📷 يرجى تثبيت وجهك أمام الكاميرا</p>
                <div class="stability-timer" id="stabilityTimer">3</div>
                <div class="progress-bar"><div class="progress-fill" id="stabilityProgress" style="width:0%"></div></div>
            </div>
            
            <!-- تتبع حركة الرأس -->
            <div id="headTrackingPhase" style="display:none;">
                <p style="text-align:center;">🔄 حرك رأسك في الاتجاهات المطلوبة</p>
                <video id="camera" autoplay muted playsinline></video>
                <div style="text-align:center; margin: 15px 0;">
                    <span id="leftIndicator" class="direction-badge direction-pending">⬅️ يسار</span>
                    <span id="rightIndicator" class="direction-badge direction-pending">➡️ يمين</span>
                </div>
                <div id="livenessStatus" class="info" style="text-align:center;"></div>
            </div>
            
            <button id="startLivenessBtn" class="btn-primary" style="display:none;">🎯 بدء اختبار الحيوية</button>
            <div id="livenessResult" class="result"></div>
            <button id="nextToVerifyBtn" class="btn-success" style="display:none;">▶️ التالي: التحقق النهائي</button>
        </div>
    </div>

    <!-- الخطوة 3: التحقق النهائي والتسجيل -->
    <div id="step3Content" style="display:none;">
        <div class="card">
            <h2>✅ 3. التحقق النهائي</h2>
            <div id="verificationResult" class="result"></div>
            <button id="registerFinalBtn" class="btn-success" disabled>📝 تسجيل الهوية</button>
            <div id="registerStatus" class="result"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // نظام التوثيق الآمن - مع تتبع حركة الرأس
    // ============================================================
    
    let modelsLoaded = false;
    let cameraStream = null;
    let step = 1;
    let idDescriptor = null;
    let faceDescriptor = null;
    let headMovements = { left: false, right: false };
    let stabilityCompleted = false;
    let lastHeadDirection = 'center';
    let livenessPassed = false;
    
    // عناصر DOM
    const idCardInput = document.getElementById('idCardInput');
    const idPreview = document.getElementById('idPreview');
    const idPreviewImg = document.getElementById('idPreviewImg');
    const extractIdFaceBtn = document.getElementById('extractIdFaceBtn');
    const idResult = document.getElementById('idResult');
    const nextToLivenessBtn = document.getElementById('nextToLivenessBtn');
    const startLivenessBtn = document.getElementById('startLivenessBtn');
    const livenessResult = document.getElementById('livenessResult');
    const nextToVerifyBtn = document.getElementById('nextToVerifyBtn');
    const registerFinalBtn = document.getElementById('registerFinalBtn');
    const camera = document.getElementById('camera');
    
    // ------------------- تحميل النماذج -------------------
    async function loadModels() {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        try {
            idResult.innerHTML = '<span class="info">⏳ جاري تحميل نماذج الذكاء الاصطناعي...</span>';
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            idResult.innerHTML = '<span class="success">✅ النماذج جاهزة</span>';
            setTimeout(() => { if(idResult.innerHTML.includes('جاهزة')) idResult.innerHTML = ''; }, 2000);
        } catch(err) {
            idResult.innerHTML = '<span class="error">❌ فشل تحميل النماذج</span>';
        }
    }
    
    // ------------------- معاينة صورة الهوية واستخراج البصمة -------------------
    idCardInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            idPreviewImg.src = e.target.result;
            idPreview.style.display = 'block';
            extractIdFaceBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    });
    
    extractIdFaceBtn.onclick = async () => {
        extractIdFaceBtn.disabled = true;
        extractIdFaceBtn.innerHTML = '<span class="spinner"></span> جاري الاستخراج...';
        idResult.innerHTML = '<span class="info">🔍 جاري استخراج بصمة الوجه من الهوية...</span>';
        document.getElementById('idProgress').style.display = 'block';
        
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += 20;
            document.getElementById('idProgressFill').style.width = progress + '%';
            if (progress >= 100) clearInterval(progressInterval);
        }, 200);
        
        await new Promise(r => setTimeout(r, 1000));
        
        const img = new Image();
        img.src = idPreviewImg.src;
        await new Promise(r => { img.onload = r; });
        
        const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        
        if (!detection) {
            idResult.innerHTML = '<span class="warning">⚠️ لم يتم العثور على وجه واضح في الهوية. يرجى رفع صورة أوضح.</span>';
            extractIdFaceBtn.disabled = false;
            extractIdFaceBtn.innerHTML = "🔍 إعادة المحاولة";
            document.getElementById('idProgress').style.display = 'none';
            return;
        }
        
        idDescriptor = Array.from(detection.descriptor);
        const idHash = CryptoJS.SHA256(JSON.stringify(idDescriptor)).toString().substring(0, 16);
        
        idResult.innerHTML = `<span class="success">✅ تم استخراج بصمة الهوية بنجاح! (${idHash})</span>`;
        document.getElementById('idProgress').style.display = 'none';
        nextToLivenessBtn.disabled = false;
        extractIdFaceBtn.disabled = false;
        extractIdFaceBtn.innerHTML = "🔍 إعادة الاستخراج";
    };
    
    // ------------------- الانتقال لاختبار الحيوية -------------------
    nextToLivenessBtn.onclick = async () => {
        step = 2;
        updateSteps();
        document.getElementById('step1Content').style.display = 'none';
        document.getElementById('step2Content').style.display = 'block';
        
        // تشغيل الكاميرا
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        cameraStream = stream;
        camera.srcObject = stream;
        await camera.play();
        
        startLivenessBtn.style.display = 'block';
    };
    
    // ------------------- وضع الاستقرار (تثبيت الوجه) -------------------
    async function runStabilityPhase() {
        const stabilityPhase = document.getElementById('stabilityPhase');
        const headTrackingPhase = document.getElementById('headTrackingPhase');
        
        stabilityPhase.style.display = 'block';
        headTrackingPhase.style.display = 'none';
        
        for (let i = 3; i > 0; i--) {
            document.getElementById('stabilityTimer').innerHTML = i;
            document.getElementById('stabilityProgress').style.width = ((3 - i) / 3) * 100 + '%';
            await new Promise(r => setTimeout(r, 1000));
        }
        
        document.getElementById('stabilityTimer').innerHTML = '✅ ثابت';
        document.getElementById('stabilityProgress').style.width = '100%';
        await new Promise(r => setTimeout(r, 500));
        
        stabilityPhase.style.display = 'none';
        headTrackingPhase.style.display = 'block';
        stabilityCompleted = true;
        
        startHeadTracking();
    }
    
    // ------------------- تتبع حركة الرأس -------------------
    async function startHeadTracking() {
        headMovements = { left: false, right: false };
        lastHeadDirection = 'center';
        
        const leftIndicator = document.getElementById('leftIndicator');
        const rightIndicator = document.getElementById('rightIndicator');
        
        leftIndicator.className = 'direction-badge direction-pending';
        rightIndicator.className = 'direction-badge direction-pending';
        
        document.getElementById('livenessStatus').innerHTML = '🔄 حرك رأسك لليسار أولاً';
        
        const checkInterval = setInterval(async () => {
            const detection = await faceapi.detectSingleFace(camera).withFaceLandmarks();
            if (!detection) return;
            
            const landmarks = detection.landmarks;
            const nose = landmarks.getNose();
            const jaw = landmarks.getJawOutline();
            
            if (!nose || nose.length < 3 || !jaw) return;
            
            const noseTip = nose[2];
            const faceCenterX = (jaw[0].x + jaw[jaw.length-1].x) / 2;
            const offset = (noseTip.x - faceCenterX) / detection.detection.box.width;
            
            let currentDirection = 'center';
            if (offset < -0.08) currentDirection = 'left';
            else if (offset > 0.08) currentDirection = 'right';
            
            if (currentDirection === 'left' && !headMovements.left) {
                headMovements.left = true;
                leftIndicator.className = 'direction-badge direction-completed';
                document.getElementById('livenessStatus').innerHTML = '✅ تم كشف الحركة لليسار! حرك رأسك لليمين الآن';
            } else if (currentDirection === 'right' && headMovements.left && !headMovements.right) {
                headMovements.right = true;
                rightIndicator.className = 'direction-badge direction-completed';
                document.getElementById('livenessStatus').innerHTML = '✅ تم كشف الحركة لليمين!';
            }
            
            if (headMovements.left && headMovements.right) {
                clearInterval(checkInterval);
                livenessPassed = true;
                document.getElementById('livenessResult').innerHTML = '<span class="success">✅ اختبار الحيوية ناجح! تم كشف حركات الرأس المطلوبة.</span>';
                nextToVerifyBtn.style.display = 'block';
                startLivenessBtn.style.display = 'none';
                
                // استخراج بصمة الوجه من الكاميرا
                const faceDetection = await faceapi.detectSingleFace(camera).withFaceLandmarks().withFaceDescriptor();
                if (faceDetection) {
                    faceDescriptor = Array.from(faceDetection.descriptor);
                }
            }
        }, 100);
        
        // مهلة 15 ثانية
        setTimeout(() => {
            if (!headMovements.left || !headMovements.right) {
                clearInterval(checkInterval);
                livenessPassed = false;
                document.getElementById('livenessResult').innerHTML = '<span class="error">❌ فشل اختبار الحيوية: لم يتم كشف حركات الرأس المطلوبة. يرجى إعادة المحاولة.</span>';
                startLivenessBtn.style.display = 'block';
                nextToVerifyBtn.style.display = 'none';
            }
        }, 15000);
    }
    
    startLivenessBtn.onclick = async () => {
        startLivenessBtn.disabled = true;
        startLivenessBtn.innerHTML = '<span class="spinner"></span> جاري التشغيل...';
        await runStabilityPhase();
        startLivenessBtn.disabled = false;
        startLivenessBtn.style.display = 'none';
    };
    
    // ------------------- التحقق النهائي والتسجيل -------------------
    nextToVerifyBtn.onclick = async () => {
        if (!idDescriptor || !faceDescriptor) {
            document.getElementById('verificationResult').innerHTML = '<span class="error">❌ خطأ: بيانات الوجه غير مكتملة</span>';
            return;
        }
        
        nextToVerifyBtn.disabled = true;
        nextToVerifyBtn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
        document.getElementById('verificationResult').innerHTML = '<span class="info">🔍 جاري مطابقة بصمات الوجه مع الهوية...</span>';
        
        // حساب نسبة التطابق
        const distance = faceapi.euclideanDistance(faceDescriptor, idDescriptor);
        const similarity = Math.round((1 - Math.min(distance, 1)) * 100);
        
        if (similarity < 85) {
            document.getElementById('verificationResult').innerHTML = `
                <div class="error">
                    ❌ فشل التحقق: نسبة التطابق ${similarity}% أقل من الحد الأدنى المطلوب 85%<br>
                    <small>💡 يرجى التأكد من الإضاءة الجيدة ووضوح الوجه في الكاميرا وصورة الهوية</small>
                </div>
            `;
            nextToVerifyBtn.disabled = false;
            nextToVerifyBtn.innerHTML = "▶️ إعادة المحاولة";
            return;
        }
        
        step = 3;
        updateSteps();
        
        document.getElementById('step2Content').style.display = 'none';
        document.getElementById('step3Content').style.display = 'block';
        
        document.getElementById('verificationResult').innerHTML = `
            <div class="success">
                ✅ تم التحقق بنجاح!<br>
                🎯 نسبة التطابق: ${similarity}%<br>
                🧬 تم تأكيد مطابقة الوجه مع الهوية
            </div>
        `;
        registerFinalBtn.disabled = false;
    };
    
    registerFinalBtn.onclick = async () => {
        registerFinalBtn.disabled = true;
        registerFinalBtn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        let previousHash = "0";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if (data.chain && data.chain.length) {
                previousHash = data.chain[data.chain.length-1].hash;
            }
        } catch(e) {}
        
        const faceHash = CryptoJS.SHA256(JSON.stringify(faceDescriptor)).toString();
        const docHash = CryptoJS.SHA256(JSON.stringify(idDescriptor)).toString();
        
        // إعداد FormData لإرسال الهوية والصورة
        const formData = new FormData();
        const file = idCardInput.files[0];
        if (file) formData.append('id_card', file);
        formData.append('face_descriptor', JSON.stringify(faceDescriptor));
        formData.append('doc_descriptor', JSON.stringify(idDescriptor));
        formData.append('liveness_data', JSON.stringify({ head_movements: headMovements }));
        
        try {
            // التحقق من الهوية عبر الخادم
            const verifyResponse = await fetch('/verify-identity', {
                method: 'POST',
                body: formData
            });
            const verifyResult = await verifyResponse.json();
            
            if (!verifyResponse.ok || !verifyResult.success) {
                document.getElementById('registerStatus').innerHTML = `<div class="error">❌ ${verifyResult.error || 'فشل التحقق من الهوية'}</div>`;
                registerFinalBtn.disabled = false;
                registerFinalBtn.innerHTML = "📝 إعادة المحاولة";
                return;
            }
            
            // التسجيل في البلوكشين
            const payload = {
                name: "مستخدم موثق",
                face_hash: verifyResult.face_hash,
                document_hash: verifyResult.doc_hash,
                document_type: "secure_identity",
                biometric_verified: true,
                previous_hash: previousHash
            };
            
            const response = await fetch('/add_block', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if (response.ok) {
                document.getElementById('registerStatus').innerHTML = `
                    <div class="success">
                        🎉 تم تسجيل الهوية بنجاح في البلوكشين!<br>
                        رقم الكتلة: ${result.block_index}<br>
                        نسبة التطابق: ${verifyResult.similarity}%
                    </div>
                `;
            } else {
                document.getElementById('registerStatus').innerHTML = `<div class="error">❌ فشل التسجيل: ${result.error}</div>`;
                registerFinalBtn.disabled = false;
                registerFinalBtn.innerHTML = "📝 إعادة المحاولة";
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<div class="error">❌ خطأ في الاتصال: ${err.message}</div>`;
            registerFinalBtn.disabled = false;
            registerFinalBtn.innerHTML = "📝 إعادة المحاولة";
        }
    };
    
    function updateSteps() {
        for(let i=1; i<=3; i++) {
            const el = document.getElementById(`step${i}`);
            if(i < step) {
                el.classList.add('completed');
                el.classList.remove('active', 'failed');
            } else if(i === step) {
                el.classList.add('active');
                el.classList.remove('completed', 'failed');
            } else {
                el.classList.remove('active', 'completed', 'failed');
            }
        }
    }
    
    loadModels();
    updateSteps();
</script>
</body>
</html>
