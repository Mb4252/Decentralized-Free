<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة التحقق</title>
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; border-radius: 32px; padding: 30px; max-width: 500px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #1e3c72; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 60px; margin: 20px 0; }
        button { background-color: #2c7da0; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>✅ تم التحقق بنجاح!</h1>
    <div class="success">
        <p>🎉 لقد اجتزت التحقق البيومتري وتم تسجيل هويتك في سلسلة الكتل اللامركزية.</p>
        <p>الاسم: <strong id="displayName"></strong></p>
        <p>نوع الوثيقة: <strong id="displayDocType"></strong></p>
        <p>التاريخ: <strong id="displayTime"></strong></p>
    </div>
    <button onclick="window.location.href='/profile'">📁 عرض الملف الشخصي</button>
    <button onclick="window.location.href='/register'">➕ تسجيل هوية جديدة</button>
</div>
<script>
    document.getElementById('displayName').innerText = sessionStorage.getItem('verifiedName') || "غير معروف";
    document.getElementById('displayDocType').innerText = sessionStorage.getItem('verifiedDocType') || "غير محدد";
    document.getElementById('displayTime').innerText = sessionStorage.getItem('verifiedTimestamp') || "الآن";
</script>
</body>
</html>
