<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي والبحث</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1, h2 { color: #1e3c72; text-align: center; border-bottom: 2px solid #2c7da0; padding-bottom: 10px; }
        .card { background: #f9f9fc; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 40px; border: 1px solid #ccc; }
        button { background-color: #2c7da0; color: white; border: none; cursor: pointer; font-weight: bold; }
        .flex-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .result { margin-top: 10px; padding: 10px; border-radius: 50px; text-align: center; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 الملف الشخصي</h1>
    <div class="card">
        <p>👤 الاسم: <strong id="profileName"></strong></p>
        <p>📋 نوع الوثيقة: <strong id="profileDocType"></strong></p>
        <p>🕒 تاريخ التوثيق: <strong id="profileTime"></strong></p>
        <p>🔗 رقم الكتلة: <strong id="profileBlockIndex"></strong></p>
        <p>🖥️ العقدة: <strong id="profileNodeId"></strong></p>
    </div>

    <div class="card">
        <h2>🔍 البحث عن شخص في السجل</h2>
        <div class="flex-buttons">
            <input type="text" id="searchQuery" placeholder="اسم أو أول 6 خانات من بصمة الوجه">
            <select id="searchType">
                <option value="name">🔤 بالاسم</option>
                <option value="face_hash_prefix">🧬 ببصمة الوجه</option>
            </select>
            <button id="searchBtn">🔎 بحث</button>
        </div>
        <div id="searchResult" class="result"></div>
    </div>

    <button onclick="window.location.href='/register'">➕ تسجيل هوية جديدة</button>
</div>

<script>
    document.getElementById('profileName').innerText = sessionStorage.getItem('verifiedName') || "غير متوفر";
    document.getElementById('profileDocType').innerText = sessionStorage.getItem('verifiedDocType') || "غير متوفر";
    document.getElementById('profileTime').innerText = sessionStorage.getItem('verifiedTimestamp') || "غير متوفر";

    async function fetchUserBlock() {
        const name = sessionStorage.getItem('verifiedName');
        if (!name) return;
        const res = await fetch('/verify_person', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query_type: 'name', query_value: name }) });
        const data = await res.json();
        if (data.verified && data.records.length) {
            const latest = data.records[data.records.length-1];
            document.getElementById('profileBlockIndex').innerText = latest.index;
            document.getElementById('profileNodeId').innerText = latest.node_id;
        } else {
            document.getElementById('profileBlockIndex').innerText = "غير موجود";
            document.getElementById('profileNodeId').innerText = "غير معروف";
        }
    }
    fetchUserBlock();

    document.getElementById('searchBtn').onclick = async () => {
        const query = document.getElementById('searchQuery').value.trim();
        const type = document.getElementById('searchType').value;
        if (!query) { alert("أدخل قيمة البحث"); return; }
        const resultDiv = document.getElementById('searchResult');
        resultDiv.innerHTML = '<span class="info">⏳ جاري البحث...</span>';
        try {
            const res = await fetch('/verify_person', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query_type: type, query_value: query }) });
            const data = await res.json();
            if (res.ok && data.verified) {
                let html = `<div class="success">${data.message}</div><ul>`;
                data.records.forEach(rec => {
                    html += `<li><strong>${rec.name}</strong> - ${rec.document_type}<br>⏱️ ${rec.timestamp}<br>🔗 كتلة ${rec.index} (${rec.node_id})</li><br>`;
                });
                html += `</ul>`;
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = `<div class="error">${data.message || "لم يتم العثور"}</div>`;
            }
        } catch(err) {
            resultDiv.innerHTML = `<div class="error">خطأ: ${err.message}</div>`;
        }
    };
</script>
</body>
</html>
