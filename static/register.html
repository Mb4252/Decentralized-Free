<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - تسجيل الهوية</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2c7da0">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2c7da0 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.5rem; margin-top: 0; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #2c3e50; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 40px; border: 1px solid #ddd; font-size: 1rem; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-danger { background: #dc3545; color: white; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; }
        .result { margin: 10px 0; padding: 12px; border-radius: 40px; text-align: center; font-size: 0.85rem; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .camera-switch { display: flex; gap: 10px; margin: 10px 0; }
        .camera-switch button { flex: 1; margin: 0; padding: 10px; font-size: 0.8rem; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .warning-box { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; border-radius: 20px; margin: 10px 0; text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📜 وثاق | Wethaq</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ بيانات</div>
        <div class="step" id="step2">2️⃣ الوثيقة</div>
        <div class="step" id="step3">3️⃣ الوجه</div>
        <div class="step" id="step4">4️⃣ تسجيل</div>
    </div>

    <!-- الخطوة 1: البيانات -->
    <div id="step1Content">
        <div class="card">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="مثال: أحمد محمد العلي">
            <label>📋 نوع الوثيقة</label>
            <select id="docType">
                <option value="جواز سفر">🛂 جواز سفر</option>
                <option value="بطاقة هوية">🪪 بطاقة هوية وطنية</option>
                <option value="رخصة قيادة">🚗 رخصة قيادة</option>
            </select>
            <button id="nextStep1" class="btn-primary">▶️ التالي: تصوير الوثيقة</button>
        </div>
    </div>

    <!-- الخطوة 2: تصوير الوثيقة -->
    <div id="step2Content" style="display:none;">
        <div class="card">
            <p style="text-align:center; color:#2c7da0;">📸 ضع الوثيقة أمام الكاميرا</p>
            <video id="docVideo" autoplay muted playsinline></video>
            <div class="camera-switch">
                <button id="switchDocBack" class="btn-warning">📷 كاميرا خلفية</button>
                <button id="switchDocFront" class="btn-warning">📱 كاميرا أمامية</button>
            </div>
            <button id="captureDocBtn" class="btn-primary" disabled>📸 تصوير الوثيقة</button>
            <div id="docResult" class="result"></div>
            <button id="confirmDocBtn" class="btn-success" disabled>✅ تأكيد والمتابعة</button>
        </div>
    </div>

    <!-- الخطوة 3: التقاط الوجه الحي -->
    <div id="step3Content" style="display:none;">
        <div class="card">
            <p style="text-align:center; color:#2c7da0;">🎥 وجه الكاميرا نحو وجهك</p>
            <div id="cameraPermissionWarning" class="warning-box" style="display:none;">
                ⚠️ يرجى السماح بالوصول إلى الكاميرا
            </div>
            <video id="liveVideo" autoplay muted playsinline></video>
            <div class="camera-switch">
                <button id="switchLiveFront" class="btn-warning">📱 كاميرا أمامية</button>
                <button id="switchLiveBack" class="btn-warning">📷 كاميرا خلفية</button>
            </div>
            <button id="startLiveCameraBtn" class="btn-primary">📷 تشغيل الكاميرا</button>
            <button id="captureFaceBtn" class="btn-primary" disabled>📸 التقاط الوجه</button>
            <div id="faceResult" class="result"></div>
            <button id="confirmFaceBtn" class="btn-success" disabled>✅ تأكيد والمتابعة</button>
        </div>
    </div>

    <!-- الخطوة 4: التسجيل -->
    <div id="step4Content" style="display:none;">
        <div class="card">
            <div id="finalResult" class="result"></div>
            <button id="registerBtn" class="btn-success" disabled>📝 تسجيل الهوية</button>
            <div id="registerStatus" class="result"></div>
        </div>
    </div>
</div>

<script>
    // ------------------- المتغيرات -------------------
    let modelsLoaded = false;
    let docStream = null;
    let liveStream = null;
    let docDescriptor = null;
    let docHash = null;
    let liveDescriptor = null;
    let liveHash = null;
    let capturedDocImage = null;
    let currentStep = 1;
    let currentDocFacing = "environment";
    let currentLiveFacing = "user";

    // ------------------- عناصر DOM -------------------
    const fullNameInput = document.getElementById('fullName');
    const docTypeSelect = document.getElementById('docType');
    const docVideo = document.getElementById('docVideo');
    const liveVideo = document.getElementById('liveVideo');
    const nextStep1 = document.getElementById('nextStep1');
    const captureDocBtn = document.getElementById('captureDocBtn');
    const confirmDocBtn = document.getElementById('confirmDocBtn');
    const startLiveCameraBtn = document.getElementById('startLiveCameraBtn');
    const captureFaceBtn = document.getElementById('captureFaceBtn');
    const confirmFaceBtn = document.getElementById('confirmFaceBtn');
    const registerBtn = document.getElementById('registerBtn');

    // ------------------- تحميل النماذج -------------------
    async function loadModels() {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            console.log("✅ نماذج الوجه جاهزة");
        } catch(err) {
            console.error("فشل تحميل النماذج:", err);
            alert("فشل تحميل النماذج، تأكد من الاتصال بالإنترنت");
        }
    }

    // ------------------- حساب الهاش -------------------
    async function computeImageHash(canvas) {
        return new Promise((resolve) => {
            canvas.toBlob(async (blob) => {
                const buf = await blob.arrayBuffer();
                const wordArray = CryptoJS.lib.WordArray.create(buf);
                resolve(CryptoJS.SHA256(wordArray).toString());
            }, 'image/jpeg', 0.8);
        });
    }

    // ------------------- استخراج الوجه -------------------
    async function extractFaceFromImage(imgElement) {
        const detection = await faceapi.detectSingleFace(imgElement).withFaceLandmarks().withFaceDescriptor();
        if (!detection) return null;
        const box = detection.detection.box;
        const canvas = document.createElement('canvas');
        canvas.width = box.width;
        canvas.height = box.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
        const hash = await computeImageHash(canvas);
        return { descriptor: detection.descriptor, croppedCanvas: canvas, hash };
    }

    // ------------------- مقارنة الوجوه -------------------
    function compareFaces(desc1, desc2) {
        if (!desc1 || !desc2) return { match: false, similarity: 0 };
        const distance = faceapi.euclideanDistance(desc1, desc2);
        const similarity = Math.round((1 - Math.min(distance, 1)) * 100);
        return { match: distance < 0.6, similarity, distance };
    }

    // ------------------- التنقل بين الخطوات -------------------
    function goToStep(step) {
        currentStep = step;
        for(let i=1; i<=4; i++) {
            const stepEl = document.getElementById(`step${i}`);
            if(i < step) {
                stepEl.classList.add('completed');
                stepEl.classList.remove('active');
            } else if(i === step) {
                stepEl.classList.add('active');
                stepEl.classList.remove('completed');
            } else {
                stepEl.classList.remove('active', 'completed');
            }
        }
        document.getElementById('step1Content').style.display = step === 1 ? 'block' : 'none';
        document.getElementById('step2Content').style.display = step === 2 ? 'block' : 'none';
        document.getElementById('step3Content').style.display = step === 3 ? 'block' : 'none';
        document.getElementById('step4Content').style.display = step === 4 ? 'block' : 'none';
    }

    // ------------------- كاميرا الوثيقة -------------------
    async function startDocCamera() {
        if (docStream) {
            docStream.getTracks().forEach(track => track.stop());
        }
        try {
            const constraints = {
                video: { facingMode: { exact: currentDocFacing } }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            docStream = stream;
            docVideo.srcObject = stream;
            await docVideo.play();
            captureDocBtn.disabled = false;
            document.getElementById('docResult').innerHTML = '<span class="success">✅ الكاميرا تعمل</span>';
        } catch(err) {
            console.error("خطأ في كاميرا الوثيقة:", err);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                docStream = stream;
                docVideo.srcObject = stream;
                await docVideo.play();
                captureDocBtn.disabled = false;
                document.getElementById('docResult').innerHTML = '<span class="success">✅ الكاميرا تعمل</span>';
            } catch(e) {
                document.getElementById('docResult').innerHTML = '<span class="error">❌ لا يمكن تشغيل الكاميرا</span>';
            }
        }
    }

    // تبديل كاميرا الوثيقة
    document.getElementById('switchDocBack').onclick = () => {
        currentDocFacing = "environment";
        startDocCamera();
    };
    document.getElementById('switchDocFront').onclick = () => {
        currentDocFacing = "user";
        startDocCamera();
    };

    // التقاط الوثيقة
    captureDocBtn.onclick = async () => {
        captureDocBtn.disabled = true;
        captureDocBtn.innerHTML = '<span class="spinner"></span> جاري التحليل...';
        
        const canvas = document.createElement('canvas');
        canvas.width = docVideo.videoWidth;
        canvas.height = docVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(docVideo, 0, 0, canvas.width, canvas.height);
        capturedDocImage = canvas;
        
        const img = new Image();
        img.src = canvas.toDataURL();
        await new Promise(resolve => { img.onload = resolve; });
        
        const result = await extractFaceFromImage(img);
        if (!result) {
            document.getElementById('docResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه في الوثيقة</span>';
            captureDocBtn.disabled = false;
            captureDocBtn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        docDescriptor = result.descriptor;
        docHash = result.hash;
        document.getElementById('docResult').innerHTML = '<span class="success">✅ تم استخراج الوجه بنجاح</span>';
        confirmDocBtn.disabled = false;
        captureDocBtn.disabled = false;
        captureDocBtn.innerHTML = "📸 إعادة التصوير";
    };

    confirmDocBtn.onclick = () => {
        goToStep(3);
        // إعادة تعيين حالة الكاميرا للوجه
        if (liveStream) {
            liveStream.getTracks().forEach(t => t.stop());
            liveVideo.srcObject = null;
        }
        startLiveCameraBtn.disabled = false;
        captureFaceBtn.disabled = true;
        confirmFaceBtn.disabled = true;
        document.getElementById('faceResult').innerHTML = '';
        document.getElementById('cameraPermissionWarning').style.display = 'none';
    };

    nextStep1.onclick = () => {
        if (!fullNameInput.value.trim()) {
            alert("الرجاء إدخال الاسم الكامل");
            return;
        }
        goToStep(2);
        startDocCamera();
    };

    // ------------------- كاميرا الوجه الحي -------------------
    async function startLiveCamera() {
        if (liveStream) {
            liveStream.getTracks().forEach(track => track.stop());
        }
        try {
            const constraints = {
                video: { facingMode: { exact: currentLiveFacing } }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            liveStream = stream;
            liveVideo.srcObject = stream;
            await liveVideo.play();
            startLiveCameraBtn.disabled = true;
            captureFaceBtn.disabled = false;
            document.getElementById('faceResult').innerHTML = '<span class="success">✅ الكاميرا تعمل، اضغط التقاط الوجه</span>';
            document.getElementById('cameraPermissionWarning').style.display = 'none';
        } catch(err) {
            console.error("خطأ في كاميرا الوجه:", err);
            if (err.name === 'NotAllowedError') {
                document.getElementById('cameraPermissionWarning').style.display = 'block';
                document.getElementById('faceResult').innerHTML = '<span class="error">❌ يرجى السماح بالوصول إلى الكاميرا</span>';
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    liveStream = stream;
                    liveVideo.srcObject = stream;
                    await liveVideo.play();
                    startLiveCameraBtn.disabled = true;
                    captureFaceBtn.disabled = false;
                    document.getElementById('faceResult').innerHTML = '<span class="success">✅ الكاميرا تعمل</span>';
                } catch(e) {
                    document.getElementById('faceResult').innerHTML = '<span class="error">❌ لا يمكن تشغيل الكاميرا</span>';
                }
            }
        }
    }

    // تبديل كاميرا الوجه
    document.getElementById('switchLiveFront').onclick = () => {
        currentLiveFacing = "user";
        startLiveCamera();
    };
    document.getElementById('switchLiveBack').onclick = () => {
        currentLiveFacing = "environment";
        startLiveCamera();
    };

    startLiveCameraBtn.onclick = () => {
        startLiveCamera();
    };

    // التقاط الوجه الحي
    captureFaceBtn.onclick = async () => {
        captureFaceBtn.disabled = true;
        captureFaceBtn.innerHTML = '<span class="spinner"></span> جاري التحليل...';
        
        const result = await extractFaceFromImage(liveVideo);
        if (!result) {
            document.getElementById('faceResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه</span>';
            captureFaceBtn.disabled = false;
            captureFaceBtn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        liveDescriptor = result.descriptor;
        liveHash = result.hash;
        
        const comparison = compareFaces(liveDescriptor, docDescriptor);
        
        if (comparison.match) {
            document.getElementById('faceResult').innerHTML = `<span class="success">✅ الوجه يطابق الوثيقة! التشابه: ${comparison.similarity}%</span>`;
            confirmFaceBtn.disabled = false;
        } else {
            document.getElementById('faceResult').innerHTML = `<span class="error">❌ الوجه لا يطابق الوثيقة! التشابه: ${comparison.similarity}%</span>`;
            confirmFaceBtn.disabled = true;
        }
        
        captureFaceBtn.disabled = false;
        captureFaceBtn.innerHTML = "📸 إعادة المحاولة";
    };

    confirmFaceBtn.onclick = () => {
        goToStep(4);
        const comparison = compareFaces(liveDescriptor, docDescriptor);
        document.getElementById('finalResult').innerHTML = `
            <div class="success">
                ✅ تم التحقق بنجاح<br><br>
                👤 ${fullNameInput.value}<br>
                📋 ${docTypeSelect.value}<br>
                🎯 نسبة التطابق: ${comparison.similarity}%
            </div>
        `;
        registerBtn.disabled = false;
    };

    // ------------------- التسجيل -------------------
    registerBtn.onclick = async () => {
        registerBtn.disabled = true;
        registerBtn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        let previousHash = "0";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if (data.chain && data.chain.length > 0) {
                previousHash = data.chain[data.chain.length - 1].hash;
            }
        } catch(e) {
            console.log("خطأ في جلب السلسلة:", e);
        }
        
        const payload = {
            name: fullNameInput.value.trim(),
            face_hash: liveHash,
            document_hash: docHash,
            document_type: docTypeSelect.value,
            biometric_verified: true,
            previous_hash: previousHash
        };
        
        try {
            const response = await fetch('/add_block', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if (response.ok) {
                sessionStorage.setItem('verifiedName', fullNameInput.value.trim());
                sessionStorage.setItem('verifiedDocType', docTypeSelect.value);
                sessionStorage.setItem('verifiedTimestamp', new Date().toLocaleString());
                document.getElementById('registerStatus').innerHTML = '<span class="success">🎉 تم التسجيل بنجاح! جاري التوجيه...</span>';
                setTimeout(() => {
                    window.location.href = '/profile';
                }, 1500);
            } else {
                document.getElementById('registerStatus').innerHTML = `<span class="error">❌ فشل التسجيل: ${result.error}</span>`;
                registerBtn.disabled = false;
                registerBtn.innerHTML = "📝 إعادة المحاولة";
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<span class="error">❌ خطأ في الاتصال: ${err.message}</span>`;
            registerBtn.disabled = false;
            registerBtn.innerHTML = "📝 إعادة المحاولة";
        }
    };

    // ------------------- بدء التشغيل -------------------
    loadModels();
    goToStep(1);
    
    // تعطيل الأزرار في البداية
    captureDocBtn.disabled = true;
    confirmDocBtn.disabled = true;
    startLiveCameraBtn.disabled = false;
    captureFaceBtn.disabled = true;
    confirmFaceBtn.disabled = true;
    registerBtn.disabled = true;
</script>
</body>
</html>
