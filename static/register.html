<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - تسجيل الهوية</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2c7da0">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2c7da0 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.5rem; margin-top: 0; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #2c3e50; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 40px; border: 1px solid #ddd; font-size: 1rem; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; }
        .result { margin: 10px 0; padding: 12px; border-radius: 40px; text-align: center; font-size: 0.85rem; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 6px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .camera-switch { display: flex; gap: 10px; margin: 10px 0; }
        .camera-switch button { flex: 1; margin: 0; padding: 8px; font-size: 0.75rem; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📜 وثاق | Wethaq</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ بيانات</div>
        <div class="step" id="step2">2️⃣ الوثيقة</div>
        <div class="step" id="step3">3️⃣ الوجه</div>
        <div class="step" id="step4">4️⃣ تسجيل</div>
    </div>

    <div id="step1Content">
        <div class="card">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="مثال: أحمد محمد العلي">
            <label>📋 نوع الوثيقة</label>
            <select id="docType">
                <option value="جواز سفر">🛂 جواز سفر</option>
                <option value="بطاقة هوية">🪪 بطاقة هوية</option>
                <option value="رخصة قيادة">🚗 رخصة قيادة</option>
            </select>
            <button id="nextStep1" class="btn-primary">▶️ التالي</button>
        </div>
    </div>

    <div id="step2Content" style="display:none;">
        <div class="card">
            <video id="docVideo" autoplay muted playsinline></video>
            <div class="camera-switch">
                <button id="switchFront" class="btn-warning">📱 أمامية</button>
                <button id="switchBack" class="btn-warning">📷 خلفية</button>
            </div>
            <button id="captureDoc" class="btn-primary" disabled>📸 تصوير الوثيقة</button>
            <div id="docResult" class="result"></div>
            <button id="confirmDoc" class="btn-success" disabled>✅ تأكيد</button>
        </div>
    </div>

    <div id="step3Content" style="display:none;">
        <div class="card">
            <video id="liveVideo" autoplay muted playsinline></video>
            <div class="camera-switch">
                <button id="switchLiveFront" class="btn-warning">📱 أمامية</button>
                <button id="switchLiveBack" class="btn-warning">📷 خلفية</button>
            </div>
            <button id="startCamera" class="btn-primary">📷 تشغيل الكاميرا</button>
            <button id="captureFace" class="btn-primary" disabled>📸 التقاط الوجه</button>
            <div id="faceResult" class="result"></div>
            <button id="confirmFace" class="btn-success" disabled>✅ تأكيد</button>
        </div>
    </div>

    <div id="step4Content" style="display:none;">
        <div class="card">
            <div id="finalResult" class="result"></div>
            <button id="registerBtn" class="btn-success" disabled>📝 تسجيل</button>
            <div id="registerStatus" class="result"></div>
        </div>
    </div>
</div>

<script>
    let modelsLoaded = false;
    let docStream = null, liveStream = null;
    let docDescriptor = null, docHash = null;
    let liveDescriptor = null, liveHash = null;
    let capturedDoc = null;
    let step = 1;

    const fullName = document.getElementById('fullName');
    const docType = document.getElementById('docType');
    const docVideo = document.getElementById('docVideo');
    const liveVideo = document.getElementById('liveVideo');

    async function loadModels() {
        const url = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(url);
        await faceapi.nets.faceLandmark68Net.loadFromUri(url);
        await faceapi.nets.faceRecognitionNet.loadFromUri(url);
        modelsLoaded = true;
        console.log("✅ جاهز");
    }

    async function computeHash(canvas) {
        return new Promise((resolve) => {
            canvas.toBlob(async (blob) => {
                const buf = await blob.arrayBuffer();
                const hash = CryptoJS.SHA256(CryptoJS.lib.WordArray.create(buf)).toString();
                resolve(hash);
            }, 'image/jpeg', 0.8);
        });
    }

    async function extractFace(img) {
        const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        if (!detection) return null;
        const box = detection.detection.box;
        const canvas = document.createElement('canvas');
        canvas.width = box.width;
        canvas.height = box.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
        const hash = await computeHash(canvas);
        return { descriptor: detection.descriptor, hash };
    }

    function goToStep(s) {
        step = s;
        for(let i=1;i<=4;i++) {
            const el = document.getElementById(`step${i}`);
            if(i < s) el.classList.add('completed');
            else if(i === s) el.classList.add('active');
            else el.classList.remove('active', 'completed');
        }
        document.getElementById('step1Content').style.display = s===1?'block':'none';
        document.getElementById('step2Content').style.display = s===2?'block':'none';
        document.getElementById('step3Content').style.display = s===3?'block':'none';
        document.getElementById('step4Content').style.display = s===4?'block':'none';
    }

    document.getElementById('nextStep1').onclick = () => {
        if(!fullName.value.trim()) { alert("أدخل الاسم"); return; }
        goToStep(2);
        startDocCamera();
    };

    async function startDocCamera() {
        if(docStream) docStream.getTracks().forEach(t=>t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            docStream = stream;
            docVideo.srcObject = stream;
            await docVideo.play();
            document.getElementById('captureDoc').disabled = false;
        } catch(e) { alert("خطأ في الكاميرا"); }
    }

    document.getElementById('captureDoc').onclick = async () => {
        const btn = document.getElementById('captureDoc');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري...';
        
        const canvas = document.createElement('canvas');
        canvas.width = docVideo.videoWidth;
        canvas.height = docVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(docVideo, 0, 0);
        capturedDoc = canvas;
        
        const img = new Image();
        img.src = canvas.toDataURL();
        await new Promise(r=>img.onload=r);
        
        const face = await extractFace(img);
        if(!face) {
            document.getElementById('docResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه</span>';
            btn.disabled = false;
            btn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        docDescriptor = face.descriptor;
        docHash = face.hash;
        document.getElementById('docResult').innerHTML = '<span class="success">✅ تم استخراج الوجه</span>';
        document.getElementById('confirmDoc').disabled = false;
        btn.disabled = false;
        btn.innerHTML = "📸 إعادة التصوير";
    };

    document.getElementById('confirmDoc').onclick = () => {
        goToStep(3);
    };

    document.getElementById('startCamera').onclick = async () => {
        if(liveStream) liveStream.getTracks().forEach(t=>t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            liveStream = stream;
            liveVideo.srcObject = stream;
            await liveVideo.play();
            document.getElementById('startCamera').disabled = true;
            document.getElementById('captureFace').disabled = false;
        } catch(e) { alert("خطأ"); }
    };

    document.getElementById('captureFace').onclick = async () => {
        const btn = document.getElementById('captureFace');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري...';
        
        const face = await extractFace(liveVideo);
        if(!face) {
            document.getElementById('faceResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه</span>';
            btn.disabled = false;
            btn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        liveDescriptor = face.descriptor;
        liveHash = face.hash;
        
        const distance = faceapi.euclideanDistance(liveDescriptor, docDescriptor);
        const match = distance < 0.6;
        const similarity = Math.round((1 - distance) * 100);
        
        if(match) {
            document.getElementById('faceResult').innerHTML = `<span class="success">✅ تطابق! التشابه: ${similarity}%</span>`;
            document.getElementById('confirmFace').disabled = false;
        } else {
            document.getElementById('faceResult').innerHTML = `<span class="error">❌ لا يطابق! التشابه: ${similarity}%</span>`;
        }
        btn.disabled = false;
        btn.innerHTML = "📸 إعادة المحاولة";
    };

    document.getElementById('confirmFace').onclick = () => {
        goToStep(4);
        document.getElementById('finalResult').innerHTML = `<div class="success">✅ تم التحقق<br>👤 ${fullName.value}<br>📋 ${docType.value}</div>`;
        document.getElementById('registerBtn').disabled = false;
    };

    document.getElementById('registerBtn').onclick = async () => {
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        let prevHash = "0";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if(data.chain.length) prevHash = data.chain[data.chain.length-1].hash;
        } catch(e) {}
        
        const payload = {
            name: fullName.value.trim(),
            face_hash: liveHash,
            document_hash: docHash,
            document_type: docType.value,
            biometric_verified: true,
            previous_hash: prevHash
        };
        
        try {
            const res = await fetch('/add_block', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await res.json();
            if(res.ok) {
                sessionStorage.setItem('verifiedName', fullName.value);
                sessionStorage.setItem('verifiedDocType', docType.value);
                sessionStorage.setItem('verifiedTimestamp', new Date().toLocaleString());
                document.getElementById('registerStatus').innerHTML = '<span class="success">🎉 تم التسجيل! جاري التوجيه...</span>';
                setTimeout(() => { window.location.href = '/profile'; }, 1500);
            } else {
                document.getElementById('registerStatus').innerHTML = `<span class="error">❌ ${result.error}</span>`;
                btn.disabled = false;
                btn.innerHTML = "📝 إعادة المحاولة";
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<span class="error">خطأ: ${err.message}</span>`;
            btn.disabled = false;
            btn.innerHTML = "📝 إعادة المحاولة";
        }
    };

    document.getElementById('switchFront').onclick = () => { if(docStream) docStream.getTracks().forEach(t=>t.stop()); startDocCamera(); };
    document.getElementById('switchBack').onclick = () => { if(docStream) docStream.getTracks().forEach(t=>t.stop()); startDocCamera(); };
    document.getElementById('switchLiveFront').onclick = () => { if(liveStream) liveStream.getTracks().forEach(t=>t.stop()); document.getElementById('startCamera').click(); };
    document.getElementById('switchLiveBack').onclick = () => { if(liveStream) liveStream.getTracks().forEach(t=>t.stop()); document.getElementById('startCamera').click(); };

    loadModels();
    document.getElementById('captureDoc').disabled = true;
    document.getElementById('confirmDoc').disabled = true;
    document.getElementById('captureFace').disabled = true;
    document.getElementById('confirmFace').disabled = true;
    document.getElementById('registerBtn').disabled = true;
</script>
</body>
</html>
