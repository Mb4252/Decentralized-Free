<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سجل الحقيقة - تسجيل الهوية</title>
    <!-- PWA manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2c7da0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #1e3c72; text-align: center; border-bottom: 2px solid #2c7da0; padding-bottom: 10px; }
        .card { background: #f9f9fc; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 40px; border: 1px solid #ccc; font-size: 1rem; }
        button { background-color: #2c7da0; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { background-color: #b0c4d9; cursor: not-allowed; }
        video { width: 100%; max-width: 400px; border-radius: 16px; border: 2px solid #ddd; background: #000; display: block; margin: 10px auto; }
        .flex-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .result { margin-top: 10px; padding: 10px; border-radius: 50px; text-align: center; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .step { background: #e7f3ff; padding: 10px; border-radius: 50px; margin-bottom: 15px; }
        .upload-area {
            border: 2px dashed #2c7da0;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f1f9ff;
            transition: 0.3s;
        }
        .upload-area:hover { background: #e3f0fa; }
        .preview-img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 16px; border: 2px solid #2c7da0; display: block; margin-left: auto; margin-right: auto; }
        .file-input { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📜 الخطوة 1: تسجيل الهوية</h1>
    <div class="step">🔹 أدخل الاسم الكامل 🔹 أضف صورة وجه من وثيقة رسمية 🔹 قم بالتحقق الحي (إرمش + حركات الرأس)</div>

    <div class="card">
        <label>👤 الاسم الكامل (سيظهر في الملف الشخصي)</label>
        <input type="text" id="fullName" placeholder="مثال: أحمد محمد العلي">
    </div>

    <div class="card">
        <label>📋 نوع الوثيقة</label>
        <select id="documentType">
            <option value="جواز سفر">🛂 جواز سفر</option>
            <option value="بطاقة هوية وطنية">🪪 بطاقة هوية وطنية</option>
            <option value="رخصة قيادة">🚗 رخصة قيادة</option>
            <option value="شهادة جامعية">🎓 شهادة جامعية</option>
            <option value="شهادة حرفية">🛠️ شهادة حرفية</option>
            <option value="أخرى">📄 أخرى</option>
        </select>
    </div>

    <div class="card">
        <label>📄 صورة الوجه من الوثيقة (بطاقة هوية، جواز سفر، رخصة قيادة، ...)</label>
        <div class="upload-area" id="uploadArea">
            <span>📸 اضغط هنا لاختيار صورة الهوية</span>
            <input type="file" id="docImageInput" accept="image/jpeg, image/png, image/jpg" class="file-input">
            <div id="previewContainer" style="text-align: center;"></div>
        </div>
        <button id="extractDocFaceBtn" disabled>🔍 استخراج الوجه من المستند</button>
        <div id="docFaceResult" class="result"></div>
    </div>

    <div class="card">
        <label>📸 التحقق الحي (الكاميرا)</label>
        <video id="video" autoplay muted playsinline></video>
        <div class="flex-buttons">
            <button id="startCameraBtn">📷 تشغيل الكاميرا</button>
            <button id="startLivenessCheck" disabled>🔐 بدء فحص الحيوية (إرمش + حركات)</button>
        </div>
        <div id="livenessStatus" class="result"></div>
        <div id="finalComparisonResult" class="result"></div>
    </div>

    <button id="registerAndContinue" disabled>✅ تسجيل والمتابعة للنتيجة</button>
    <div id="registerStatus" class="result"></div>
</div>

<script>
    let modelsLoaded = false;
    let cameraStream = null;
    let documentFaceDescriptor = null;
    let documentFaceHash = null;
    let liveFaceDescriptor = null;
    let liveFaceHash = null;
    let livenessPassed = false;
    let faceMatched = false;

    const video = document.getElementById('video');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const startLivenessBtn = document.getElementById('startLivenessCheck');
    const docImageInput = document.getElementById('docImageInput');
    const extractDocFaceBtn = document.getElementById('extractDocFaceBtn');
    const fullNameInput = document.getElementById('fullName');
    const documentTypeSelect = document.getElementById('documentType');
    const registerBtn = document.getElementById('registerAndContinue');
    const uploadArea = document.getElementById('uploadArea');
    const previewContainer = document.getElementById('previewContainer');

    async function loadModels() {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        try {
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            startCameraBtn.disabled = false;
            docImageInput.disabled = false;
            extractDocFaceBtn.disabled = false;
            console.log("✅ نماذج الوجه جاهزة");
        } catch(err) {
            console.error(err);
            alert("فشل تحميل النماذج، تأكد من الاتصال بالإنترنت");
        }
    }

    async function computeImageHash(canvas) {
        return new Promise((resolve) => {
            canvas.toBlob(async (blob) => {
                const buf = await blob.arrayBuffer();
                const wordArray = CryptoJS.lib.WordArray.create(buf);
                resolve(CryptoJS.SHA256(wordArray).toString());
            }, 'image/jpeg', 0.8);
        });
    }

    async function extractFaceFromMedia(mediaElement) {
        const detection = await faceapi.detectSingleFace(mediaElement).withFaceLandmarks().withFaceDescriptor();
        if (!detection) return null;
        const box = detection.detection.box;
        const canvas = document.createElement('canvas');
        canvas.width = box.width;
        canvas.height = box.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(mediaElement, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
        const hash = await computeImageHash(canvas);
        return { descriptor: detection.descriptor, croppedCanvas: canvas, hash };
    }

    function showPreview(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'preview-img';
            img.alt = 'معاينة صورة الهوية';
            previewContainer.innerHTML = '';
            previewContainer.appendChild(img);
            window.uploadedImageSrc = e.target.result;
            documentFaceDescriptor = null;
            documentFaceHash = null;
            document.getElementById('docFaceResult').innerHTML = '';
            extractDocFaceBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    uploadArea.addEventListener('click', () => docImageInput.click());
    docImageInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file && file.type.startsWith('image/')) showPreview(file);
        else alert('الرجاء اختيار ملف صورة');
    });

    extractDocFaceBtn.onclick = async () => {
        if (!modelsLoaded) { alert("النماذج لم تُحمّل بعد"); return; }
        if (!window.uploadedImageSrc) { alert("يرجى اختيار صورة الهوية أولاً"); return; }
        const img = new Image();
        img.src = window.uploadedImageSrc;
        await new Promise((resolve) => { img.onload = resolve; });
        const result = await extractFaceFromMedia(img);
        if (!result) {
            document.getElementById('docFaceResult').innerHTML = '<span class="error">⚠️ لم يتم العثور على وجه واضح في صورة الهوية.</span>';
            return;
        }
        documentFaceDescriptor = result.descriptor;
        documentFaceHash = result.hash;
        document.getElementById('docFaceResult').innerHTML = `<span class="success">✅ تم استخراج الوجه (البصمة: ${documentFaceHash.substring(0,10)}...)</span>`;
    };

    startCameraBtn.onclick = async () => {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            cameraStream = stream;
            video.srcObject = stream;
            await video.play();
            startCameraBtn.disabled = true;
            startLivenessBtn.disabled = false;
            document.getElementById('livenessStatus').innerHTML = '<span class="info">✅ الكاميرا تعمل، اضغط "بدء فحص الحيوية"</span>';
        } catch(err) {
            document.getElementById('livenessStatus').innerHTML = '<span class="error">❌ لا يمكن الوصول للكاميرا</span>';
        }
    };

    async function detectEyeBlink(landmarks) {
        const leftEye = landmarks.getLeftEye();
        const rightEye = landmarks.getRightEye();
        if (!leftEye || !rightEye) return false;
        function getEAR(eyePoints) {
            const A = Math.hypot(eyePoints[1].x - eyePoints[5].x, eyePoints[1].y - eyePoints[5].y);
            const B = Math.hypot(eyePoints[2].x - eyePoints[4].x, eyePoints[2].y - eyePoints[4].y);
            const C = Math.hypot(eyePoints[0].x - eyePoints[3].x, eyePoints[0].y - eyePoints[3].y);
            return (A + B) / (2.0 * C);
        }
        const leftEAR = getEAR(leftEye);
        const rightEAR = getEAR(rightEye);
        return (leftEAR + rightEAR) / 2 < 0.25;
    }

    function getHeadDirection(landmarks, box) {
        const nose = landmarks.getNose();
        if (!nose || nose.length < 3) return "مستقيم";
        const noseTip = nose[2];
        const faceCenterX = box.x + box.width/2;
        const offset = (noseTip.x - faceCenterX) / box.width;
        if (offset < -0.1) return "يسار";
        if (offset > 0.1) return "يمين";
        const yRatio = (noseTip.y - box.y) / box.height;
        if (yRatio < 0.3) return "أعلى";
        if (yRatio > 0.7) return "أسفل";
        return "مستقيم";
    }

    async function runLivenessCheck() {
        const instructions = ["إرمش الآن", "أدر رأسك يساراً", "أدر رأسك يميناً", "أدر رأسك للأعلى", "أدر رأسك للأسفل"];
        let step = 0;
        let blink = false, left = false, right = false, up = false, down = false;
        const statusDiv = document.getElementById('livenessStatus');
        statusDiv.innerHTML = `<span class="info">⏳ اتبع التعليمات: ${instructions[0]}</span>`;
        return new Promise((resolve) => {
            const interval = setInterval(async () => {
                if (!video.videoWidth) return;
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks();
                if (!detection) return;
                const landmarks = detection.landmarks;
                const box = detection.detection.box;
                const isBlinking = await detectEyeBlink(landmarks);
                if (step === 0 && isBlinking && !blink) { blink = true; step++; statusDiv.innerHTML = `<span class="success">✅ إرماش! الآن ${instructions[1]}</span>`; }
                const dir = getHeadDirection(landmarks, box);
                if (step === 1 && dir === "يسار" && !left) { left = true; step++; statusDiv.innerHTML = `<span class="success">✅ يسار! الآن ${instructions[2]}</span>`; }
                if (step === 2 && dir === "يمين" && !right) { right = true; step++; statusDiv.innerHTML = `<span class="success">✅ يمين! الآن ${instructions[3]}</span>`; }
                if (step === 3 && dir === "أعلى" && !up) { up = true; step++; statusDiv.innerHTML = `<span class="success">✅ أعلى! الآن ${instructions[4]}</span>`; }
                if (step === 4 && dir === "أسفل" && !down) {
                    down = true; step++;
                    clearInterval(interval);
                    statusDiv.innerHTML = `<span class="success">🎉 اجتزت فحص الحيوية!</span>`;
                    const live = await extractFaceFromMedia(video);
                    if (live && documentFaceDescriptor) {
                        liveFaceDescriptor = live.descriptor;
                        liveFaceHash = live.hash;
                        const dist = faceapi.euclideanDistance(liveFaceDescriptor, documentFaceDescriptor);
                        const matched = dist < 0.6;
                        faceMatched = matched;
                        const matchDiv = document.getElementById('finalComparisonResult');
                        if (matched) {
                            matchDiv.innerHTML = `<span class="success">✅ الوجه الملتقط يطابق وجه الهوية (المسافة: ${dist.toFixed(3)})</span>`;
                            registerBtn.disabled = false;
                            livenessPassed = true;
                        } else {
                            matchDiv.innerHTML = `<span class="error">❌ الوجه الحي لا يطابق الهوية (المسافة: ${dist.toFixed(3)})</span>`;
                        }
                    } else {
                        statusDiv.innerHTML = '<span class="error">فشل التقاط الوجه الحي</span>';
                    }
                    resolve(true);
                }
            }, 500);
        });
    }

    startLivenessBtn.onclick = async () => {
        if (!documentFaceDescriptor) { alert("يرجى استخراج وجه الهوية أولاً"); return; }
        startLivenessBtn.disabled = true;
        await runLivenessCheck();
    };

    registerBtn.onclick = async () => {
        const name = fullNameInput.value.trim();
        if (!name) { alert("الرجاء إدخال الاسم"); return; }
        if (!livenessPassed || !faceMatched) { alert("لم يكتمل فحص الحيوية أو تطابق الوجه"); return; }
        const docType = documentTypeSelect.value;
        let previousHash = "";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if (data.chain.length) previousHash = data.chain[data.chain.length-1].hash;
        } catch(e) { previousHash = "0"; }
        const payload = { name, face_hash: liveFaceHash, document_hash: documentFaceHash, document_type: docType, biometric_verified: true, previous_hash: previousHash };
        registerBtn.disabled = true;
        document.getElementById('registerStatus').innerHTML = '<span class="info">⏳ جاري التسجيل...</span>';
        try {
            const response = await fetch('/add_block', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            if (response.ok) {
                sessionStorage.setItem('verifiedName', name);
                sessionStorage.setItem('verifiedDocType', docType);
                sessionStorage.setItem('verifiedTimestamp', new Date().toLocaleString());
                window.location.href = '/verification-result';
            } else {
                document.getElementById('registerStatus').innerHTML = `<span class="error">❌ فشل التسجيل: ${result.error}</span>`;
                registerBtn.disabled = false;
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<span class="error">خطأ في الاتصال</span>`;
            registerBtn.disabled = false;
        }
    };

    loadModels();
    startCameraBtn.disabled = true;
    startLivenessBtn.disabled = true;
    extractDocFaceBtn.disabled = true;
    registerBtn.disabled = true;
    docImageInput.disabled = false;
    // تسجيل Service Worker للتطبيق (PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.error('Service Worker registration failed:', err));
    }
</script>
</body>
</html>
