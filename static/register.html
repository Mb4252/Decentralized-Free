<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>وثاق - تسجيل الهوية (متوافق مع المعايير العالمية)</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2c7da0">
    <style>
        /* (سيتم إضافة نفس التنسيقات الجميلة السابقة مع تحديثات طفيفة) */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2c7da0 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        h1 { color: #1e3c72; text-align: center; font-size: 1.5rem; margin-top: 0; }
        .card { background: #f9f9fc; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e4e8; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #2c3e50; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 40px; border: 1px solid #ddd; font-size: 1rem; }
        button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 40px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #2c7da0; color: white; }
        .btn-primary:disabled { background: #b0c4d9; cursor: not-allowed; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:disabled { background: #b0d9bd; cursor: not-allowed; }
        .btn-warning { background: #ffc107; color: #333; }
        video { width: 100%; border-radius: 20px; border: 2px solid #ddd; background: #000; margin: 10px 0; transform: scaleX(-1); }
        .result { margin: 10px 0; padding: 12px; border-radius: 40px; text-align: center; font-size: 0.85rem; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; padding: 8px; background: #e0e0e0; margin: 0 2px; border-radius: 40px; font-size: 0.7rem; color: #666; }
        .step.active { background: #2c7da0; color: white; }
        .step.completed { background: #28a745; color: white; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2c7da0; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .quality-meter { height: 4px; background: #e0e0e0; border-radius: 2px; margin: 10px 0; overflow: hidden; }
        .quality-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #dc3545, #ffc107, #28a745); transition: width 0.5s; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📜 وثاق | Wethaq</h1>
    
    <div class="step-indicator">
        <div class="step active" id="step1">1️⃣ بيانات</div>
        <div class="step" id="step2">2️⃣ الوثيقة</div>
        <div class="step" id="step3">3️⃣ الوجه</div>
        <div class="step" id="step4">4️⃣ تسجيل</div>
    </div>

    <!-- الخطوة 1: البيانات الأساسية -->
    <div id="step1Content">
        <div class="card">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="مثال: أحمد محمد العلي">
            <label>📋 نوع الوثيقة</label>
            <select id="docType">
                <option value="passport">🛂 جواز سفر</option>
                <option value="national_id">🪪 بطاقة هوية وطنية</option>
                <option value="driver_license">🚗 رخصة قيادة</option>
            </select>
            <label>🔒 مستوى الأمان</label>
            <select id="securityLevel">
                <option value="high_security">عالي (بنوك/حكومات) - متطلبات NIST الصارمة</option>
                <option value="standard" selected>قياسي (عام) - معايير ISO/IEC</option>
                <option value="low_security">منخفض (وقت حقيقي) - تسامح أعلى</option>
            </select>
            <button id="nextToDoc" class="btn-primary">▶️ التالي</button>
        </div>
    </div>

    <!-- الخطوة 2: تصوير الوثيقة -->
    <div id="step2Content" style="display:none;">
        <div class="card">
            <p style="text-align:center;">📸 ضع الوثيقة أمام الكاميرا</p>
            <div class="quality-meter"><div class="quality-fill" id="docQualityFill"></div></div>
            <video id="docCam" autoplay muted playsinline></video>
            <button id="startDocCam" class="btn-primary">📷 تشغيل الكاميرا</button>
            <button id="captureDoc" class="btn-primary" disabled>📸 تصوير الوثيقة</button>
            <div id="docResult" class="result"></div>
            <button id="confirmDoc" class="btn-success" disabled>✅ تأكيد</button>
        </div>
    </div>

    <!-- الخطوة 3: التحقق الحيوي بالكامل -->
    <div id="step3Content" style="display:none;">
        <div class="card">
            <p style="text-align:center;">🎥 وجه الكاميرا نحو وجهك</p>
            <div class="quality-meter"><div class="quality-fill" id="faceQualityFill"></div></div>
            <video id="faceCam" autoplay muted playsinline></video>
            <button id="startFaceCam" class="btn-primary">📷 تشغيل الكاميرا</button>
            <button id="captureFace" class="btn-primary" disabled>📸 التقاط الوجه</button>
            <div id="faceResult" class="result"></div>
            <button id="verifyAndConfirm" class="btn-success" disabled>🔐 التحقق والمتابعة</button>
        </div>
    </div>

    <!-- الخطوة 4: التسجيل -->
    <div id="step4Content" style="display:none;">
        <div class="card" style="text-align: center;">
            <div id="finalResult" class="result"></div>
            <button id="registerFinal" class="btn-success" disabled>📝 تسجيل الهوية</button>
            <div id="registerStatus" class="result"></div>
        </div>
    </div>
</div>

<script>
    // ------------------- المتغيرات -------------------
    let modelsLoaded = false;
    let docStream = null;
    let faceStream = null;
    let docDescriptor = null;
    let faceDescriptor = null;
    let docHash = null;
    let faceHash = null;
    let step = 1;
    let docCamStarted = false;
    let faceCamStarted = false;
    
    // إعدادات النماذج حسب متطلبات NIST
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
    const DETECTION_MODEL = 'ssd_mobilenetv1';  // النموذج الأكثر دقة (SSD Mobilenet V1)
    
    // ------------------- تحميل النماذج -------------------
    async function loadModels() {
        try {
            // تحميل نموذج SSD Mobilenet V1 للكشف عن الوجه بدقة أعلى
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            modelsLoaded = true;
            console.log("✅ النماذج جاهزة وفقاً لمعايير NIST");
        } catch(e) {
            console.error(e);
            alert("فشل تحميل نماذج الذكاء الاصطناعي، يرجى التحقق من الاتصال بالإنترنت");
        }
    }
    
    // ------------------- حساب جودة الصورة -------------------
    function assessImageQuality(videoElement) {
        if (!videoElement.videoWidth) return { score: 0, message: "الكاميرا غير جاهزة" };
        
        // التحقق من دقة الفيديو
        const width = videoElement.videoWidth;
        const height = videoElement.videoHeight;
        
        if (width < 300 || height < 300) {
            return { score: 0, message: `دقة منخفضة: ${width}x${height}` };
        }
        
        // حساب نسبة الجودة الأساسية
        let qualityScore = 0;
        if (width >= 640) qualityScore += 30;
        else if (width >= 480) qualityScore += 20;
        else if (width >= 320) qualityScore += 10;
        
        if (height >= 480) qualityScore += 20;
        else if (height >= 360) qualityScore += 10;
        
        // جودة الفيديو التقريبية
        qualityScore += 50;  // افتراض إضاءة جيدة
        
        return { score: Math.min(100, qualityScore), message: `${width}x${height} - مقبول` };
    }
    
    // ------------------- استخراج المتجه البيومتري -------------------
    async function extractFaceDescriptor(videoElement) {
        try {
            const detection = await faceapi.detectSingleFace(videoElement)
                .withFaceLandmarks()
                .withFaceDescriptor();
            if (!detection) return null;
            
            // تحويل Float32Array إلى Array للإرسال
            const descriptor = Array.from(detection.descriptor);
            return descriptor;
        } catch(e) {
            console.error("خطأ في استخراج الوجه:", e);
            return null;
        }
    }
    
    async function extractFaceDescriptorFromImage(imgElement) {
        try {
            const detection = await faceapi.detectSingleFace(imgElement)
                .withFaceLandmarks()
                .withFaceDescriptor();
            if (!detection) return null;
            const descriptor = Array.from(detection.descriptor);
            return descriptor;
        } catch(e) {
            console.error("خطأ في استخراج الوجه من الصورة:", e);
            return null;
        }
    }
    
    // ------------------- التنقل بين الخطوات -------------------
    function goToStep(s) {
        step = s;
        for(let i=1; i<=4; i++) {
            const el = document.getElementById(`step${i}`);
            if(i < s) el.classList.add('completed');
            else if(i === s) el.classList.add('active');
            else el.classList.remove('active', 'completed');
        }
        document.getElementById('step1Content').style.display = s===1?'block':'none';
        document.getElementById('step2Content').style.display = s===2?'block':'none';
        document.getElementById('step3Content').style.display = s===3?'block':'none';
        document.getElementById('step4Content').style.display = s===4?'block':'none';
    }
    
    // ------------------- الخطوة 1 -> 2 -------------------
    document.getElementById('nextToDoc').onclick = () => {
        if(!fullName.value.trim()) {
            alert("الرجاء إدخال الاسم الكامل");
            return;
        }
        goToStep(2);
    };
    
    // ------------------- كاميرا الوثيقة -------------------
    document.getElementById('startDocCam').onclick = async () => {
        if(docStream) docStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { min: 640 }, height: { min: 480 } } });
            docStream = stream;
            docVideo.srcObject = stream;
            await docVideo.play();
            docCamStarted = true;
            document.getElementById('startDocCam').disabled = true;
            document.getElementById('captureDoc').disabled = false;
            document.getElementById('docResult').innerHTML = '<span class="success">✅ الكاميرا تعمل، اضغط تصوير الوثيقة</span>';
        } catch(e) {
            document.getElementById('docResult').innerHTML = '<span class="error">❌ لا يمكن تشغيل الكاميرا، تأكد من الأذونات</span>';
        }
    };
    
    document.getElementById('captureDoc').onclick = async () => {
        if(!docCamStarted) { alert("شغّل الكاميرا أولاً"); return; }
        const btn = document.getElementById('captureDoc');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري المعالجة...';
        
        // تحديث جودة الصورة
        const quality = assessImageQuality(docVideo);
        document.getElementById('docQualityFill').style.width = `${quality.score}%`;
        
        const canvas = document.createElement('canvas');
        canvas.width = docVideo.videoWidth;
        canvas.height = docVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(docVideo, 0, 0);
        
        const img = new Image();
        img.src = canvas.toDataURL();
        await new Promise(r => img.onload = r);
        
        const descriptor = await extractFaceDescriptorFromImage(img);
        if(!descriptor) {
            document.getElementById('docResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه واضح في الوثيقة. يرجى التأكد من الإضاءة وجودة الصورة</span>';
            btn.disabled = false;
            btn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        docDescriptor = descriptor;
        document.getElementById('docResult').innerHTML = `<span class="success">✅ تم استخراج الوجه بنجاح (جودة الصورة: ${quality.score}%)</span>`;
        document.getElementById('confirmDoc').disabled = false;
        btn.disabled = false;
        btn.innerHTML = "📸 إعادة التصوير";
    };
    
    document.getElementById('confirmDoc').onclick = () => {
        if(docStream) { docStream.getTracks().forEach(t => t.stop()); docVideo.srcObject = null; }
        goToStep(3);
    };
    
    // ------------------- كاميرا الوجه -------------------
    document.getElementById('startFaceCam').onclick = async () => {
        if(faceStream) faceStream.getTracks().forEach(t => t.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { min: 640 }, height: { min: 480 } } });
            faceStream = stream;
            faceVideo.srcObject = stream;
            await faceVideo.play();
            faceCamStarted = true;
            document.getElementById('startFaceCam').disabled = true;
            document.getElementById('captureFace').disabled = false;
            document.getElementById('faceResult').innerHTML = '<span class="success">✅ الكاميرا تعمل، اضغط التقاط الوجه</span>';
        } catch(e) {
            document.getElementById('faceResult').innerHTML = '<span class="error">❌ لا يمكن تشغيل الكاميرا، تأكد من الأذونات</span>';
        }
    };
    
    document.getElementById('captureFace').onclick = async () => {
        if(!faceCamStarted) { alert("شغّل الكاميرا أولاً"); return; }
        const btn = document.getElementById('captureFace');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري المعالجة...';
        
        // تحديث جودة الصورة
        const quality = assessImageQuality(faceVideo);
        document.getElementById('faceQualityFill').style.width = `${quality.score}%`;
        
        const descriptor = await extractFaceDescriptor(faceVideo);
        if(!descriptor) {
            document.getElementById('faceResult').innerHTML = '<span class="error">❌ لم يتم العثور على وجه. يرجى التأكد من الإضاءة وجودة الكاميرا</span>';
            btn.disabled = false;
            btn.innerHTML = "📸 إعادة المحاولة";
            return;
        }
        
        faceDescriptor = descriptor;
        document.getElementById('faceResult').innerHTML = `<span class="success">✅ تم استخراج الوجه الحي بنجاح (جودة الصورة: ${quality.score}%)</span>`;
        
        // إرسال المتجهات إلى الخادم للتحقق الرسمي
        btn.innerHTML = '<span class="spinner"></span> جاري التحقق من المطابقة...';
        
        const securityLevel = document.getElementById('securityLevel').value;
        
        try {
            const response = await fetch('/verify-biometric', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    doc_descriptor: docDescriptor,
                    face_descriptor: faceDescriptor,
                    security_level: securityLevel
                })
            });
            
            const result = await response.json();
            
            if (response.ok && result.is_match) {
                // تخزين الهاشات التي أعادها الخادم بعد التحقق
                docHash = result.doc_hash;
                faceHash = result.face_hash;
                
                document.getElementById('faceResult').innerHTML = `
                    <span class="success">
                        ✅ التحقق البيومتري ناجح!<br>
                        نسبة التطابق: ${result.confidence_score}%<br>
                        المسافة الإقليدية: ${result.distance}<br>
                        FNMR التقديرية: ${(result.fnmr_estimate * 100).toFixed(1)}%<br>
                        مستوى الأمان: ${result.security_level_display || securityLevel}
                    </span>
                `;
                document.getElementById('verifyAndConfirm').disabled = false;
            } else {
                let errorMsg = result.message || 'الوجوه غير متطابقة';
                if (result.fnmr_estimate) {
                    errorMsg += ` (FNMR التقديرية: ${(result.fnmr_estimate * 100).toFixed(1)}%)`;
                }
                document.getElementById('faceResult').innerHTML = `<span class="error">❌ فشل التحقق: ${errorMsg}</span>`;
                document.getElementById('verifyAndConfirm').disabled = true;
            }
        } catch(err) {
            document.getElementById('faceResult').innerHTML = `<span class="error">❌ خطأ في الاتصال بالخادم: ${err.message}</span>`;
            document.getElementById('verifyAndConfirm').disabled = true;
        }
        
        btn.disabled = false;
        btn.innerHTML = "📸 إعادة المحاولة";
    };
    
    document.getElementById('verifyAndConfirm').onclick = () => {
        if(faceStream) { faceStream.getTracks().forEach(t => t.stop()); faceVideo.srcObject = null; }
        goToStep(4);
        
        document.getElementById('finalResult').innerHTML = `
            <div class="success">
                ✅ تم التحقق بنجاح وفقاً للمعايير العالمية ISO/IEC 30107-3<br><br>
                👤 ${fullName.value}<br>
                📋 ${docType.value}<br>
                🔐 سيتم تسجيل البصمات فقط في السلسلة
            </div>
        `;
        document.getElementById('registerFinal').disabled = false;
    };
    
    // ------------------- التسجيل في السلسلة -------------------
    document.getElementById('registerFinal').onclick = async () => {
        const btn = document.getElementById('registerFinal');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري التسجيل...';
        
        let prevHash = "0";
        try {
            const res = await fetch('/chain');
            const data = await res.json();
            if(data.chain && data.chain.length) {
                prevHash = data.chain[data.chain.length-1].hash;
            }
        } catch(e) {}
        
        const payload = {
            name: fullName.value.trim(),
            face_hash: faceHash,
            document_hash: docHash,
            document_type: docType.value,
            biometric_verified: true,
            previous_hash: prevHash
        };
        
        try {
            const res = await fetch('/add_block', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if(res.ok) {
                sessionStorage.setItem('verifiedName', fullName.value);
                sessionStorage.setItem('verifiedDocType', docType.value);
                sessionStorage.setItem('verifiedTimestamp', new Date().toLocaleString());
                document.getElementById('registerStatus').innerHTML = '<span class="success">🎉 تم التسجيل بنجاح! جاري التوجيه...</span>';
                setTimeout(() => { window.location.href = '/profile'; }, 1500);
            } else {
                document.getElementById('registerStatus').innerHTML = `<span class="error">❌ فشل التسجيل: ${result.error}</span>`;
                btn.disabled = false;
                btn.innerHTML = "📝 إعادة المحاولة";
            }
        } catch(err) {
            document.getElementById('registerStatus').innerHTML = `<span class="error">❌ خطأ في الاتصال: ${err.message}</span>`;
            btn.disabled = false;
            btn.innerHTML = "📝 إعادة المحاولة";
        }
    };
    
    // ------------------- بدء التشغيل -------------------
    loadModels();
    goToStep(1);
</script>
</body>
</html>
