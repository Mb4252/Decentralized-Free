<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم البوت</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #00aa55; text-align: center; margin-bottom: 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #00aa55;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card .value { font-size: 24px; font-weight: bold; color: #1a1a2e; }
    .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
    .stat-card .profit { color: #00aa55; }
    .stat-card .loss { color: #ff4444; }
    .stat-card .open { color: #ffaa00; }
    table {
      width: 100%;
      background: white;
      border-radius: 16px;
      border-collapse: collapse;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    th {
      background: #00aa55;
      color: white;
      padding: 12px;
      text-align: right;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
    }
    td .profit { color: #00aa55; font-weight: bold; }
    td .loss { color: #ff4444; font-weight: bold; }
    td .open-status { color: #ffaa00; font-weight: bold; }
    td .closed-status { color: #666; }
    .refresh-btn {
      background: #00aa55;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .refresh-btn:hover { background: #008844; }
    .footer { text-align: center; color: #888; font-size: 12px; margin-top: 16px; }
    .empty { text-align: center; color: #888; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 لوحة تحكم البوت - CryptoBot</h1>

    <button class="refresh-btn" onclick="loadData()">🔄 تحديث</button>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="value" id="openPositions">0</div>
        <div class="label">📊 صفقات مفتوحة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="totalTrades">0</div>
        <div class="label">📋 إجمالي الصفقات</div>
      </div>
      <div class="stat-card">
        <div class="value profit" id="totalProfit">0.00</div>
        <div class="label">💰 إجمالي الربح</div>
      </div>
      <div class="stat-card">
        <div class="value loss" id="totalLoss">0.00</div>
        <div class="label">📉 إجمالي الخسارة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="netProfit">0.00</div>
        <div class="label">📊 صافي الربح</div>
      </div>
    </div>

    <div id="tradesTable">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>النوع</th>
            <th>العملة</th>
            <th>الكمية</th>
            <th>سعر الشراء</th>
            <th>الربح</th>
            <th>الحالة</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="tradesBody">
          <tr><td colspan="8" class="empty">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer">🔄 يتم التحديث التلقائي كل 30 ثانية</div>
  </div>

  <script>
    let currentData = null;

    async function loadData() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        currentData = data;
        updateUI(data);
      } catch (error) {
        console.error('❌ خطأ في التحميل:', error);
        document.getElementById('tradesBody').innerHTML = '<tr><td colspan="8" class="empty">❌ خطأ في الاتصال بالخادم</td></tr>';
      }
    }

    function updateUI(data) {
      // تحديث الإحصائيات
      document.getElementById('openPositions').textContent = data.openPositions || 0;
      document.getElementById('totalTrades').textContent = data.totalTrades || 0;
      document.getElementById('totalProfit').textContent = (data.totalProfit || 0).toFixed(4);
      document.getElementById('totalLoss').textContent = (data.totalLoss || 0).toFixed(4);
      
      const netProfit = (data.totalProfit || 0) - (data.totalLoss || 0);
      const netElement = document.getElementById('netProfit');
      netElement.textContent = netProfit.toFixed(4);
      netElement.className = 'value ' + (netProfit >= 0 ? 'profit' : 'loss');

      // تحديث جدول الصفقات
      const tbody = document.getElementById('tradesBody');
      
      if (!data.trades || data.trades.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">لا توجد صفقات حتى الآن</td></tr>';
        return;
      }

      tbody.innerHTML = data.trades.map(trade => {
        const isProfit = trade.profit > 0;
        const profitClass = isProfit ? 'profit' : 'loss';
        const statusClass = trade.status === 'open' ? 'open-status' : 'closed-status';
        const statusText = trade.status === 'open' ? '🟡 مفتوحة' : '🔒 مغلقة';
        
        return `
          <tr>
            <td>${trade.id}</td>
            <td>${trade.type === 'buy' ? '🟢 شراء' : '🔴 بيع'}</td>
            <td>${trade.token}</td>
            <td>${trade.amount.toFixed(6)}</td>
            <td>${trade.price.toFixed(6)}</td>
            <td class="${profitClass}">${trade.profit.toFixed(4)} (${trade.profitPercent || '0'}%)</td>
            <td class="${statusClass}">${statusText}</td>
            <td>${new Date(trade.timestamp).toLocaleTimeString()}</td>
          </tr>
        `;
      }).join('');
    }

    // تحديث تلقائي كل 30 ثانية
    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
