<!DOCTYPE html>
<html>
<head>
    <title>Contract Scanner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-2xl font-bold mb-4">نتائج فحص العقود</h1>
    <table class="w-full text-left border-collapse border border-gray-700">
        <thead>
            <tr class="bg-gray-800">
                <th class="p-3 border border-gray-700">العنوان</th>
                <th class="p-3 border border-gray-700">الرصيد (BNB)</th>
                <th class="p-3 border border-gray-700">وقت الاكتشاف</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>

    <script>
        async function updateTable() {
            const res = await fetch('/api/results');
            const data = await res.json();
            const tbody = document.getElementById('results');
            tbody.innerHTML = data.map(row => `
                <tr class="border-b border-gray-700">
                    <td class="p-3">${row.address}</td>
                    <td class="p-3 text-green-400">${row.balance}</td>
                    <td class="p-3 text-gray-400">${row.time}</td>
                </tr>
            `).join('');
        }
        setInterval(updateTable, 5000); // تحديث الصفحة كل 5 ثواني
        updateTable();
    </script>
</body>
</html>
