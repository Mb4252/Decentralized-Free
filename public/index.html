<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم البوت</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      direction: rtl;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #00aa55; text-align: center; margin-bottom: 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #00aa55;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card .value { font-size: 24px; font-weight: bold; color: #1a1a2e; }
    .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
    .stat-card .profit { color: #00aa55; }
    .stat-card .loss { color: #ff4444; }
    .stat-card .open { color: #ffaa00; }
    table {
      width: 100%;
      background: white;
      border-radius: 16px;
      border-collapse: collapse;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    th {
      background: #00aa55;
      color: white;
      padding: 12px;
      text-align: center;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    td .profit { color: #00aa55; font-weight: bold; }
    td .loss { color: #ff4444; font-weight: bold; }
    td .open-status { color: #ffaa00; font-weight: bold; }
    td .closed-status { color: #666; }
    .empty { text-align: center; color: #888; padding: 40px 0; }
    .last-update { color: #888; font-size: 12px; text-align: center; margin-top: 12px; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .btn-refresh { background: #00aa55; color: white; }
    .btn-refresh:hover { background: #008844; }
    .btn-clear { background: #ff4444; color: white; }
    .btn-clear:hover { background: #cc0000; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 لوحة تحكم البوت - CryptoBot</h1>

    <button class="btn btn-refresh" onclick="loadData()">🔄 تحديث</button>
    <button class="btn btn-clear" onclick="clearTrades()">🗑️ مسح الصفقات</button>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="value open" id="openPositions">0</div>
        <div class="label">📊 صفقات مفتوحة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="totalTrades">0</div>
        <div class="label">📋 إجمالي الصفقات</div>
      </div>
      <div class="stat-card">
        <div class="value profit" id="totalProfit">0.0000</div>
        <div class="label">💰 إجمالي الربح</div>
      </div>
      <div class="stat-card">
        <div class="value loss" id="totalLoss">0.0000</div>
        <div class="label">📉 إجمالي الخسارة</div>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>النوع</th>
            <th>العملة</th>
            <th>الكمية</th>
            <th>السعر</th>
            <th>الربح</th>
            <th>الحالة</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="tradesBody">
          <tr><td colspan="8" class="empty">⏳ جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="last-update" id="lastUpdate">آخر تحديث: --</div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('/api/status-full');
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error('خطأ:', error);
        document.getElementById('tradesBody').innerHTML = '<tr><td colspan="8" class="empty">❌ خطأ في الاتصال</td></tr>';
      }
    }

    function updateUI(data) {
      document.getElementById('openPositions').textContent = data.openTrades || 0;
      document.getElementById('totalTrades').textContent = data.totalTrades || 0;
      
      let totalProfit = 0, totalLoss = 0;
      if (data.trades) {
        data.trades.forEach(t => {
          if (t.status === 'closed' && t.profit) {
            if (t.profit > 0) totalProfit += t.profit;
            else totalLoss += Math.abs(t.profit);
          }
        });
      }
      document.getElementById('totalProfit').textContent = totalProfit.toFixed(4);
      document.getElementById('totalLoss').textContent = totalLoss.toFixed(4);

      const tbody = document.getElementById('tradesBody');
      if (!data.trades || data.trades.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">📭 لا توجد صفقات</td></tr>';
        return;
      }

      tbody.innerHTML = data.trades.slice(0, 20).map(t => {
        const isProfit = t.profit > 0;
        const profitClass = isProfit ? 'profit' : 'loss';
        const statusClass = t.status === 'open' ? 'open-status' : 'closed-status';
        const statusText = t.status === 'open' ? '🟡 مفتوحة' : '🔒 مغلقة';
        const typeText = t.type === 'buy' ? '🟢 شراء' : '🔴 بيع';
        
        return `
          <tr>
            <td>${String(t.id).slice(-6)}</td>
            <td>${typeText}</td>
            <td>${t.token}</td>
            <td>${(t.amount || 0).toFixed(6)}</td>
            <td>${(t.price || 0).toFixed(4)}</td>
            <td class="${profitClass}">${(t.profit || 0).toFixed(4)}</td>
            <td class="${statusClass}">${statusText}</td>
            <td>${new Date(t.timestamp).toLocaleTimeString()}</td>
          </tr>
        `;
      }).join('');
      
      document.getElementById('lastUpdate').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString();
    }

    async function clearTrades() {
      if (!confirm('⚠️ مسح جميع الصفقات؟')) return;
      try {
        await fetch('/api/clear-trades', { method: 'DELETE' });
        loadData();
      } catch (error) {
        alert('خطأ في المسح');
      }
    }

    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
