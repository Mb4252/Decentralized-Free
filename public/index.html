<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم البوت</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      direction: rtl;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #00aa55; text-align: center; margin-bottom: 20px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid #00aa55;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card .value { font-size: 24px; font-weight: bold; color: #1a1a2e; }
    .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
    .stat-card .profit { color: #00aa55; }
    .stat-card .loss { color: #ff4444; }
    .stat-card .open { color: #ffaa00; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    .btn-refresh { background: #00aa55; color: white; }
    .btn-refresh:hover { background: #008844; }
    .btn-clear { background: #ff4444; color: white; }
    .btn-clear:hover { background: #cc0000; }
    .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }
    table {
      width: 100%;
      background: white;
      border-radius: 16px;
      border-collapse: collapse;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    th {
      background: #00aa55;
      color: white;
      padding: 12px;
      text-align: center;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    td .profit { color: #00aa55; font-weight: bold; }
    td .loss { color: #ff4444; font-weight: bold; }
    td .open-status { color: #ffaa00; font-weight: bold; }
    td .closed-status { color: #666; }
    .empty { text-align: center; color: #888; padding: 40px 0; }
    .last-update { color: #888; font-size: 12px; text-align: center; margin-top: 12px; }
    .trade-id { font-size: 11px; color: #888; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 لوحة تحكم البوت - CryptoBot</h1>

    <div class="controls">
      <button class="btn btn-refresh" onclick="loadData()">🔄 تحديث</button>
      <button class="btn btn-clear" onclick="clearTrades()">🗑️ مسح الصفقات</button>
      <span style="flex:1;"></span>
      <span id="autoStatus" style="color:#00aa55;font-weight:bold;">🟢 تحديث تلقائي</span>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="value open" id="openPositions">0</div>
        <div class="label">📊 صفقات مفتوحة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="totalTrades">0</div>
        <div class="label">📋 إجمالي الصفقات</div>
      </div>
      <div class="stat-card">
        <div class="value profit" id="totalProfit">0.0000</div>
        <div class="label">💰 إجمالي الربح</div>
      </div>
      <div class="stat-card">
        <div class="value loss" id="totalLoss">0.0000</div>
        <div class="label">📉 إجمالي الخسارة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="netProfit">0.0000</div>
        <div class="label">📊 صافي الربح</div>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>النوع</th>
            <th>العملة</th>
            <th>الكمية</th>
            <th>سعر الشراء</th>
            <th>الربح</th>
            <th>الحالة</th>
            <th>الوقت</th>
          </tr>
        </thead>
        <tbody id="tradesBody">
          <tr><td colspan="8" class="empty">⏳ جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="last-update" id="lastUpdate">آخر تحديث: --</div>
  </div>

  <script>
    let currentData = null;
    let autoRefreshInterval = null;
    let isRefreshing = false;

    async function loadData() {
      if (isRefreshing) return;
      isRefreshing = true;

      const btn = document.querySelector('.btn-refresh');
      btn.disabled = true;
      btn.textContent = '⏳ جاري...';

      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        currentData = data;
        updateUI(data);
      } catch (error) {
        console.error('❌ خطأ في التحميل:', error);
        document.getElementById('tradesBody').innerHTML = '<tr><td colspan="8" class="empty">❌ خطأ في الاتصال بالخادم</td></tr>';
      }

      btn.disabled = false;
      btn.textContent = '🔄 تحديث';
      isRefreshing = false;
    }

    function updateUI(data) {
      // تحديث الإحصائيات
      document.getElementById('openPositions').textContent = data.openPositions || 0;
      document.getElementById('totalTrades').textContent = data.totalTrades || 0;
      
      const totalProfit = data.totalProfit || 0;
      const totalLoss = data.totalLoss || 0;
      document.getElementById('totalProfit').textContent = totalProfit.toFixed(4);
      document.getElementById('totalLoss').textContent = totalLoss.toFixed(4);
      
      const netProfit = totalProfit - totalLoss;
      const netElement = document.getElementById('netProfit');
      netElement.textContent = netProfit.toFixed(4);
      netElement.className = 'value ' + (netProfit >= 0 ? 'profit' : 'loss');

      // تحديث وقت آخر تحديث
      document.getElementById('lastUpdate').textContent = 'آخر تحديث: ' + new Date(data.lastUpdate || Date.now()).toLocaleTimeString();

      // تحديث جدول الصفقات
      const tbody = document.getElementById('tradesBody');
      
      if (!data.trades || data.trades.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">📭 لا توجد صفقات حتى الآن</td></tr>';
        return;
      }

      tbody.innerHTML = data.trades.slice(0, 50).map(trade => {
        const isProfit = trade.profit > 0;
        const profitClass = isProfit ? 'profit' : 'loss';
        const statusClass = trade.status === 'open' ? 'open-status' : 'closed-status';
        const statusText = trade.status === 'open' ? '🟡 مفتوحة' : '🔒 مغلقة';
        const typeText = trade.type === 'buy' ? '🟢 شراء' : '🔴 بيع';
        
        return `
          <tr>
            <td class="trade-id">${String(trade.id).slice(-6)}</td>
            <td>${typeText}</td>
            <td>${trade.token}</td>
            <td>${(trade.amount || 0).toFixed(6)}</td>
            <td>${(trade.price || 0).toFixed(4)}</td>
            <td class="${profitClass}">${(trade.profit || 0).toFixed(4)} (${trade.profitPercent || '0'}%)</td>
            <td class="${statusClass}">${statusText}</td>
            <td>${new Date(trade.timestamp).toLocaleTimeString()}</td>
          </tr>
        `;
      }).join('');
    }

    async function clearTrades() {
      if (!confirm('⚠️ هل أنت متأكد من مسح جميع الصفقات؟')) return;
      
      try {
        const response = await fetch('/api/clear-trades', { method: 'DELETE' });
        const data = await response.json();
        if (data.success) {
          alert('✅ تم مسح جميع الصفقات');
          loadData();
        }
      } catch (error) {
        alert('❌ خطأ في مسح الصفقات');
        console.error(error);
      }
    }

    // بدء التحديث التلقائي كل 5 ثواني
    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(loadData, 5000);
      document.getElementById('autoStatus').textContent = '🟢 تحديث تلقائي (5 ثواني)';
    }

    // التحميل الأولي
    loadData();
    startAutoRefresh();
  </script>
</body>
</html>
