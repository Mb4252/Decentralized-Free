services:
  - type: web
    name: crypto-investment-platform
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
    cronJobs:
      - name: daily-profit
        schedule: "0 0 * * *"  # كل يوم عند منتصف الليل
        url: /api/profit/cron
        headers:
          - key: x-cron-secret
            value: ${CRON_SECRET}
