<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>الرئيسية | منصة الاستثمار</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: linear-gradient(rgba(0,255,100,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,100,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 80px;
    }
    .navbar {
      background: #1a1a2e;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ff66;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo { font-size: 22px; font-weight: bold; color: #00ff66; display: flex; align-items: center; gap: 10px; }
    .user-actions { display: flex; align-items: center; gap: 15px; }
    .user-name { color: #00ff66; font-size: 14px; }
    .support-btn { background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .logout-btn { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .content { max-width: 500px; margin: 0 auto; padding: 20px; }
    
    .card {
      background: #1a1a2e;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #00ff66;
    }
    .card-title { color: white; font-size: 18px; margin-bottom: 16px; border-right: 3px solid #00ff66; padding-right: 12px; }
    .assets-amount { font-size: 42px; font-weight: bold; color: #00ff66; text-align: center; margin: 16px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; color: #8899aa; }
    .detail-value { color: #00ff66; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #1a1a2e; border-radius: 20px; padding: 16px; text-align: center; border: 1px solid #00ff66; }
    .stat-value { color: #00ff66; font-size: 24px; font-weight: bold; }
    .stat-label { color: #8899aa; font-size: 12px; }
    
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .action-card {
      background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      border: 1px solid #00ff66;
      cursor: pointer;
      transition: all 0.3s;
    }
    .action-card:hover { transform: translateY(-3px); border-color: #00ff66; box-shadow: 0 10px 20px rgba(0,255,102,0.2); }
    .action-icon { font-size: 40px; margin-bottom: 10px; }
    .action-title { color: white; font-size: 18px; font-weight: bold; }
    .action-sub { color: #8899aa; font-size: 12px; margin-top: 5px; }
    
    .vip-item {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #00ff66;
      cursor: pointer;
      transition: all 0.3s;
    }
    .vip-item:hover { border-color: #00ff66; transform: translateX(-5px); }
    .vip-name { color: #00ff66; font-weight: bold; }
    .vip-roi { color: #00ccff; }
    .vip-price { color: #fbbf24; font-size: 14px; }
    .vip-status { font-size: 12px; }
    .upgrade-btn { background: #00ff66; color: #0a0a0f; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #00ff66;
      background: #0a0a0f;
      color: white;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #00ff66; }
    .deposit-btn, .withdraw-btn {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .deposit-btn { background: linear-gradient(135deg, #00ff66, #00ccff); color: #0a0a0f; }
    .withdraw-btn { background: linear-gradient(135deg, #ff4444, #ff6680); color: white; }
    .btn-copy {
      background: rgba(0,255,102,0.15);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .network-btn {
      background: rgba(0,255,102,0.1);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 10px;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      text-align: center;
    }
    .message { padding: 12px; border-radius: 12px; margin-bottom: 16px; text-align: center; font-size: 14px; }
    .success { background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; }
    .error { background: rgba(255,68,68,0.15); border: 1px solid #ff4444; color: #ff4444; }
    .warning { background: rgba(255,170,0,0.15); border: 1px solid #ffaa00; color: #ffaa00; }
    .loading { background: rgba(0,204,255,0.15); border: 1px solid #00ccff; color: #00ccff; }
    .info-box {
      background: rgba(0,204,255,0.1);
      border: 1px solid #00ccff;
      border-radius: 16px;
      padding: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: #00ccff;
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      border-top: 2px solid #00ff66;
      z-index: 999;
    }
    .nav-item {
      background: none;
      border: none;
      color: #8899aa;
      cursor: pointer;
      padding: 8px;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-item.active { color: #00ff66; }
    .nav-label { font-size: 10px; margin-top: 2px; }
    
    .page { display: none; }
    .page.active { display: block; }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1a1a2e;
      border-radius: 32px;
      padding: 28px;
      max-width: 450px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #00ff66;
    }
    .modal-content h3 { color: #00ff66; margin-bottom: 16px; font-size: 20px; }
    .modal-content h4 { color: #00ccff; margin: 16px 0 8px; }
    .modal-content p { color: #8899aa; margin-bottom: 10px; line-height: 1.5; font-size: 14px; }
    .close-modal {
      background: #00ff66;
      color: #0a0a0f;
      border: none;
      padding: 12px;
      border-radius: 30px;
      font-weight: bold;
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
    }
    .hidden { display: none; }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #00ff66;
    }
    .history-type { font-weight: bold; }
    .history-amount { color: #00ff66; }
    .history-status { font-size: 12px; }
    .status-approved { color: #00ff66; }
    .status-pending { color: #ffaa00; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">💰 CryptoInvest</div>
    <div class="user-actions">
      <button class="support-btn" id="supportBtn">💬 الدعم</button>
      <span class="user-name" id="userName"></span>
      <button class="logout-btn" id="logoutBtn">🚪 خروج</button>
    </div>
  </div>

  <div class="content" id="mainContent"></div>

  <div class="bottom-nav">
    <button class="nav-item active" data-page="dashboard">🏠<span class="nav-label">البيت</span></button>
    <button class="nav-item" data-page="vip">👑<span class="nav-label">VIP</span></button>
    <button class="nav-item" data-page="deposit">💰<span class="nav-label">إيداع</span></button>
    <button class="nav-item" data-page="withdraw">📤<span class="nav-label">سحب</span></button>
    <button class="nav-item" data-page="referral">👥<span class="nav-label">فريق</span></button>
    <button class="nav-item" data-page="profile">👤<span class="nav-label">أنا</span></button>
  </div>

  <!-- نافذة التعليمات -->
  <div id="instructionsModal" class="modal hidden">
    <div class="modal-content">
      <h3>📖 مرحباً بك في منصة الاستثمار</h3>
      <h4>💰 كيفية الإيداع:</h4>
      <p>1. اضغط على أيقونة <strong>💰 الإيداع</strong></p>
      <p>2. انسخ عنوان المحفظة (شبكة <strong>BSC/BEP20</strong>)</p>
      <p>3. قم بتحويل USDT إلى هذا العنوان</p>
      <p>4. الصق Transaction Hash</p>
      <p>5. اضغط <strong>"تحقق وأيدع"</strong> - سيتم إضافة المبلغ تلقائياً</p>
      <button class="close-modal" id="closeInstructions">✅ فهمت</button>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let userId = localStorage.getItem('userId');
    let userData = null;

    // ✅ عنوان المحفظة الحقيقي
    const HOT_WALLET_ADDRESS = '0x9EB39A10c059877910DAff1fd8098e5DB32486F7';
    
    const MIN_WITHDRAW = 0.5;

    // ✅ مستويات VIP
    const vipLevels = {
      1: { name: 'VIP 1', price: 10, roi: 2.2 },
      2: { name: 'VIP 2', price: 50, roi: 2.5 },
      3: { name: 'VIP 3', price: 100, roi: 2.8 },
      4: { name: 'VIP 4', price: 250, roi: 3.2 },
      5: { name: 'VIP 5', price: 500, roi: 3.5 },
      6: { name: 'VIP 6', price: 1000, roi: 4.0 }
    };

    async function loadUser() {
      if (!userId) { window.location.href = '/'; return; }
      try {
        const res = await fetch(`${API_URL}/api/user`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.error) { localStorage.clear(); window.location.href = '/'; return; }
        userData = data;
        document.getElementById('userName').innerHTML = `👋 ${userData.name}`;
        
        if (!localStorage.getItem('instructionsShown')) {
          document.getElementById('instructionsModal').classList.remove('hidden');
        }
        
        renderDashboard();
      } catch(e) { console.error(e); }
    }

    document.getElementById('logoutBtn').onclick = () => {
      localStorage.clear();
      window.location.href = '/';
    };

    document.getElementById('supportBtn').onclick = () => {
      window.open('https://t.me/+fPunvn_76Q45NDg8', '_blank');
    };

    document.getElementById('closeInstructions').onclick = () => {
      document.getElementById('instructionsModal').classList.add('hidden');
      localStorage.setItem('instructionsShown', 'true');
    };

    function showMessage(msg, type, duration = 5000) {
      const container = document.getElementById('mainContent');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = msg;
      container.insertBefore(msgDiv, container.firstChild);
      setTimeout(() => msgDiv.remove(), duration);
    }

    function clearMessages() {
      const container = document.getElementById('mainContent');
      const messages = container.querySelectorAll('.message');
      messages.forEach(msg => msg.remove());
    }

    function redirectToDepositWithPrice(packagePrice, packageName) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-page="deposit"]').classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('depositPage').classList.add('active');
      showMessage(`⚠️ تحتاج إلى إيداع ${packagePrice} USDT للاشتراك في ${packageName}`, 'warning', 6000);
      renderDeposit();
    }

    async function renderDashboard() {
      const active = userData?.active_deposit || 0;
      const avail = userData?.available_balance || 0;
      const totalDeposit = userData?.total_deposited || 0;
      const totalWithdraw = userData?.total_withdrawn || 0;
      const currentVip = userData?.vip_level || 0;
      const currentRoi = currentVip > 0 ? (vipLevels[currentVip]?.roi || 2) : 2;
      const currentVipName = currentVip > 0 ? (vipLevels[currentVip]?.name || 'غير مشترك') : 'غير مشترك';
      
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="assets-amount">${(active+avail).toFixed(2)} USDT</div>
          <div class="detail-row"><span>💰 الاستثمار النشط</span><span class="detail-value">${active.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>💎 الرصيد المتاح</span><span class="detail-value">${avail.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>📊 إجمالي الإيداعات</span><span class="detail-value">${totalDeposit.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>📤 إجمالي السحوبات</span><span class="detail-value">${totalWithdraw.toFixed(2)} USDT</span></div>
        </div>
        
        <div class="action-buttons">
          <div class="action-card" id="quickDepositBtn">
            <div class="action-icon">💰</div>
            <div class="action-title">إيداع</div>
            <div class="action-sub">أضف أموالاً إلى حسابك</div>
          </div>
          <div class="action-card" id="quickWithdrawBtn">
            <div class="action-icon">📤</div>
            <div class="action-title">سحب</div>
            <div class="action-sub">اسحب أرباحك</div>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${currentRoi}%</div><div class="stat-label">نسبة الربح</div></div>
          <div class="stat-card"><div class="stat-value">${currentVipName}</div><div class="stat-label">المستوى الحالي</div></div>
        </div>
      `;
      
      document.getElementById('quickDepositBtn').onclick = () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-page="deposit"]').classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('depositPage').classList.add('active');
        renderDeposit();
      };
      
      document.getElementById('quickWithdrawBtn').onclick = () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-page="withdraw"]').classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('withdrawPage').classList.add('active');
        renderWithdraw();
      };
    }

    // ========================================
    // صفحة الإيداع (بدون إدخال المبلغ)
    // ========================================
    async function renderDeposit() {
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">💰 إيداع USDT</div>
          <div class="network-btn" id="networkInfoBtn">
            🌐 شبكة التحويل: <strong>BNB Smart Chain (BSC / BEP20)</strong> 📋
          </div>
          <p style="color:#8899aa; font-size:12px; margin-bottom:8px;">محفظة الإيداع:</p>
          <code style="color:#00ff66; word-break:break-all;">${HOT_WALLET_ADDRESS}</code>
          <button class="btn-copy" id="copyWalletBtn">📋 نسخ العنوان</button>
          
          <input type="text" id="depositTxHash" placeholder="Transaction Hash (0x...)" style="direction:ltr; font-family: monospace; margin-top:16px;">
          <button class="deposit-btn" id="doDepositBtn">🔍 تحقق وأيدع</button>
          
          <div class="info-box">
            <strong>📌 كيف يتم الإيداع؟</strong><br>
            1. انسخ عنوان المحفظة أعلاه<br>
            2. أرسل USDT على شبكة BSC/BEP20<br>
            3. الصق Transaction Hash هنا<br>
            4. سيتم إضافة المبلغ تلقائياً بعد التحقق
          </div>
          <div id="depositMsg"></div>
        </div>
      `;
      
      document.getElementById('copyWalletBtn').onclick = () => {
        navigator.clipboard.writeText(HOT_WALLET_ADDRESS);
        showMessage('✅ تم نسخ عنوان المحفظة!', 'success', 2000);
      };
      
      document.getElementById('networkInfoBtn').onclick = () => {
        navigator.clipboard.writeText('BSC BEP20');
        showMessage('✅ تم نسخ اسم الشبكة: BSC (BEP20)', 'success', 2000);
      };
      
      document.getElementById('doDepositBtn').onclick = async () => {
        const txHash = document.getElementById('depositTxHash').value.trim();
        
        clearMessages();
        
        if (!txHash) {
          showMessage('⚠️ يرجى إدخال Transaction Hash', 'error', 3000);
          return;
        }
        
        showMessage('⏳ جاري التحقق من المعاملة...', 'loading', 15000);
        
        try {
          // أولاً: التحقق من المعاملة للحصول على المبلغ
          const verifyRes = await fetch(`${API_URL}/api/verify-deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, transactionHash: txHash, amount: 0 })
          });
          
          const verifyData = await verifyRes.json();
          
          if (!verifyData.success) {
            showMessage(`❌ ${verifyData.error}`, 'error', 6000);
            return;
          }
          
          // استخراج المبلغ من المعاملة
          const actualAmount = verifyData.verification?.amount;
          
          if (!actualAmount || actualAmount < 10) {
            showMessage(`⚠️ المبلغ المحول (${actualAmount || 0} USDT) أقل من الحد الأدنى 10 USDT`, 'error', 5000);
            return;
          }
          
          // الآن إرسال طلب الإيداع مع المبلغ المستخرج
          const depositRes = await fetch(`${API_URL}/api/deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount: actualAmount, transactionHash: txHash })
          });
          
          const depositData = await depositRes.json();
          clearMessages();
          
          if (depositData.success) {
            showMessage(`✅ تم إضافة ${actualAmount} USDT إلى حسابك بنجاح!`, 'success', 5000);
            document.getElementById('depositTxHash').value = '';
            loadUser();
          } else {
            showMessage(`❌ ${depositData.error}`, 'error', 6000);
          }
        } catch (error) {
          clearMessages();
          showMessage('❌ خطأ في الاتصال بالخادم', 'error', 5000);
        }
      };
    }

    async function renderWithdraw() {
      const avail = userData?.available_balance || 0;
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">💸 سحب USDT</div>
          <div class="assets-amount" style="font-size:28px;">${avail.toFixed(2)} USDT</div>
          <input type="number" id="withdrawAmount" placeholder="المبلغ (USDT) - الحد الأدنى ${MIN_WITHDRAW}" step="0.1">
          <input type="text" id="walletAddress" placeholder="عنوان محفظة BSC (0x...)">
          <button class="withdraw-btn" id="doWithdrawBtn">💸 سحب USDT</button>
          <div class="info-box">
            <strong>⚠️ الحد الأدنى للسحب: ${MIN_WITHDRAW} USDT</strong><br>
            <strong>⚠️ تأكد من صحة عنوان المحفظة!</strong><br>
            يجب أن يكون من شبكة <strong>BNB Smart Chain (BSC / BEP20)</strong> ويبدأ بـ "0x".
          </div>
          <div id="withdrawMsg"></div>
        </div>
      `;
      
      document.getElementById('doWithdrawBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const address = document.getElementById('walletAddress').value;
        
        if (!amount || amount < MIN_WITHDRAW) {
          showMessage(`⚠️ الحد الأدنى للسحب ${MIN_WITHDRAW} USDT`, 'error', 3000);
          return;
        }
        if (!address || !address.startsWith('0x') || address.length < 30) {
          showMessage('⚠️ يرجى إدخال عنوان محفظة BSC صالح', 'error', 4000);
          return;
        }
        if (amount > avail) {
          showMessage('⚠️ الرصيد غير كافٍ', 'error', 3000);
          return;
        }
        
        try {
          const res = await fetch(`${API_URL}/api/withdraw`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount, walletAddress: address })
          });
          const data = await res.json();
          
          if (data.success) {
            showMessage(`✅ ${data.message}`, 'success', 5000);
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('walletAddress').value = '';
            loadUser();
          } else {
            showMessage(`❌ ${data.error}`, 'error', 4000);
          }
        } catch (error) {
          showMessage('❌ خطأ في الاتصال بالخادم', 'error', 4000);
        }
      };
    }

    async function renderVIP() {
      const currentLevel = userData?.vip_level || 0;
      
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">👑 مستويات VIP</div>
          <div id="vipList"></div>
        </div>
      `;
      
      const container = document.getElementById('vipList');
      container.innerHTML = Object.entries(vipLevels).map(([level, vip]) => `
        <div class="vip-item" data-level="${level}" data-price="${vip.price}" data-name="${vip.name}">
          <div>
            <div class="vip-name">${vip.name}</div>
            <div class="vip-roi">💰 ${vip.roi}% يومياً</div>
            <div class="vip-price">💎 سعر الاشتراك: ${vip.price} USDT</div>
          </div>
          <div>
            ${currentLevel >= parseInt(level) ? '<span class="vip-status" style="color:#00ff66;">✅ مفتوح</span>' : 
              (currentLevel > 0 && currentLevel < parseInt(level) ? '<span class="vip-status" style="color:#8899aa;">🔒 مغلق (يجب ترقية السابق)</span>' :
              '<button class="upgrade-btn" data-level="'+level+'" data-price="'+vip.price+'" data-name="'+vip.name+'">اشتراك ('+vip.price+' USDT)</button>')}
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll('.vip-item').forEach(item => {
        const level = parseInt(item.dataset.level);
        const price = parseFloat(item.dataset.price);
        const name = item.dataset.name;
        
        item.onclick = (e) => {
          if (e.target.classList.contains('upgrade-btn')) return;
          if (currentLevel >= level) {
            showMessage(`✅ ${name} مفتوح بالفعل`, 'success', 2000);
          } else if (currentLevel > 0 && currentLevel < level) {
            showMessage(`⚠️ يجب ترقية المستويات السابقة أولاً`, 'warning', 3000);
          } else {
            redirectToDepositWithPrice(price, name);
          }
        };
      });
      
      document.querySelectorAll('.upgrade-btn').forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const targetLevel = parseInt(btn.dataset.level);
          const price = parseFloat(btn.dataset.price);
          const name = btn.dataset.name;
          
          if (currentLevel >= targetLevel) {
            showMessage(`✅ أنت بالفعل مشترك في ${name}`, 'success', 2000);
            return;
          }
          
          if (currentLevel > 0 && currentLevel < targetLevel - 1) {
            showMessage(`⚠️ يجب ترقية المستويات السابقة أولاً`, 'warning', 3000);
            return;
          }
          
          if (userData.available_balance >= price) {
            const newBalance = userData.available_balance - price;
            await fetch(`${API_URL}/api/update-user`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId, updates: { vip_level: targetLevel, available_balance: newBalance } })
            });
            showMessage(`✅ تم الترقية إلى ${name} بنجاح!`, 'success', 3000);
            loadUser();
          } else {
            redirectToDepositWithPrice(price, name);
          }
        };
      });
    }

    async function renderReferrals() {
      const res = await fetch(`${API_URL}/api/referrals`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      const data = await res.json();
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">🔗 رابط الدعوة</div>
          <code style="color:#00ff66; word-break:break-all;">${window.location.origin}?ref=${userData?.referral_code}</code>
          <button class="btn-copy" id="copyLinkBtn">📋 نسخ الرابط</button>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${data.count || 0}</div><div class="stat-label">المحالين</div></div>
          <div class="stat-card"><div class="stat-value">${(data.groupBalance || 0).toFixed(2)} USDT</div><div class="stat-label">حجم الفريق</div></div>
        </div>
        <div class="card"><div class="card-title">📋 قائمة المحالين</div><div id="referralsList"></div></div>
      `;
      
      document.getElementById('copyLinkBtn').onclick = () => {
        navigator.clipboard.writeText(`${window.location.origin}?ref=${userData?.referral_code}`);
        showMessage('✅ تم نسخ رابط الدعوة!', 'success', 2000);
      };
      
      const listDiv = document.getElementById('referralsList');
      if (!data.referrals || data.referrals.length === 0) {
        listDiv.innerHTML = '<p style="color:#8899aa;">لا يوجد محالين</p>';
      } else {
        listDiv.innerHTML = data.referrals.map(u => `<div style="background:#0a0a0f; padding:12px; border-radius:12px; margin-bottom:8px;">${u.name}<br><span style="font-size:12px;">💰 ${u.active_deposit || 0} USDT</span></div>`).join('');
      }
    }

    // ========================================
    // صفحة الملف الشخصي (أنا) - مع سجل العمليات
    // ========================================
    async function renderProfile() {
      const avail = userData?.available_balance || 0;
      document.getElementById('mainContent').innerHTML = `
        <div class="card" style="text-align:center;">
          <div style="font-size:60px;">👤</div>
          <div style="font-size:20px; font-weight:bold; color:white;">${userData.name}</div>
          <div style="color:#8899aa; font-size:12px;">📧 ${userData.email}</div>
          <div style="color:#00ff66; font-size:28px; margin-top:16px;">${avail.toFixed(2)} USDT</div>
        </div>
        <div class="card"><div class="card-title">📋 سجل العمليات</div><div id="transactionsList"></div></div>
      `;
      
      // جلب جميع المعاملات (الإيداعات والسحوبات والأرباح)
      try {
        // جلب الإيداعات
        const depositsRes = await fetch(`${API_URL}/api/admin/deposits`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const deposits = await depositsRes.json();
        
        // جلب السحوبات
        const withdrawsRes = await fetch(`${API_URL}/api/admin/withdrawals`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const withdrawals = await withdrawsRes.json();
        
        // جلب الأرباح
        const profitsRes = await fetch(`${API_URL}/api/transactions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const profitsData = await profitsRes.json();
        const profits = profitsData.filter(p => p.type === 'profit') || [];
        
        // دمج جميع المعاملات
        const allTransactions = [
          ...(deposits || []).filter(d => d.user_id === userId).map(d => ({ ...d, type: 'إيداع', displayType: '💰 إيداع', date: d.created_at })),
          ...(withdrawals || []).filter(w => w.user_id === userId).map(w => ({ ...w, type: 'سحب', displayType: '📤 سحب', date: w.created_at })),
          ...(profits || []).map(p => ({ ...p, type: 'ربح', displayType: '📈 ربح', date: p.date || p.created_at, amount: p.profit_amount || p.amount, status: 'approved' }))
        ];
        
        // ترتيب من الأحدث إلى الأقدم
        allTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        const listDiv = document.getElementById('transactionsList');
        if (allTransactions.length === 0) {
          listDiv.innerHTML = '<p style="color:#8899aa; text-align:center;">لا توجد معاملات بعد</p>';
        } else {
          listDiv.innerHTML = allTransactions.map(t => `
            <div class="history-item">
              <div>
                <div class="history-type">${t.displayType}</div>
                <div style="font-size:11px; color:#8899aa;">${new Date(t.date).toLocaleDateString('ar')}</div>
              </div>
              <div class="history-amount">${(t.amount || 0).toFixed(2)} USDT</div>
              <div class="history-status status-${t.status === 'approved' ? 'approved' : 'pending'}">${t.status === 'approved' ? '✅ مقبول' : '⏳ قيد الانتظار'}</div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading transactions:', error);
        document.getElementById('transactionsList').innerHTML = '<p style="color:#8899aa; text-align:center;">خطأ في تحميل المعاملات</p>';
      }
    }

    const pages = {
      dashboard: renderDashboard,
      deposit: renderDeposit,
      withdraw: renderWithdraw,
      vip: renderVIP,
      referral: renderReferrals,
      profile: renderProfile
    };

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const page = btn.dataset.page;
        if (pages[page]) pages[page]();
      };
    });

    loadUser();
  </script>
</body>
</html>
