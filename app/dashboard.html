<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>الرئيسية | منصة الاستثمار</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: linear-gradient(rgba(0,255,100,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,100,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 80px;
    }
    .navbar {
      background: #1a1a2e;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ff66;
    }
    .logo { font-size: 22px; font-weight: bold; color: #00ff66; }
    .user-name { color: #00ff66; font-size: 14px; }
    .content { max-width: 500px; margin: 0 auto; padding: 20px; }
    
    /* بطاقات */
    .card {
      background: #1a1a2e;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #00ff66;
    }
    .card-title { color: white; font-size: 18px; margin-bottom: 16px; border-right: 3px solid #00ff66; padding-right: 12px; }
    .assets-amount { font-size: 42px; font-weight: bold; color: #00ff66; text-align: center; margin: 16px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; color: #8899aa; }
    .detail-value { color: #00ff66; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat-card { background: #1a1a2e; border-radius: 20px; padding: 16px; text-align: center; border: 1px solid #00ff66; }
    .stat-value { color: #00ff66; font-size: 24px; font-weight: bold; }
    .stat-label { color: #8899aa; font-size: 12px; }
    .vip-item {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #00ff66;
    }
    .vip-name { color: #00ff66; font-weight: bold; }
    .vip-roi { color: #00ccff; }
    .upgrade-btn { background: #00ff66; color: #0a0a0f; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #00ff66;
      background: #0a0a0f;
      color: white;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #00ff66; }
    .deposit-btn, .withdraw-btn {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .deposit-btn { background: linear-gradient(135deg, #00ff66, #00ccff); color: #0a0a0f; }
    .withdraw-btn { background: linear-gradient(135deg, #ff4444, #ff6680); color: white; }
    .btn-copy {
      background: rgba(0,255,102,0.15);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .message { padding: 12px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
    .success { background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; }
    .error { background: rgba(255,68,68,0.15); border: 1px solid #ff4444; color: #ff4444; }
    .warning { background: rgba(255,170,0,0.15); border: 1px solid #ffaa00; color: #ffaa00; }
    
    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      border-top: 2px solid #00ff66;
      z-index: 999;
    }
    .nav-item {
      background: none;
      border: none;
      color: #8899aa;
      cursor: pointer;
      padding: 8px;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-item.active { color: #00ff66; }
    .nav-label { font-size: 10px; margin-top: 2px; }
    
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">💰 CryptoInvest</div>
    <div class="user-name" id="userName"></div>
  </div>

  <div class="content" id="mainContent"></div>

  <!-- الشريط السفلي -->
  <div class="bottom-nav">
    <button class="nav-item active" data-page="dashboard">🏠<span class="nav-label">البيت</span></button>
    <button class="nav-item" data-page="vip">👑<span class="nav-label">VIP</span></button>
    <button class="nav-item" data-page="deposit">💰<span class="nav-label">إيداع</span></button>
    <button class="nav-item" data-page="withdraw">📤<span class="nav-label">سحب</span></button>
    <button class="nav-item" data-page="referral">👥<span class="nav-label">فريق</span></button>
    <button class="nav-item" data-page="profile">👤<span class="nav-label">أنا</span></button>
    <button class="nav-item" data-page="verify">🔍<span class="nav-label">تحقق</span></button>
  </div>

  <script>
    const API_URL = window.location.origin;
    let userId = localStorage.getItem('userId');
    let userData = null;

    const vipLevels = {
      0: { name: 'VIP 0', price: 0, roi: 2 },
      1: { name: 'VIP 1', price: 50, roi: 2.2 },
      2: { name: 'VIP 2', price: 100, roi: 2.5 },
      3: { name: 'VIP 3', price: 250, roi: 2.8 },
      4: { name: 'VIP 4', price: 500, roi: 3.2 },
      5: { name: 'VIP 5', price: 1000, roi: 3.5 }
    };

    // ========================================
    // تحميل بيانات المستخدم
    // ========================================
    async function loadUser() {
      if (!userId) { window.location.href = '/'; return; }
      try {
        const res = await fetch(`${API_URL}/api/user`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.error) { localStorage.clear(); window.location.href = '/'; return; }
        userData = data;
        document.getElementById('userName').innerHTML = userData.name;
        renderDashboard();
      } catch(e) { console.error(e); }
    }

    // ========================================
    // عرض الرسائل
    // ========================================
    function showMessage(msg, type) {
      const container = document.getElementById('mainContent');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = msg;
      container.insertBefore(msgDiv, container.firstChild);
      setTimeout(() => msgDiv.remove(), 5000);
    }

    // ========================================
    // الصفحة الرئيسية (Dashboard)
    // ========================================
    async function renderDashboard() {
      const level = userData?.vip_level || 0;
      const active = userData?.active_deposit || 0;
      const avail = userData?.available_balance || 0;
      const totalDeposit = userData?.total_deposited || 0;
      const totalWithdraw = userData?.total_withdrawn || 0;
      
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="assets-amount">${(active+avail).toFixed(2)} USDT</div>
          <div class="detail-row"><span>💰 الاستثمار النشط</span><span class="detail-value">${active.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>💎 الرصيد المتاح</span><span class="detail-value">${avail.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>📊 إجمالي الإيداعات</span><span class="detail-value">${totalDeposit.toFixed(2)} USDT</span></div>
          <div class="detail-row"><span>📤 إجمالي السحوبات</span><span class="detail-value">${totalWithdraw.toFixed(2)} USDT</span></div>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${vipLevels[level].roi}%</div><div class="stat-label">نسبة الربح</div></div>
          <div class="stat-card"><div class="stat-value">${vipLevels[level].name}</div><div class="stat-label">المستوى الحالي</div></div>
        </div>
      `;
    }

    // ========================================
    // صفحة الإيداع (مع Transaction Hash)
    // ========================================
    async function renderDeposit() {
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">💰 إيداع USDT</div>
          <p style="color:#8899aa; font-size:12px; margin-bottom:8px;">محفظة الإيداع (شبكة BSC):</p>
          <code style="color:#00ff66; word-break:break-all;">0x9EB39A10c059877910eEbe2841bA2474cB7Fffc8</code>
          <button class="btn-copy" id="copyWalletBtn">📋 نسخ العنوان</button>
          
          <input type="number" id="depositAmount" placeholder="المبلغ (USDT) - الحد الأدنى 10" style="margin-top:16px;">
          <input type="text" id="depositTxHash" placeholder="Transaction Hash (0x...)" style="direction:ltr; font-family: monospace;">
          <button class="deposit-btn" id="doDepositBtn">🔍 تحقق وأيدع</button>
          <div id="depositMsg"></div>
        </div>
      `;
      
      // زر نسخ العنوان
      document.getElementById('copyWalletBtn').onclick = () => {
        navigator.clipboard.writeText('0x9EB39A10c059877910eEbe2841bA2474cB7Fffc8');
        showMessage('✅ تم نسخ عنوان المحفظة!', 'success');
      };
      
      // زر الإيداع مع التحقق
      document.getElementById('doDepositBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('depositAmount').value);
        const txHash = document.getElementById('depositTxHash').value.trim();
        
        if (!amount || amount < 10) {
          showMessage('depositMsg', '⚠️ الحد الأدنى للإيداع 10 USDT', 'error');
          return;
        }
        
        if (!txHash) {
          showMessage('depositMsg', '⚠️ يرجى إدخال Transaction Hash', 'error');
          return;
        }
        
        showMessage('depositMsg', '⏳ جاري التحقق من المعاملة على الشبكة...', 'warning');
        
        try {
          const res = await fetch(`${API_URL}/api/deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount, transactionHash: txHash })
          });
          
          const data = await res.json();
          
          if (data.success) {
            showMessage('depositMsg', `✅ ${data.message}`, 'success');
            document.getElementById('depositAmount').value = '';
            document.getElementById('depositTxHash').value = '';
            loadUser();
          } else {
            showMessage('depositMsg', `❌ ${data.error}`, 'error');
          }
        } catch (error) {
          showMessage('depositMsg', '❌ خطأ في الاتصال بالخادم', 'error');
        }
      };
    }

    // ========================================
    // صفحة السحب
    // ========================================
    async function renderWithdraw() {
      const avail = userData?.available_balance || 0;
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">💸 سحب USDT</div>
          <div class="assets-amount" style="font-size:28px;">${avail.toFixed(2)} USDT</div>
          <input type="number" id="withdrawAmount" placeholder="المبلغ (USDT) - الحد الأدنى 0.5">
          <input type="text" id="walletAddress" placeholder="عنوان محفظة BSC">
          <button class="withdraw-btn" id="doWithdrawBtn">💸 سحب USDT</button>
          <div id="withdrawMsg"></div>
        </div>
      `;
      
      document.getElementById('doWithdrawBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const address = document.getElementById('walletAddress').value;
        
        if (!amount || amount < 0.5) {
          showMessage('withdrawMsg', '⚠️ الحد الأدنى للسحب 0.5 USDT', 'error');
          return;
        }
        if (!address) {
          showMessage('withdrawMsg', '⚠️ أدخل عنوان المحفظة', 'error');
          return;
        }
        if (amount > avail) {
          showMessage('withdrawMsg', '⚠️ الرصيد غير كافٍ', 'error');
          return;
        }
        
        try {
          const res = await fetch(`${API_URL}/api/withdraw`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount, walletAddress: address })
          });
          const data = await res.json();
          
          if (data.success) {
            showMessage('withdrawMsg', `✅ ${data.message}`, 'success');
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('walletAddress').value = '';
            loadUser();
          } else {
            showMessage('withdrawMsg', `❌ ${data.error}`, 'error');
          }
        } catch (error) {
          showMessage('withdrawMsg', '❌ خطأ في الاتصال بالخادم', 'error');
        }
      };
    }

    // ========================================
    // صفحة VIP
    // ========================================
    async function renderVIP() {
      const currentLevel = userData?.vip_level || 0;
      document.getElementById('mainContent').innerHTML = `<div class="card"><div class="card-title">👑 مستويات VIP</div><div id="vipList"></div></div>`;
      const container = document.getElementById('vipList');
      container.innerHTML = Object.entries(vipLevels).map(([level, vip]) => `
        <div class="vip-item">
          <div><div class="vip-name">${vip.name}</div><div class="vip-roi">💰 ${vip.roi}% يومياً</div></div>
          ${currentLevel < parseInt(level) ? `<button class="upgrade-btn" data-level="${level}">ترقية (${vip.price} USDT)</button>` : (currentLevel == level ? '<span style="color:#00ff66;">✅ حالياً</span>' : '<span style="color:#8899aa;">🔒 مغلق</span>')}
        </div>
      `).join('');
      
      document.querySelectorAll('.upgrade-btn').forEach(btn => {
        btn.onclick = async () => {
          const targetLevel = parseInt(btn.dataset.level);
          const vip = vipLevels[targetLevel];
          if (userData.available_balance >= vip.price) {
            await fetch(`${API_URL}/api/update-user`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId, updates: { vip_level: targetLevel, available_balance: userData.available_balance - vip.price } })
            });
            showMessage(`✅ تم الترقية إلى ${vip.name}!`, 'success');
            loadUser();
          } else {
            showMessage(`⚠️ تحتاج ${vip.price} USDT للترقية`, 'warning');
          }
        };
      });
    }

    // ========================================
    // صفحة الإحالات (الفريق)
    // ========================================
    async function renderReferrals() {
      const res = await fetch(`${API_URL}/api/referrals`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      const data = await res.json();
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">🔗 رابط الدعوة</div>
          <code style="color:#00ff66; word-break:break-all;">${window.location.origin}?ref=${userData?.referral_code}</code>
          <button class="btn-copy" id="copyLinkBtn">📋 نسخ الرابط</button>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value">${data.count || 0}</div><div class="stat-label">المحالين</div></div>
          <div class="stat-card"><div class="stat-value">${(data.groupBalance || 0).toFixed(2)} USDT</div><div class="stat-label">حجم الفريق</div></div>
        </div>
        <div class="card"><div class="card-title">📋 قائمة المحالين</div><div id="referralsList"></div></div>
      `;
      
      document.getElementById('copyLinkBtn').onclick = () => {
        navigator.clipboard.writeText(`${window.location.origin}?ref=${userData?.referral_code}`);
        showMessage('✅ تم نسخ رابط الدعوة!', 'success');
      };
      
      const listDiv = document.getElementById('referralsList');
      if (!data.referrals || data.referrals.length === 0) {
        listDiv.innerHTML = '<p style="color:#8899aa;">لا يوجد محالين</p>';
      } else {
        listDiv.innerHTML = data.referrals.map(u => `<div style="background:#0a0a0f; padding:12px; border-radius:12px; margin-bottom:8px;">${u.name}<br><span style="font-size:12px;">💰 ${u.active_deposit || 0} USDT</span></div>`).join('');
      }
    }

    // ========================================
    // صفحة الملف الشخصي (أنا) + سجل المعاملات
    // ========================================
    async function renderProfile() {
      const avail = userData?.available_balance || 0;
      document.getElementById('mainContent').innerHTML = `
        <div class="card" style="text-align:center;">
          <div style="font-size:60px;">👤</div>
          <div style="font-size:20px; font-weight:bold; color:white;">${userData.name}</div>
          <div style="color:#8899aa; font-size:12px;">📧 ${userData.email}</div>
          <div style="color:#00ff66; font-size:28px; margin-top:16px;">${avail.toFixed(2)} USDT</div>
        </div>
        <div class="card"><div class="card-title">📋 سجل العمليات</div><div id="transactionsList" style="color:#8899aa;"></div></div>
      `;
      
      // جلب المعاملات
      const [depositsRes, withdrawsRes] = await Promise.all([
        fetch(`${API_URL}/api/admin/deposits`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }) }),
        fetch(`${API_URL}/api/admin/withdrawals`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }) })
      ]);
      const deposits = await depositsRes.json();
      const withdrawals = await withdrawsRes.json();
      const all = [...(deposits||[]).filter(d=>d.user_id===userId).map(d=>({...d,type:'إيداع'})), ...(withdrawals||[]).filter(w=>w.user_id===userId).map(w=>({...w,type:'سحب'}))];
      all.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      
      const tbody = document.getElementById('transactionsList');
      if(all.length===0) {
        tbody.innerHTML='<p>لا توجد معاملات</p>';
      } else {
        tbody.innerHTML = all.map(t => `
          <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #00ff66;">
            <span>${new Date(t.created_at).toLocaleDateString('ar')}</span>
            <span>${t.type}</span>
            <span>${t.amount} USDT</span>
            <span style="color:${t.status==='approved'?'#00ff66':'#ffaa00'}">${t.status==='approved'?'مقبول':'قيد الانتظار'}</span>
          </div>
        `).join('');
      }
    }

    // ========================================
    // صفحة التحقق اليدوي
    // ========================================
    async function renderVerify() {
      document.getElementById('mainContent').innerHTML = `
        <div class="card">
          <div class="card-title">🔍 التحقق اليدوي من الإيداع</div>
          <input type="text" id="verifyTxHash" placeholder="Transaction Hash (0x...)" style="direction:ltr; font-family: monospace;">
          <input type="number" id="verifyAmount" placeholder="المبلغ (USDT)">
          <button class="deposit-btn" id="doVerifyBtn">🔍 تحقق</button>
          <div id="verifyMsg"></div>
        </div>
      `;
      
      document.getElementById('doVerifyBtn').onclick = async () => {
        const txHash = document.getElementById('verifyTxHash').value.trim();
        const amount = parseFloat(document.getElementById('verifyAmount').value);
        
        if (!txHash || !amount) {
          showMessage('verifyMsg', '⚠️ أدخل Transaction Hash والمبلغ', 'error');
          return;
        }
        
        showMessage('verifyMsg', '⏳ جاري التحقق...', 'warning');
        
        try {
          const res = await fetch(`${API_URL}/api/verify-deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, transactionHash: txHash, amount })
          });
          const data = await res.json();
          
          if (data.success) {
            showMessage('verifyMsg', `✅ ${data.message}`, 'success');
          } else {
            showMessage('verifyMsg', `❌ ${data.error}`, 'error');
          }
        } catch(e) {
          showMessage('verifyMsg', '❌ خطأ في الاتصال', 'error');
        }
      };
    }

    // ========================================
    // التنقل بين الصفحات
    // ========================================
    const pages = {
      dashboard: renderDashboard,
      deposit: renderDeposit,
      withdraw: renderWithdraw,
      vip: renderVIP,
      referral: renderReferrals,
      profile: renderProfile,
      verify: renderVerify
    };

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const page = btn.dataset.page;
        if (pages[page]) pages[page]();
      };
    });

    // ========================================
    // تشغيل التطبيق
    // ========================================
    loadUser();
  </script>
</body>
</html>
