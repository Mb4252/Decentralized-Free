<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>تسجيل الدخول | منصة الاستثمار</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      max-width: 450px;
      width: 100%;
    }
    .card {
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 32px 28px;
      border: 1px solid #00ff66;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 28px; background: linear-gradient(135deg, #00ff66, #00ccff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo p { color: #8899aa; font-size: 13px; margin-top: 6px; }
    
    .lang-switch {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 20px;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }
    .lang-btn.active {
      background: #00ff66;
      color: #0a0a0f;
    }
    
    .tabs { display: flex; gap: 12px; margin-bottom: 24px; background: rgba(10,10,20,0.8); padding: 5px; border-radius: 60px; }
    .tab { flex: 1; padding: 12px; text-align: center; background: transparent; border: none; border-radius: 50px; color: #8899aa; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.3s; }
    .tab.active { background: linear-gradient(135deg, #00ff66, #00ccff); color: #0a0a0f; box-shadow: 0 4px 15px rgba(0,255,102,0.3); }
    
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; color: #8899aa; margin-bottom: 6px; font-size: 13px; }
    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #00ff66;
      background: rgba(10,10,20,0.8);
      color: white;
      font-size: 14px;
    }
    .input-wrapper input:focus { outline: none; border-color: #00ff66; box-shadow: 0 0 0 3px rgba(0,255,102,0.2); }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-group label { color: #8899aa; font-size: 13px; cursor: pointer; }
    
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00ff66, #00ccff);
      color: #0a0a0f;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,255,102,0.4); }
    
    .message { margin-top: 16px; padding: 12px; border-radius: 16px; text-align: center; font-size: 13px; }
    .error { background: rgba(255,68,68,0.15); border: 1px solid #ff4444; color: #ff4444; }
    .success { background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; }
    
    .hidden { display: none; }
    .generated-code {
      background: rgba(0,255,102,0.1);
      border: 1px solid #00ff66;
      border-radius: 16px;
      padding: 12px;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ar">🇸🇦 العربية</button>
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
      </div>
      
      <div class="logo">
        <h1 id="siteTitle">💰 CryptoInvest</h1>
        <p id="siteSub">استثمر بأمان | أرباح يومية</p>
      </div>
      
      <div class="tabs">
        <button class="tab active" id="loginTab">تسجيل الدخول</button>
        <button class="tab" id="registerTab">إنشاء حساب</button>
      </div>
      
      <!-- Login Form -->
      <div id="loginForm">
        <div class="input-group">
          <label id="emailLabel">📧 البريد الإلكتروني</label>
          <div class="input-wrapper">
            <input type="email" id="loginEmail" placeholder="example@email.com">
          </div>
        </div>
        <div class="input-group">
          <label id="passwordLabel">🔒 كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" placeholder="********">
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="rememberMe">
          <label id="rememberLabel">تذكرني (البقاء مسجل الدخول)</label>
        </div>
        <button class="btn-primary" id="doLoginBtn">تسجيل الدخول</button>
      </div>
      
      <!-- Register Form -->
      <div id="registerForm" class="hidden">
        <div class="input-group">
          <label id="regNameLabel">👤 اسم المستخدم</label>
          <div class="input-wrapper">
            <input type="text" id="regName" placeholder="أدخل اسمك">
          </div>
        </div>
        <div class="input-group">
          <label id="regEmailLabel">📧 البريد الإلكتروني</label>
          <div class="input-wrapper">
            <input type="email" id="regEmail" placeholder="example@email.com">
          </div>
        </div>
        <div class="input-group">
          <label id="regPasswordLabel">🔒 كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword" placeholder="********">
          </div>
        </div>
        <div class="input-group">
          <label id="regConfirmLabel">✔️ تأكيد كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="regConfirmPassword" placeholder="********">
          </div>
        </div>
        <div class="input-group">
          <label id="regReferralLabel">🎁 رمز الدعوة (اختياري)</label>
          <div class="input-wrapper">
            <input type="text" id="regReferral" placeholder="XXXXXX">
          </div>
        </div>
        <button class="btn-primary" id="doRegisterBtn">إنشاء حساب</button>
        <div id="generatedReferral" class="generated-code hidden"></div>
      </div>
      
      <div id="message"></div>
    </div>
  </div>
  
  <script>
    const API_URL = window.location.origin;
    let currentLang = localStorage.getItem('loginLang') || 'ar';
    
    const translations = {
      ar: {
        siteTitle: '💰 CryptoInvest',
        siteSub: 'استثمر بأمان | أرباح يومية',
        loginTab: 'تسجيل الدخول',
        registerTab: 'إنشاء حساب',
        emailLabel: '📧 البريد الإلكتروني',
        passwordLabel: '🔒 كلمة المرور',
        rememberLabel: 'تذكرني (البقاء مسجل الدخول)',
        loginBtn: 'تسجيل الدخول',
        regNameLabel: '👤 اسم المستخدم',
        regEmailLabel: '📧 البريد الإلكتروني',
        regPasswordLabel: '🔒 كلمة المرور',
        regConfirmLabel: '✔️ تأكيد كلمة المرور',
        regReferralLabel: '🎁 رمز الدعوة (اختياري)',
        registerBtn: 'إنشاء حساب',
        errorFillFields: '⚠️ يرجى ملء جميع الحقول',
        errorPasswordMatch: '⚠️ كلمة المرور غير متطابقة',
        errorPasswordLength: '⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل',
        errorLogin: '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة',
        errorConnection: '❌ خطأ في الاتصال بالخادم',
        successLogin: '✅ تم تسجيل الدخول بنجاح!',
        successRegister: '✅ تم إنشاء الحساب بنجاح!',
        redirecting: 'جاري التحويل...',
        yourReferralCode: '✨ رمز الدعوة الخاص بك:',
        emailExists: '❌ هذا البريد مسجل بالفعل'
      },
      en: {
        siteTitle: '💰 CryptoInvest',
        siteSub: 'Invest Safely | Daily Returns',
        loginTab: 'Login',
        registerTab: 'Sign Up',
        emailLabel: '📧 Email',
        passwordLabel: '🔒 Password',
        rememberLabel: 'Remember Me (Stay logged in)',
        loginBtn: 'Login',
        regNameLabel: '👤 Username',
        regEmailLabel: '📧 Email',
        regPasswordLabel: '🔒 Password',
        regConfirmLabel: '✔️ Confirm Password',
        regReferralLabel: '🎁 Referral Code (Optional)',
        registerBtn: 'Sign Up',
        errorFillFields: '⚠️ Please fill in all fields',
        errorPasswordMatch: '⚠️ Passwords do not match',
        errorPasswordLength: '⚠️ Password must be at least 4 characters',
        errorLogin: '❌ Invalid email or password',
        errorConnection: '❌ Server connection error',
        successLogin: '✅ Login successful!',
        successRegister: '✅ Account created successfully!',
        redirecting: 'Redirecting...',
        yourReferralCode: '✨ Your referral code:',
        emailExists: '❌ This email is already registered'
      }
    };
    
    function updateUILanguage() {
      const t = translations[currentLang];
      document.getElementById('siteTitle').innerHTML = t.siteTitle;
      document.getElementById('siteSub').innerHTML = t.siteSub;
      document.getElementById('loginTab').innerHTML = t.loginTab;
      document.getElementById('registerTab').innerHTML = t.registerTab;
      document.getElementById('emailLabel').innerHTML = t.emailLabel;
      document.getElementById('passwordLabel').innerHTML = t.passwordLabel;
      document.getElementById('rememberLabel').innerHTML = t.rememberLabel;
      document.getElementById('doLoginBtn').innerHTML = t.loginBtn;
      document.getElementById('regNameLabel').innerHTML = t.regNameLabel;
      document.getElementById('regEmailLabel').innerHTML = t.regEmailLabel;
      document.getElementById('regPasswordLabel').innerHTML = t.regPasswordLabel;
      document.getElementById('regConfirmLabel').innerHTML = t.regConfirmLabel;
      document.getElementById('regReferralLabel').innerHTML = t.regReferralLabel;
      document.getElementById('doRegisterBtn').innerHTML = t.registerBtn;
      
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
    }
    
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem('loginLang', currentLang);
        updateUILanguage();
      };
    });
    
    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="message ${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 5000);
    }
    
    document.getElementById('loginTab').onclick = () => {
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    };
    document.getElementById('registerTab').onclick = () => {
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    };
    
    document.getElementById('doLoginBtn').onclick = async () => {
      const t = translations[currentLang];
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!email || !password) {
        showMessage(t.errorFillFields, 'error');
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('userId', data.user.id);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('dashboardLang', currentLang);
          if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
          } else {
            localStorage.removeItem('rememberMe');
          }
          showMessage(`${t.successLogin} ${t.redirecting}`, 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
        } else {
          showMessage(t.errorLogin, 'error');
        }
      } catch (error) {
        showMessage(t.errorConnection, 'error');
      }
    };
    
    document.getElementById('doRegisterBtn').onclick = async () => {
      const t = translations[currentLang];
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;
      const referralCode = document.getElementById('regReferral').value;
      
      if (!name || !email || !password || !confirm) {
        showMessage(t.errorFillFields, 'error');
        return;
      }
      if (password !== confirm) {
        showMessage(t.errorPasswordMatch, 'error');
        return;
      }
      if (password.length < 4) {
        showMessage(t.errorPasswordLength, 'error');
        return;
      }
      
      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, referralCode })
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('userId', data.user.id);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('dashboardLang', currentLang);
          
          const generatedDiv = document.getElementById('generatedReferral');
          generatedDiv.innerHTML = `${t.yourReferralCode} <strong>${data.referral_code}</strong>`;
          generatedDiv.classList.remove('hidden');
          
          showMessage(`${t.successRegister} ${t.redirecting}`, 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 2000);
        } else {
          if (data.error && data.error.includes('مسجل')) {
            showMessage(t.emailExists, 'error');
          } else {
            showMessage(`❌ ${data.error}`, 'error');
          }
        }
      } catch (error) {
        showMessage(t.errorConnection, 'error');
      }
    };
    
    const savedUserId = localStorage.getItem('userId');
    const rememberMe = localStorage.getItem('rememberMe');
    if (savedUserId && rememberMe === 'true') {
      window.location.href = '/dashboard.html';
    }
    
    updateUILanguage();
  </script>
</body>
</html>
