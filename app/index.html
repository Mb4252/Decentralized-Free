<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card { background: #0f3460; border-radius: 24px; padding: 40px; max-width: 400px; width: 100%; }
    h1 { font-size: 32px; color: #e94560; text-align: center; margin-bottom: 32px; }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: none;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .error { color: #ef4444; text-align: center; margin-top: 16px; font-size: 14px; }
    .success { color: #22c55e; text-align: center; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💰 منصة الاستثمار</h1>
    
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
    <button id="registerBtn" style="margin-top: 12px; background: #1a1a2e; border: 1px solid #e94560;">إنشاء حساب</button>
    
    <div id="message"></div>
  </div>

  <script>
    // بيانات المستخدمين المخزنة محلياً
    let users = JSON.parse(localStorage.getItem('users') || '[]');

    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 3000);
    }

    // تسجيل الدخول
    document.getElementById('loginBtn').onclick = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور', 'error');
        return;
      }

      const user = users.find(u => u.email === email && u.password === password);
      
      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
      } else {
        showMessage('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
      }
    };

    // إنشاء حساب
    document.getElementById('registerBtn').onclick = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور', 'error');
        return;
      }

      if (password.length < 4) {
        showMessage('⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
        return;
      }

      if (users.find(u => u.email === email)) {
        showMessage('❌ هذا البريد مسجل بالفعل', 'error');
        return;
      }

      const newUser = {
        id: Date.now(),
        email: email,
        password: password,
        name: email.split('@')[0],
        referral_code: Math.random().toString(36).substring(2, 8).toUpperCase(),
        available_balance: 0,
        active_deposit: 0
      };

      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('currentUser', JSON.stringify(newUser));
      
      showMessage(`✅ تم إنشاء الحساب بنجاح! رمز الدعوة: ${newUser.referral_code}`, 'success');
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
    };
  </script>
</body>
</html>
