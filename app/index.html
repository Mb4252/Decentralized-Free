<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الشراء الجماعي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 400px; width: 100%; }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      border: 1px solid #00aa55;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 28px; color: #00aa55; }
    .logo p { color: #666; font-size: 14px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; color: #666; font-size: 13px; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
      transition: all 0.3s;
    }
    .input-group input:focus { outline: none; border-color: #00aa55; box-shadow: 0 0 0 3px rgba(0,170,85,0.1); }
    .btn {
      width: 100%;
      padding: 14px;
      background: #00aa55;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { background: #008844; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: white;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .btn-google:hover { background: #f5f5f5; border-color: #aaa; }
    .btn-google img { width: 20px; height: 20px; }
    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
    }
    .divider hr { flex: 1; border: 1px solid #ddd; }
    .divider span { padding: 0 12px; color: #888; font-size: 13px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #f5f5f5;
      padding: 4px;
      border-radius: 30px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      transition: all 0.3s;
    }
    .tab.active { background: #00aa55; color: white; }
    .hidden { display: none !important; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .error { background: #fee; border: 1px solid #ff4444; color: #ff4444; }
    .success { background: #efe; border: 1px solid #00aa55; color: #00aa55; }
    .warning { background: #fff3cd; border: 1px solid #ffaa00; color: #ffaa00; }
    .theme-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(0,170,85,0.1);
      border: 1px solid #00aa55;
      color: #00aa55;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      z-index: 100;
    }
    .theme-toggle:hover { background: rgba(0,170,85,0.2); }
    body.dark-mode {
      background: #0a0a0f;
    }
    body.dark-mode .card {
      background: #1a1a2e;
      border-color: #00ff66;
    }
    body.dark-mode .logo h1 { color: #00ff66; }
    body.dark-mode .input-group input {
      background: #0a0a0f;
      border-color: #00ff66;
      color: white;
    }
    body.dark-mode .input-group input:focus { border-color: #00ccff; }
    body.dark-mode .tabs { background: #1a1a2e; }
    body.dark-mode .tab { color: #8899aa; }
    body.dark-mode .tab.active { background: #00ff66; color: #0a0a0f; }
    body.dark-mode .theme-toggle {
      border-color: #00ff66;
      color: #00ff66;
    }
    body.dark-mode .btn-google {
      background: #1a1a2e;
      border-color: #00ff66;
      color: white;
    }
    body.dark-mode .btn-google:hover { background: #2a2a3e; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle">☀️ وضع نهاري</button>

  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>🛍️ CryptoShop</h1>
        <p>شراء جماعي | أسعار الجملة</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab">تسجيل الدخول</button>
        <button class="tab" id="registerTab">إنشاء حساب</button>
      </div>

      <!-- تسجيل الدخول -->
      <div id="loginForm">
        <div class="input-group">
          <label>📧 البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label>🔒 كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button class="btn" id="doLoginBtn">تسجيل الدخول</button>

        <div class="divider">
          <hr>
          <span>أو</span>
          <hr>
        </div>

        <button class="btn-google" id="googleSignInBtn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          تسجيل الدخول عبر Google
        </button>

        <div style="text-align:center; margin-top:12px;">
          <a href="#" id="forgotPasswordLink" style="color:#00aa55;font-size:13px;text-decoration:none;">
            نسيت كلمة المرور؟
          </a>
        </div>
      </div>

      <!-- إنشاء حساب -->
      <div id="registerForm" class="hidden">
        <div class="input-group">
          <label>👤 اسم المستخدم</label>
          <input type="text" id="regName" placeholder="أدخل اسمك">
        </div>
        <div class="input-group">
          <label>📧 البريد الإلكتروني</label>
          <input type="email" id="regEmail" placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label>🔒 كلمة المرور</label>
          <input type="password" id="regPassword" placeholder="********">
        </div>
        <div class="input-group">
          <label>✔️ تأكيد كلمة المرور</label>
          <input type="password" id="regConfirmPassword" placeholder="********">
        </div>
        <div class="input-group">
          <label>🎁 رمز الدعوة (اختياري)</label>
          <input type="text" id="regReferral" placeholder="XXXXXX">
        </div>
        <button class="btn" id="doRegisterBtn">إنشاء حساب</button>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- JavaScript (كل الكود في مكان واحد) -->
  <!-- ========================================== -->
  <script>
    // ==========================================
    // الإعدادات
    // ==========================================
    const API_URL = window.location.origin;
    let currentTheme = localStorage.getItem('theme') || 'light';

    // ==========================================
    // دوال مساعدة
    // ==========================================
    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="message ${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 8000);
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.textContent = loading ? '⏳ جاري...' : btn.textContent;
    }

    function getDeviceFingerprint() {
      try {
        const data = {
          ua: navigator.userAgent,
          pf: navigator.platform,
          lang: navigator.language,
          screen: screen.width + 'x' + screen.height,
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
          ts: Date.now()
        };
        return btoa(JSON.stringify(data));
      } catch (e) {
        return 'fallback-' + Date.now();
      }
    }

    // ==========================================
    // الوضع النهاري/الليلي
    // ==========================================
    function setTheme(theme) {
      document.body.classList.toggle('dark-mode', theme === 'dark');
      document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '🌙 وضع ليلي' : '☀️ وضع نهاري';
      localStorage.setItem('theme', theme);
      currentTheme = theme;
    }
    document.getElementById('themeToggle').onclick = function() {
      setTheme(currentTheme === 'light' ? 'dark' : 'light');
    };
    setTheme(currentTheme);

    // ==========================================
    // التبويبات
    // ==========================================
    document.getElementById('loginTab').onclick = function() {
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('message').innerHTML = '';
    };

    document.getElementById('registerTab').onclick = function() {
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('message').innerHTML = '';
    };

    // ==========================================
    // تسجيل الدخول
    // ==========================================
    document.getElementById('doLoginBtn').onclick = async function() {
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;
      var btn = this;

      if (!email || !password) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        var fingerprint = getDeviceFingerprint();
        var response = await fetch(API_URL + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, deviceFingerprint: fingerprint }),
          credentials: 'include'
        });

        var data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
          setTimeout(function() { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          showMessage('❌ ' + (data.error || 'فشل تسجيل الدخول'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }

      setLoading(btn, false);
    };

    // ==========================================
    // إنشاء حساب
    // ==========================================
    document.getElementById('doRegisterBtn').onclick = async function() {
      var name = document.getElementById('regName').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value;
      var confirm = document.getElementById('regConfirmPassword').value;
      var referral = document.getElementById('regReferral').value.trim();
      var btn = this;

      if (!name || !email || !password || !confirm) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }
      if (password !== confirm) {
        showMessage('⚠️ كلمة المرور غير متطابقة', 'error');
        return;
      }
      if (password.length < 4) {
        showMessage('⚠️ كلمة المرور 4 أحرف على الأقل', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        var fingerprint = getDeviceFingerprint();
        var response = await fetch(API_URL + '/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: email,
            password: password,
            referralCode: referral,
            deviceFingerprint: fingerprint
          }),
          credentials: 'include'
        });

        var data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم إنشاء الحساب بنجاح!', 'success');
          setTimeout(function() { window.location.href = '/dashboard.html'; }, 1500);
        } else {
          showMessage('❌ ' + (data.error || 'فشل إنشاء الحساب'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }

      setLoading(btn, false);
    };

    // ==========================================
    // تسجيل الدخول عبر Google
    // ==========================================
    document.getElementById('googleSignInBtn').onclick = function() {
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '⏳ جاري...';

      var popup = window.open(
        API_URL + '/auth/google',
        'Google Sign-In',
        'width=500,height=600,left=' + (window.screen.width / 2 - 250) + ',top=' + (window.screen.height / 2 - 300)
      );

      var checkPopup = setInterval(function() {
        if (popup && popup.closed) {
          clearInterval(checkPopup);
          btn.disabled = false;
          btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px;"> تسجيل الدخول عبر Google';
          var user = JSON.parse(localStorage.getItem('user') || '{}');
          if (user && user.id) {
            window.location.href = '/dashboard.html';
          }
        }
      }, 1000);
    };

    // ==========================================
    // نسيت كلمة المرور
    // ==========================================
    document.getElementById('forgotPasswordLink').onclick = function(e) {
      e.preventDefault();
      var email = prompt('📧 أدخل بريدك الإلكتروني:');
      if (!email) return;
      showMessage('⚠️ سيتم إرسال رابط إعادة التعيين إلى بريدك قريباً', 'warning');
    };

    // ==========================================
    // Enter key support
    // ==========================================
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
    });

    document.getElementById('regConfirmPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('doRegisterBtn').click();
    });

    // ==========================================
    // التحقق من الجلسة
    // ==========================================
    (function() {
      try {
        var user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user && user.id) {
          window.location.href = '/dashboard.html';
        }
      } catch (e) {
        console.log('Session check:', e);
      }
    })();

    console.log('✅ CryptoShop - النظام المبسط جاهز');
    console.log('📡 API URL:', API_URL);
  </script>
</body>
</html>
