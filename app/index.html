<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الشراء الجماعي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 400px; width: 100%; }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      border: 1px solid #00aa55;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 28px; color: #00aa55; }
    .logo p { color: #666; font-size: 14px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; color: #666; font-size: 13px; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
      transition: all 0.3s;
    }
    .input-group input:focus { outline: none; border-color: #00aa55; box-shadow: 0 0 0 3px rgba(0,170,85,0.1); }
    .btn {
      width: 100%;
      padding: 14px;
      background: #00aa55;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { background: #008844; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google {
      width: 100%;
      padding: 12px;
      background: white;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .btn-google:hover { background: #f5f5f5; border-color: #aaa; }
    .btn-google img { width: 20px; height: 20px; }
    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
    }
    .divider hr { flex: 1; border: 1px solid #ddd; }
    .divider span { padding: 0 12px; color: #888; font-size: 13px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #f5f5f5;
      padding: 4px;
      border-radius: 30px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      transition: all 0.3s;
    }
    .tab.active { background: #00aa55; color: white; }
    .hidden { display: none !important; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .error { background: #fee; border: 1px solid #ff4444; color: #ff4444; }
    .success { background: #efe; border: 1px solid #00aa55; color: #00aa55; }
    .warning { background: #fff3cd; border: 1px solid #ffaa00; color: #ffaa00; }
    .loading { background: #e8f4fd; border: 1px solid #00ccff; color: #00ccff; }
    .theme-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(0,170,85,0.1);
      border: 1px solid #00aa55;
      color: #00aa55;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      z-index: 100;
    }
    .theme-toggle:hover { background: rgba(0,170,85,0.2); }
    body.dark-mode {
      background: #0a0a0f;
    }
    body.dark-mode .card {
      background: #1a1a2e;
      border-color: #00ff66;
    }
    body.dark-mode .logo h1 { color: #00ff66; }
    body.dark-mode .input-group input {
      background: #0a0a0f;
      border-color: #00ff66;
      color: white;
    }
    body.dark-mode .input-group input:focus { border-color: #00ccff; }
    body.dark-mode .tabs { background: #1a1a2e; }
    body.dark-mode .tab { color: #8899aa; }
    body.dark-mode .tab.active { background: #00ff66; color: #0a0a0f; }
    body.dark-mode .theme-toggle {
      border-color: #00ff66;
      color: #00ff66;
    }
    body.dark-mode .btn-google {
      background: #1a1a2e;
      border-color: #00ff66;
      color: white;
    }
    body.dark-mode .btn-google:hover { background: #2a2a3e; }
    .verification-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      border: 1px solid #00aa55;
    }
    body.dark-mode .verification-section {
      background: #1a1a2e;
      border-color: #00ff66;
    }
    .code-input {
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      direction: ltr;
    }
    .btn-secondary { background: #7c3aed; }
    .btn-secondary:hover { background: #6d28d9; }
    .btn-danger { background: #ff4444; }
    .btn-danger:hover { background: #cc0000; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle">☀️ وضع نهاري</button>

  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>🛍️ CryptoShop</h1>
        <p>شراء جماعي | أسعار الجملة</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab">تسجيل الدخول</button>
        <button class="tab" id="registerTab">إنشاء حساب</button>
      </div>

      <!-- تسجيل الدخول -->
      <div id="loginForm">
        <div class="input-group">
          <label>📧 البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label>🔒 كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button class="btn" id="doLoginBtn">تسجيل الدخول</button>

        <div class="divider">
          <hr>
          <span>أو</span>
          <hr>
        </div>

        <button class="btn-google" id="googleSignInBtn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          تسجيل الدخول عبر Google
        </button>

        <div style="text-align:center; margin-top:12px;">
          <a href="#" id="forgotPasswordLink" style="color:#00aa55;font-size:13px;text-decoration:none;">
            نسيت كلمة المرور؟
          </a>
        </div>
      </div>

      <!-- إنشاء حساب -->
      <div id="registerForm" class="hidden">
        <!-- الخطوة 1 -->
        <div id="registerStep1">
          <div class="input-group">
            <label>👤 اسم المستخدم</label>
            <input type="text" id="regName" placeholder="أدخل اسمك">
          </div>
          <div class="input-group">
            <label>📧 البريد الإلكتروني</label>
            <input type="email" id="regEmail" placeholder="example@email.com">
          </div>
          <div class="input-group">
            <label>🔒 كلمة المرور</label>
            <input type="password" id="regPassword" placeholder="********">
          </div>
          <div class="input-group">
            <label>✔️ تأكيد كلمة المرور</label>
            <input type="password" id="regConfirmPassword" placeholder="********">
          </div>
          <div class="input-group">
            <label>🎁 رمز الدعوة (اختياري)</label>
            <input type="text" id="regReferral" placeholder="XXXXXX">
          </div>
          <button class="btn" id="requestVerificationBtn">📧 إرسال رمز التحقق</button>
        </div>

        <!-- الخطوة 2 -->
        <div id="registerStep2" class="hidden">
          <div class="verification-section">
            <p style="color:#00aa55;font-weight:bold;text-align:center;margin-bottom:12px;">
              ✅ تم إرسال رمز التحقق
            </p>
            <p style="color:#666;font-size:13px;text-align:center;">
              أدخل الرمز المكون من 6 أرقام
            </p>
            <div class="input-group">
              <label>🔑 رمز التحقق</label>
              <input type="text" id="verificationCode" class="code-input" placeholder="_ _ _ _ _ _" maxlength="6" inputmode="numeric">
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="btn btn-secondary" id="resendCodeBtn" style="font-size:13px;padding:10px;">🔄 إعادة إرسال</button>
              <button class="btn btn-danger" id="backToStep1Btn" style="font-size:13px;padding:10px;">🔙 تغيير البريد</button>
            </div>
            <p id="timerDisplay" style="color:#888;font-size:12px;text-align:center;margin-top:8px;">
              ⏳ صلاحية الرمز: 10:00
            </p>
          </div>
          <button class="btn" id="completeRegisterBtn">✅ إنشاء الحساب</button>
        </div>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- Firebase SDK (لتسجيل الدخول عبر Google) -->
  <!-- ========================================== -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>

  <script type="module">
    // ==========================================
    // استيراد Firebase
    // ==========================================
    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "firebase/auth";

    // ==========================================
    // إعدادات Firebase
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAI_mUhuPNoO-XC0Q-VNoWft8UWFbAbIGg",
      authDomain: "sudan-market-6b122.firebaseapp.com",
      databaseURL: "https://sudan-market-6b122-default-rtdb.firebaseio.com",
      projectId: "sudan-market-6b122",
      storageBucket: "sudan-market-6b122.firebasestorage.app",
      messagingSenderId: "66729481566",
      appId: "1:66729481566:web:93393f28dc22d32cceebcf",
      measurementId: "G-L4SDJWKPK5"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('email');
    provider.addScope('profile');

    const API_URL = window.location.origin;

    // ==========================================
    // دوال مساعدة
    // ==========================================

    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="message ${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 8000);
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.textContent = loading ? '⏳ جاري...' : btn.textContent;
    }

    function getDeviceFingerprint() {
      try {
        const data = {
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          language: navigator.language,
          screen: `${screen.width}x${screen.height}`,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          timestamp: Date.now()
        };
        return btoa(JSON.stringify(data));
      } catch (e) {
        return 'fallback-' + Date.now();
      }
    }

    // ==========================================
    // الوضع النهاري/الليلي
    // ==========================================

    let currentTheme = localStorage.getItem('theme') || 'light';

    function setTheme(theme) {
      document.body.classList.toggle('dark-mode', theme === 'dark');
      document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '🌙 وضع ليلي' : '☀️ وضع نهاري';
      localStorage.setItem('theme', theme);
      currentTheme = theme;
    }

    document.getElementById('themeToggle').onclick = () => {
      setTheme(currentTheme === 'light' ? 'dark' : 'light');
    };
    setTheme(currentTheme);

    // ==========================================
    // التبويبات
    // ==========================================

    document.getElementById('loginTab').onclick = () => {
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('message').innerHTML = '';
      resetRegisterForm();
    };

    document.getElementById('registerTab').onclick = () => {
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('message').innerHTML = '';
      resetRegisterForm();
    };

    function resetRegisterForm() {
      document.getElementById('registerStep1').classList.remove('hidden');
      document.getElementById('registerStep2').classList.add('hidden');
      document.getElementById('verificationCode').value = '';
      if (window.timerInterval) {
        clearInterval(window.timerInterval);
        window.timerInterval = null;
      }
    }

    // ==========================================
    // تسجيل الدخول (بريد/كلمة مرور)
    // ==========================================

    document.getElementById('doLoginBtn').onclick = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = this;

      if (!email || !password) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        const fingerprint = getDeviceFingerprint();
        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, deviceFingerprint: fingerprint }),
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          showMessage('❌ ' + (data.error || 'فشل تسجيل الدخول'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        console.error('Login error:', error);
      }

      setLoading(btn, false);
    };

    // ==========================================
    // طلب رمز التحقق
    // ==========================================

    document.getElementById('requestVerificationBtn').onclick = async function() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;
      const btn = this;

      if (!name || !email || !password || !confirm) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }
      if (password !== confirm) {
        showMessage('⚠️ كلمة المرور غير متطابقة', 'error');
        return;
      }
      if (password.length < 4) {
        showMessage('⚠️ كلمة المرور 4 أحرف على الأقل', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        const response = await fetch(`${API_URL}/api/request-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('✅ ' + data.message, 'success');
          document.getElementById('registerStep1').classList.add('hidden');
          document.getElementById('registerStep2').classList.remove('hidden');
          document.getElementById('registerStep2').dataset.email = email;
          document.getElementById('registerStep2').dataset.name = name;
          document.getElementById('registerStep2').dataset.password = password;
          document.getElementById('registerStep2').dataset.referral = document.getElementById('regReferral').value.trim();
          startTimer();
        } else {
          showMessage('❌ ' + (data.error || 'فشل إرسال الرمز'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        console.error('Request verification error:', error);
      }

      setLoading(btn, false);
    };

    // ==========================================
    // إكمال التسجيل
    // ==========================================

    document.getElementById('completeRegisterBtn').onclick = async function() {
      const code = document.getElementById('verificationCode').value.trim();
      const btn = this;
      const step2 = document.getElementById('registerStep2');

      if (!code || code.length !== 6) {
        showMessage('⚠️ يرجى إدخال رمز مكون من 6 أرقام', 'error');
        return;
      }

      const email = step2.dataset.email;
      const name = step2.dataset.name;
      const password = step2.dataset.password;
      const referral = step2.dataset.referral;

      setLoading(btn, true);

      try {
        const fingerprint = getDeviceFingerprint();
        const response = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            password,
            referralCode: referral,
            verificationCode: code,
            deviceFingerprint: fingerprint
          }),
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم إنشاء الحساب بنجاح!', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
        } else {
          showMessage('❌ ' + (data.error || 'فشل إنشاء الحساب'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        console.error('Register error:', error);
      }

      setLoading(btn, false);
    };

    // ==========================================
    // إعادة إرسال الرمز
    // ==========================================

    document.getElementById('resendCodeBtn').onclick = async function() {
      const btn = this;
      const email = document.getElementById('registerStep2').dataset.email;

      if (!email) {
        showMessage('⚠️ البريد الإلكتروني غير موجود', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        const response = await fetch(`${API_URL}/api/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          showMessage('✅ ' + data.message, 'success');
          if (window.timerInterval) {
            clearInterval(window.timerInterval);
          }
          startTimer();
        } else {
          showMessage('❌ ' + (data.error || 'فشل إعادة الإرسال'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        console.error('Resend error:', error);
      }

      setLoading(btn, false);
    };

    // ==========================================
    // العودة للخطوة 1
    // ==========================================

    document.getElementById('backToStep1Btn').onclick = function() {
      resetRegisterForm();
      document.getElementById('registerStep1').classList.remove('hidden');
      document.getElementById('registerStep2').classList.add('hidden');
    };

    // ==========================================
    // المؤقت
    // ==========================================

    function startTimer() {
      let seconds = 600;
      const timerDisplay = document.getElementById('timerDisplay');

      if (window.timerInterval) {
        clearInterval(window.timerInterval);
      }

      window.timerInterval = setInterval(() => {
        seconds--;
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = `⏳ صلاحية الرمز: ${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (seconds <= 0) {
          clearInterval(window.timerInterval);
          window.timerInterval = null;
          timerDisplay.textContent = '⏳ انتهت صلاحية الرمز. يرجى طلب رمز جديد';
          timerDisplay.style.color = '#ff4444';
        }
      }, 1000);
    }

    // ==========================================
    // ⭐⭐⭐ تسجيل الدخول عبر Google (مفعّل) ⭐⭐⭐
    // ==========================================

    document.getElementById('googleSignInBtn').onclick = async function() {
      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '⏳ جاري...';

      try {
        // تسجيل الدخول عبر Firebase Google
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        console.log('✅ Google Auth Success:', user);

        // إرسال بيانات المستخدم إلى الخادم
        const fingerprint = getDeviceFingerprint();
        const response = await fetch(`${API_URL}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: user.uid,
            email: user.email,
            name: user.displayName || user.email.split('@')[0],
            photoURL: user.photoURL || null,
            deviceFingerprint: fingerprint
          }),
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage(`✅ ${data.isNewUser ? 'تم إنشاء الحساب' : 'تم تسجيل الدخول'} بنجاح عبر Google!`, 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          showMessage('❌ ' + (data.error || 'فشل تسجيل الدخول عبر Google'), 'error');
        }
      } catch (error) {
        console.error('❌ Google Sign-In Error:', error);
        if (error.code === 'auth/popup-closed-by-user') {
          showMessage('⚠️ تم إلغاء تسجيل الدخول', 'warning');
        } else if (error.code === 'auth/network-request-failed') {
          showMessage('❌ خطأ في الاتصال بالإنترنت', 'error');
        } else {
          showMessage('❌ خطأ في تسجيل الدخول عبر Google: ' + error.message, 'error');
        }
      }

      btn.disabled = false;
      btn.innerHTML = `
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px;">
        تسجيل الدخول عبر Google
      `;
    };

    // ==========================================
    // مراقبة حالة المستخدم (Firebase)
    // ==========================================

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log('👤 Firebase User:', user.email);
      } else {
        console.log('🚪 Firebase User: Not signed in');
      }
    });

    // ==========================================
    // نسيت كلمة المرور
    // ==========================================

    document.getElementById('forgotPasswordLink').onclick = function(e) {
      e.preventDefault();
      const email = prompt('📧 أدخل بريدك الإلكتروني لإعادة تعيين كلمة المرور:');
      if (!email) return;

      showMessage('⚠️ ميزة إعادة تعيين كلمة المرور قيد التطوير. يرجى الاتصال بالدعم.', 'warning');
    };

    // ==========================================
    // Enter key support
    // ==========================================

    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
    });

    document.getElementById('regConfirmPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('requestVerificationBtn').click();
    });

    document.getElementById('verificationCode').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('completeRegisterBtn').click();
    });

    // ==========================================
    // التحقق من الجلسة
    // ==========================================

    (function checkSession() {
      try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user && user.id) {
          window.location.href = '/dashboard.html';
        }
      } catch (e) {
        console.log('Session check:', e);
      }
    })();

    console.log('✅ CryptoShop - تسجيل الدخول عبر Google مفعل');
  </script>
</body>
</html>
