<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الشراء الجماعي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f0f2f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 400px; width: 100%; }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      border: 1px solid #00aa55;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 28px; color: #00aa55; }
    .logo p { color: #666; font-size: 14px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; color: #666; font-size: 13px; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
    }
    .input-group input:focus { outline: none; border-color: #00aa55; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #00aa55;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #008844; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #f5f5f5;
      padding: 4px;
      border-radius: 30px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
    }
    .tab.active { background: #00aa55; color: white; }
    .hidden { display: none; }
    .message { margin-top: 16px; padding: 12px; border-radius: 12px; text-align: center; font-size: 14px; }
    .error { background: #fee; border: 1px solid #ff4444; color: #ff4444; }
    .success { background: #efe; border: 1px solid #00aa55; color: #00aa55; }
    .theme-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(0,170,85,0.1);
      border: 1px solid #00aa55;
      color: #00aa55;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      z-index: 100;
    }
    body.dark-mode {
      background: #0a0a0f;
    }
    body.dark-mode .card {
      background: #1a1a2e;
      border-color: #00ff66;
    }
    body.dark-mode .logo h1 { color: #00ff66; }
    body.dark-mode .input-group input {
      background: #0a0a0f;
      border-color: #00ff66;
      color: white;
    }
    body.dark-mode .tabs { background: #1a1a2e; }
    body.dark-mode .tab { color: #8899aa; }
    body.dark-mode .tab.active { background: #00ff66; color: #0a0a0f; }
    body.dark-mode .theme-toggle {
      border-color: #00ff66;
      color: #00ff66;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle">☀️ وضع نهاري</button>

  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>🛍️ CryptoShop</h1>
        <p>شراء جماعي | أسعار الجملة</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab">تسجيل الدخول</button>
        <button class="tab" id="registerTab">إنشاء حساب</button>
      </div>

      <div id="loginForm">
        <div class="input-group">
          <label>📧 البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label>🔒 كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button class="btn" id="doLoginBtn">تسجيل الدخول</button>
      </div>

      <div id="registerForm" class="hidden">
        <div class="input-group">
          <label>👤 اسم المستخدم</label>
          <input type="text" id="regName" placeholder="أدخل اسمك">
        </div>
        <div class="input-group">
          <label>📧 البريد الإلكتروني</label>
          <input type="email" id="regEmail" placeholder="example@email.com">
        </div>
        <div class="input-group">
          <label>🔒 كلمة المرور</label>
          <input type="password" id="regPassword" placeholder="********">
        </div>
        <div class="input-group">
          <label>✔️ تأكيد كلمة المرور</label>
          <input type="password" id="regConfirmPassword" placeholder="********">
        </div>
        <div class="input-group">
          <label>🎁 رمز الدعوة (اختياري)</label>
          <input type="text" id="regReferral" placeholder="XXXXXX">
        </div>
        <button class="btn" id="doRegisterBtn">إنشاء حساب</button>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let currentTheme = localStorage.getItem('theme') || 'light';

    function setTheme(theme) {
      document.body.classList.toggle('dark-mode', theme === 'dark');
      document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '🌙 وضع ليلي' : '☀️ وضع نهاري';
      localStorage.setItem('theme', theme);
      currentTheme = theme;
    }

    document.getElementById('themeToggle').onclick = () => {
      setTheme(currentTheme === 'light' ? 'dark' : 'light');
    };
    setTheme(currentTheme);

    // التبويبات
    document.getElementById('loginTab').onclick = () => {
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('active');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('message').innerHTML = '';
    };
    document.getElementById('registerTab').onclick = () => {
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('message').innerHTML = '';
    };

    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="message ${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 5000);
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.textContent = loading ? '⏳ جاري...' : btn.id === 'doLoginBtn' ? 'تسجيل الدخول' : 'إنشاء حساب';
    }

    // تسجيل الدخول
    document.getElementById('doLoginBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('doLoginBtn');

      if (!email || !password) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          showMessage(data.error || '❌ فشل تسجيل الدخول', 'error');
          setLoading(btn, false);
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        setLoading(btn, false);
      }
    };

    // إنشاء حساب
    document.getElementById('doRegisterBtn').onclick = async () => {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;
      const referralCode = document.getElementById('regReferral').value.trim();
      const btn = document.getElementById('doRegisterBtn');

      if (!name || !email || !password || !confirm) {
        showMessage('⚠️ يرجى ملء جميع الحقول', 'error');
        return;
      }
      if (password !== confirm) {
        showMessage('⚠️ كلمة المرور غير متطابقة', 'error');
        return;
      }
      if (password.length < 4) {
        showMessage('⚠️ كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
        return;
      }

      setLoading(btn, true);

      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, referralCode })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage('✅ تم إنشاء الحساب بنجاح!', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          showMessage(data.error || '❌ فشل إنشاء الحساب', 'error');
          setLoading(btn, false);
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
        setLoading(btn, false);
      }
    };

    // Enter key
    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
    });
    document.getElementById('regConfirmPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('doRegisterBtn').click();
    });

    // التحقق من الجلسة
    (function() {
      const token = localStorage.getItem('token');
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (Date.now() < payload.exp * 1000) {
            window.location.href = '/dashboard.html';
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
