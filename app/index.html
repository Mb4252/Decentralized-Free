<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>لوحة المدير | منصة الاستثمار</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: linear-gradient(rgba(0,255,100,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,100,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 80px;
    }
    .navbar {
      background: rgba(10,10,20,0.8);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,255,100,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: bold; background: linear-gradient(135deg, #00ff66, #00ccff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .admin-email { color: #8899aa; font-size: 12px; }
    .logout-btn { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .content { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: rgba(20,20,35,0.6); backdrop-filter: blur(12px); border-radius: 20px; padding: 16px; text-align: center; border: 1px solid rgba(0,255,100,0.15); }
    .stat-value { font-size: 24px; font-weight: bold; color: #00ff66; }
    .stat-label { color: #8899aa; font-size: 12px; }
    .card { background: rgba(20,20,35,0.6); backdrop-filter: blur(12px); border-radius: 24px; padding: 20px; border: 1px solid rgba(0,255,100,0.15); margin-bottom: 24px; }
    .card-title { color: white; font-size: 18px; margin-bottom: 16px; border-right: 3px solid #00ff66; padding-right: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(0,255,100,0.1); color: #8899aa; }
    th { color: #00ff66; }
    .approve-btn { background: #00ff66; color: #0a0a0f; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; margin-left: 8px; }
    .reject-btn { background: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
    .nav-links { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-link { background: transparent; border: none; color: #8899aa; padding: 8px 20px; cursor: pointer; border-radius: 30px; }
    .nav-link.active { background: rgba(0,255,102,0.15); color: #00ff66; }
    .support-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #00ff66, #00ccff);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      z-index: 98;
    }
    @media (max-width: 768px) { th, td { font-size: 11px; padding: 8px; } .content { padding: 12px; } }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">👑 Admin Panel</div>
    <div><span class="admin-email" id="adminEmail"></span> <button class="logout-btn" id="logoutBtn">تسجيل خروج</button></div>
  </div>

  <div class="support-fab" id="supportFab">💬</div>

  <div class="content">
    <div class="nav-links">
      <button class="nav-link active" data-tab="deposits">📥 طلبات الإيداع</button>
      <button class="nav-link" data-tab="withdrawals">📤 طلبات السحب</button>
      <button class="nav-link" data-tab="users">👥 المستخدمين</button>
    </div>
    <div id="mainContent">⏳ جاري التحميل...</div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let userId = localStorage.getItem('userId');

    async function checkAdmin() {
      if (!userId) { window.location.href = '/'; return false; }
      const response = await fetch(`${API_URL}/api/user`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }) });
      const user = await response.json();
      if (!user.is_admin) { alert('ليس لديك صلاحية'); window.location.href = '/'; return false; }
      document.getElementById('adminEmail').innerHTML = user.email;
      return true;
    }

    async function fetchData(endpoint) {
      const response = await fetch(`${API_URL}/api/admin/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId }) });
      return response.json();
    }

    async function callAdminAPI(endpoint, data) {
      await fetch(`${API_URL}/api/admin/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId, ...data }) });
    }

    async function renderDeposits() {
      const deposits = await fetchData('deposits');
      const pending = deposits.filter(d => d.status === 'pending');
      const total = deposits.reduce((s, d) => s + d.amount, 0);
      document.getElementById('mainContent').innerHTML = `
        <div class="stats-grid"><div class="stat-card"><div class="stat-value">${pending.length}</div><div class="stat-label">⏳ قيد الانتظار</div></div><div class="stat-card"><div class="stat-value">${total.toFixed(2)} USDT</div><div class="stat-label">💰 إجمالي الإيداعات</div></div></div>
        <div class="card"><h2 class="card-title">⏳ طلبات الإيداع قيد الانتظار</h2><div id="pendingDeposits"></div></div>
        <div class="card"><h2 class="card-title">📋 سجل الإيداعات</h2><div id="depositHistory"></div></div>
      `;
      const pendingDiv = document.getElementById('pendingDeposits');
      if (pending.length === 0) pendingDiv.innerHTML = '<p style="color:#8899aa;">لا توجد طلبات</p>';
      else pendingDiv.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th>المستخدم</th><th>المبلغ</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${pending.map(d => `<tr><td>${d.users?.name || d.users?.email}</td><td>${d.amount} USDT</td><td>${new Date(d.created_at).toLocaleDateString('ar')}</td><td><button class="approve-btn" data-id="${d.id}" data-type="deposit" data-action="approve" data-user="${d.user_id}" data-amount="${d.amount}">✅ موافقة</button><button class="reject-btn" data-id="${d.id}" data-type="deposit" data-action="reject">❌ رفض</button></td></tr>`).join('')}</tbody></table></div>`;
      
      const history = deposits.filter(d => d.status !== 'pending');
      const historyDiv = document.getElementById('depositHistory');
      if (history.length === 0) historyDiv.innerHTML = '<p style="color:#8899aa;">لا يوجد سجل</p>';
      else historyDiv.innerHTML = `<div style="overflow-x:auto;"><tr><thead><tr><th>المستخدم</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${history.map(d => `<tr><td>${d.users?.name || d.users?.email}</td><td>${d.amount} USDT</td><td>${new Date(d.created_at).toLocaleDateString('ar')}</td><td style="color:${d.status === 'approved' ? '#00ff66' : '#ff4444'}">${d.status === 'approved' ? 'تمت الموافقة' : 'مرفوض'}</td></tr>`).join('')}</tbody></table></div>`;
      attachEvents();
    }

    async function renderWithdrawals() {
      const withdrawals = await fetchData('withdrawals');
      const pending = withdrawals.filter(w => w.status === 'pending');
      const total = withdrawals.reduce((s, w) => s + w.amount, 0);
      document.getElementById('mainContent').innerHTML = `
        <div class="stats-grid"><div class="stat-card"><div class="stat-value">${pending.length}</div><div class="stat-label">⏳ قيد الانتظار</div></div><div class="stat-card"><div class="stat-value">${total.toFixed(2)} USDT</div><div class="stat-label">📤 إجمالي السحوبات</div></div></div>
        <div class="card"><h2 class="card-title">⏳ طلبات السحب قيد الانتظار</h2><div id="pendingWithdrawals"></div></div>
        <div class="card"><h2 class="card-title">📋 سجل السحوبات</h2><div id="withdrawHistory"></div></div>
      `;
      const pendingDiv = document.getElementById('pendingWithdrawals');
      if (pending.length === 0) pendingDiv.innerHTML = '<p style="color:#8899aa;">لا توجد طلبات</p>';
      else pendingDiv.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th>المستخدم</th><th>المبلغ</th><th>المحفظة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${pending.map(w => `<tr><td>${w.users?.name || w.users?.email}</td><td>${w.amount} USDT</td><td>${w.wallet_address?.substring(0,15)}...</td><td>${new Date(w.created_at).toLocaleDateString('ar')}</td><td><button class="approve-btn" data-id="${w.id}" data-type="withdraw" data-action="approve" data-user="${w.user_id}" data-amount="${w.amount}">✅ صرف</button><button class="reject-btn" data-id="${w.id}" data-type="withdraw" data-action="reject" data-user="${w.user_id}" data-amount="${w.amount}">❌ رفض</button></td></tr>`).join('')}</tbody></table></div>`;
      
      const history = withdrawals.filter(w => w.status !== 'pending');
      const historyDiv = document.getElementById('withdrawHistory');
      if (history.length === 0) historyDiv.innerHTML = '<p style="color:#8899aa;">لا يوجد سجل</p>';
      else historyDiv.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th>المستخدم</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${history.map(w => `<tr><td>${w.users?.name || w.users?.email}</td><td>${w.amount} USDT</td><td>${new Date(w.created_at).toLocaleDateString('ar')}</td><td style="color:${w.status === 'approved' ? '#00ff66' : '#ff4444'}">${w.status === 'approved' ? 'تم الصرف' : 'مرفوض'}</td></tr>`).join('')}</tbody></table></div>`;
      attachEvents();
    }

    async function renderUsers() {
      const users = await fetchData('users');
      document.getElementById('mainContent').innerHTML = `
        <div class="stats-grid"><div class="stat-card"><div class="stat-value">${users.length}</div><div class="stat-label">👥 إجمالي المستخدمين</div></div></div>
        <div class="card"><h2 class="card-title">📋 قائمة المستخدمين</h2><div id="usersList"></div></div>
      `;
      document.getElementById('usersList').innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th>الاسم</th><th>البريد</th><th>المستوى</th><th>الاستثمار</th><th>الرصيد</th><th>مدير</th></tr></thead><tbody>${users.map(u => `<tr><td>${u.name || '-'}</td><td>${u.email}</td><td>VIP ${u.vip_level || 0</td><td>${u.active_deposit || 0} USDT</td><td>${u.available_balance || 0} USDT</td><td>${u.is_admin ? '✅' : '❌'}</td></tr>`).join('')}</tbody></table></div>`;
    }

    function attachEvents() {
      document.querySelectorAll('.approve-btn, .reject-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = parseInt(btn.getAttribute('data-id'));
          const type = btn.getAttribute('data-type');
          const action = btn.getAttribute('data-action');
          const targetUserId = btn.getAttribute('data-user');
          const amount = parseFloat(btn.getAttribute('data-amount'));
          if (type === 'deposit') {
            if (action === 'approve') await callAdminAPI('approve-deposit', { depositId: id, userId: targetUserId, amount });
            else await callAdminAPI('reject-deposit', { depositId: id });
          } else {
            if (action === 'approve') await callAdminAPI('approve-withdraw', { withdrawalId: id, userId: targetUserId, amount });
            else await callAdminAPI('reject-withdraw', { withdrawalId: id, userId: targetUserId, amount });
          }
          const activeTab = document.querySelector('.nav-link.active').getAttribute('data-tab');
          if (activeTab === 'deposits') await renderDeposits();
          else if (activeTab === 'withdrawals') await renderWithdrawals();
        };
      });
    }

    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); window.location.href = '/'; };
    document.getElementById('supportFab').onclick = () => { window.open('https://t.me/+fPunvn_76Q45NDg8', '_blank'); };
    document.querySelectorAll('.nav-link').forEach(link => {
      link.onclick = async () => {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        const tab = link.getAttribute('data-tab');
        if (tab === 'deposits') await renderDeposits();
        else if (tab === 'withdrawals') await renderWithdrawals();
        else if (tab === 'users') await renderUsers();
      };
    });

    (async () => { if (await checkAdmin()) await renderDeposits(); })();
  </script>
</body>
</html>
