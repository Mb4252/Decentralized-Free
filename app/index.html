<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الاستثمار | تسجيل الدخول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #0f3460;
      border-radius: 24px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
    }
    h1 { font-size: 32px; color: #e94560; text-align: center; margin-bottom: 32px; }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: none;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .link-btn {
      background: transparent;
      color: #e94560;
      margin-top: 12px;
      border: 1px solid #e94560;
    }
    .message { margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; }
    .error { background: #ef444420; border: 1px solid #ef4444; color: #ef4444; }
    .success { background: #22c55e20; border: 1px solid #22c55e; color: #22c55e; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💰 منصة الاستثمار</h1>
    
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="loginPassword" placeholder="كلمة المرور">
      <button id="doLoginBtn">تسجيل الدخول</button>
      <button id="showRegisterBtn" class="link-btn">إنشاء حساب جديد</button>
    </div>

    <div id="registerForm" class="hidden">
      <input type="text" id="regName" placeholder="اسم المستخدم">
      <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="regPassword" placeholder="كلمة المرور">
      <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة المرور">
      <input type="text" id="regReferral" placeholder="رمز الدعوة (اختياري)">
      <button id="doRegisterBtn">إنشاء حساب</button>
      <button id="showLoginBtn" class="link-btn">لديك حساب؟ تسجيل الدخول</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    let users = JSON.parse(localStorage.getItem('users') || '[]');

    function showMessage(msg, type) {
      const div = document.getElementById('message');
      div.innerHTML = `<div class="message ${type}">${msg}</div>`;
      setTimeout(() => div.innerHTML = '', 5000);
    }

    document.getElementById('showRegisterBtn').onclick = () => {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    };

    document.getElementById('showLoginBtn').onclick = () => {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    };

    document.getElementById('doLoginBtn').onclick = () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showMessage('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور', 'error');
        return;
      }

      const user = users.find(u => u.email === email && u.password === password);
      
      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        showMessage('✅ تم تسجيل الدخول بنجاح!', 'success');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
      } else {
        showMessage('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
      }
    };

    document.getElementById('doRegisterBtn').onclick = () => {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const referralCode = document.getElementById('regReferral').value;

      if (!name || !email || !password || !confirmPassword) {
        showMessage('⚠️ يرجى ملء جميع الحقول المطلوبة', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('⚠️ كلمة المرور وتأكيدها غير متطابقين', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
        return;
      }

      if (users.find(u => u.email === email)) {
        showMessage('❌ هذا البريد مسجل بالفعل', 'error');
        return;
      }

      let referrerId = null;
      if (referralCode) {
        const referrer = users.find(u => u.referral_code === referralCode);
        if (referrer) {
          referrerId = referrer.id;
        } else {
          showMessage('⚠️ رمز الدعوة غير صحيح', 'error');
          return;
        }
      }

      const newUser = {
        id: Date.now(),
        name: name,
        email: email,
        password: password,
        referral_code: Math.random().toString(36).substring(2, 10).toUpperCase(),
        referrer_id: referrerId,
        package: 'basic',
        available_balance: 0,
        active_deposit: 0,
        total_withdrawn: 0,
        total_deposited: 0,
        daily_withdraw_limit: 10,
        created_at: new Date().toISOString()
      };

      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('currentUser', JSON.stringify(newUser));
      
      showMessage(`✅ تم إنشاء الحساب بنجاح! رمز الدعوة: ${newUser.referral_code}`, 'success');
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
    };
  </script>
</body>
</html>
